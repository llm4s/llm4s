# Scala Steward repository configuration, read by .github/workflows/scala-steward.yml.
# Reference: https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# The workflow runs weekly; this also stops a manual dispatch from re-opening a PR for the
# same dependency within the week.
pullRequests.frequency = "7 days"

# At most this many PRs are created or updated per run, so the first run (and any week with
# a pile-up) doesn't flood the review queue; the rest follow on later runs.
updates.limit = 10

# Leave a new release alone for a few days: a broken release is usually retracted or
# patched within that time.
updates.cooldown = { minimumAge: "3 days" }

# Conventional-commit prefix, matching Dependabot's `build(deps):` PRs.
commits.message = "build(deps): update ${artifactName} from ${currentVersion} to ${nextVersion}"

# Every commit on a PR must pass the DCO check (.github/workflows/dco.yml and the DCO app).
# Commits from the Scala Steward GitHub App are already exempt as a `[bot]` identity; signing
# off as well keeps the check green if the workflow is ever switched to a personal token.
signoffCommits = true

pullRequests.customLabels = [ "dependencies", "scala-steward" ]

# Families released in lock-step go in one PR, so a half-bumped family never lands.
#
# Deliberately NOT grouped: com.anthropic:anthropic-java and com.openai:openai-java. Each SDK
# bump changes the wire behaviour of a provider module and gets reviewed (and smoke-tested)
# on its own. There is also no catch-all group - an update matching no group gets its own PR.
pullRequests.grouping = [
  { name = "opentelemetry", title = "build(deps): update OpenTelemetry", filter = [
    { group = "io.opentelemetry" }
  ] },
  # Jackson only reaches the build transitively today (through the SDKs), so this group is
  # dormant until someone declares or overrides a Jackson artifact directly.
  { name = "jackson", title = "build(deps): update Jackson", filter = [
    { group = "com.fasterxml.jackson" },
    { group = "com.fasterxml.jackson.core" },
    { group = "com.fasterxml.jackson.datatype" },
    { group = "com.fasterxml.jackson.module" },
    { group = "com.fasterxml.jackson.dataformat" }
  ] },
  { name = "aws-sdk", title = "build(deps): update AWS SDK", filter = [
    { group = "software.amazon.awssdk" }
  ] },
  { name = "upickle", title = "build(deps): update uPickle/ujson", filter = [
    { group = "com.lihaoyi", artifact = "upickle" },
    { group = "com.lihaoyi", artifact = "ujson" }
  ] },
  { name = "test-libraries", title = "build(deps): update test libraries", filter = [
    { group = "org.scalatest" },
    { group = "org.scalatestplus" },
    { group = "org.scalamock" }
  ] }
]

# Held majors, each already recorded against its version in project/Dependencies.scala.
# Remove a pin when that upgrade is taken on deliberately.
updates.pin = [
  # HikariCP 7.x is a two-major jump with a higher JDK baseline.
  { groupId = "com.zaxxer", artifactId = "HikariCP", version = "5." },
  # cask 0.x minor bumps can be breaking.
  { groupId = "com.lihaoyi", artifactId = "cask", version = "0.10." },
  # neo4j-java-driver 6.x is held with the neo4j-harness / Netty constraint.
  { groupId = "org.neo4j.driver", artifactId = "neo4j-java-driver", version = "5." },
  # sbt 2 is a build migration (plugins, syntax), not a version bump.
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]
