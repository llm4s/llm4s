# Example prod-like config for policy-as-code CI checks.
# Use: sbt "configPolicy/runMain org.llm4s.configpolicy.CheckPolicies --env=prod --config=config/examples/application-prod.conf"
# Set OPENAI_API_KEY (or other provider key) in env when running locally; CI may use a placeholder.
llm4s {
  llm {
    model = "openai/gpt-4o-mini"
  }
  openai {
    baseUrl = "https://api.openai.com/v1"
    # apiKey from env OPENAI_API_KEY
  }
}
