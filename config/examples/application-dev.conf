# Example dev config for policy-as-code CI checks.
# Use: sbt "configPolicy/runMain org.llm4s.configpolicy.CheckPolicies --env=dev --config=config/examples/application-dev.conf"
# No API key required when using Ollama.
llm4s {
  llm {
    model = "ollama/llama3"
  }
  ollama {
    baseUrl = "http://localhost:11434"
  }
}
