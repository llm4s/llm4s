# Site settings
title: LLM4S
description: >-
  LLM4S - Large Language Models for Scala. A comprehensive, type-safe framework
  for building LLM-powered applications with multi-provider support, agents,
  tools, and observability.
baseurl: ""
url: "https://llm4s.org"
logo: "/image_assets/llm4s_logo.png"

# Author: jekyll-seo-tag's `author` meta tag, twitter:creator (a handle, so `twitter` is set) and the JSON-LD author (#2316)
author:
  name: LLM4S Foundation
  type: Organization
  url: https://llm4s.org/foundation/
  twitter: llm4sfoundation
  email: hello@llm4s.org

# Build settings
markdown: kramdown
theme: just-the-docs
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# Code block settings
enable_copy_code_button: true

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Collections for organized content
collections:
  guide:
    output: true
    permalink: /guide/:name
  examples:
    output: true
    permalink: /examples/:name
  advanced:
    output: true
    permalink: /advanced/:name
  api:
    output: true
    permalink: /api/:name

# Defaults
defaults:
  # The share card (og:image, twitter:image) of every page, and one per landing page and docs section below: rendered
  # by scripts/render-social-images.sh from docs/image_assets/social/ (#2316). The alt text says what the card says.
  - scope:
      path: ""
    values:
      layout: "default"
      image:
        path: /image_assets/social/default.png
        width: 1200
        height: 630
        alt: "LLM4S: LLM framework for Scala and the JVM. llm4s.org"
  - scope:
      path: "why-llm4s.md"
    values:
      image:
        path: /image_assets/social/why-llm4s.png
        width: 1200
        height: 630
        alt: "Why LLM4S: LLM applications in Scala, on the JVM you already run. llm4s.org"
  - scope:
      path: "learn.md"
    values:
      image:
        path: /image_assets/social/learn.png
        width: 1200
        height: 630
        alt: "Learn LLM4S: from your first LLM call to agents, RAG, tools and MCP. llm4s.org"
  - scope:
      path: "showcase.md"
    values:
      image:
        path: /image_assets/social/showcase.png
        width: 1200
        height: 630
        alt: "LLM4S Showcase: open-source projects built with LLM4S. llm4s.org"
  - scope:
      path: "foundation.md"
    values:
      image:
        path: /image_assets/social/foundation.png
        width: 1200
        height: 630
        alt: "LLM4S Foundation: support the foundation that stewards LLM4S. llm4s.org"
  - scope:
      path: "getting-started"
    values:
      image:
        path: /image_assets/social/getting-started.png
        width: 1200
        height: 630
        alt: "LLM4S Getting Started: install LLM4S and run your first program. llm4s.org"
  - scope:
      path: "guide"
    values:
      image:
        path: /image_assets/social/guide.png
        width: 1200
        height: 630
        alt: "LLM4S User Guide: providers, agents, tools, RAG and observability. llm4s.org"
  - scope:
      path: "examples"
    values:
      image:
        path: /image_assets/social/examples.png
        width: 1200
        height: 630
        alt: "LLM4S Examples: runnable Scala samples, from a first LLM call to agents. llm4s.org"
  - scope:
      path: "reference"
    values:
      image:
        path: /image_assets/social/reference.png
        width: 1200
        height: 630
        alt: "LLM4S Reference: API stability, compatibility, security and the roadmap. llm4s.org"
  # Keep the generated API docs and the slide decks out of sitemap.xml (#2318). The Scaladoc has its own
  # scaladoc-sitemap.xml, written by scripts/generate-scaladoc-sitemap.sh in the Pages workflow.
  - scope:
      path: "scaladoc"
    values:
      sitemap: false
  - scope:
      path: "image_assets"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "guide"
    values:
      layout: "page"
      parent: "User Guide"
  - scope:
      path: ""
      type: "examples"
    values:
      layout: "page"
      parent: "Examples"
  - scope:
      path: ""
      type: "advanced"
    values:
      layout: "page"
      parent: "Advanced Topics"
  - scope:
      path: ""
      type: "api"
    values:
      layout: "page"
      parent: "API Reference"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/

# Social links
github_username: llm4s
discord_invite: https://discord.gg/4uvTPn6qww

# Google Analytics (optional - add when ready)
# google_analytics: UA-XXXXXXXXX-X

# SEO settings
# Search Console / Bing verification (#2318, a maintainer step): add the tokens from each tool here, e.g.
# webmaster_verifications:
#   google: <token>
#   bing: <token>
twitter:
  username: llm4sfoundation
  card: summary_large_image

social:
  name: LLM4S
  links:
    - https://github.com/llm4s/llm4s
    - https://discord.gg/4uvTPn6qww
    - https://www.linkedin.com/company/llm4s-foundation/
    - https://www.reddit.com/user/llm4s_foundation/
    - https://x.com/llm4sfoundation/
    - https://bsky.app/profile/llm4s-foundation.bsky.social
    - https://mastodon.social/@llm4s_foundation/
    - https://www.instagram.com/llm4s/

# ----- just-the-docs theme settings -----

# Aux links (appear in header). _includes/components/aux_nav.html opens only the external ones in a new tab and
# shows "Sponsor" as a button.
aux_links:
  "Sponsor":
    - "/foundation/"
  "GitHub":
    - "https://github.com/llm4s/llm4s"
  "Discord":
    - "https://discord.gg/4uvTPn6qww"

aux_links_new_tab: true

# Enable "Edit this page on GitHub" link
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/llm4s/llm4s"
gh_edit_branch: "main"
gh_edit_source: "docs"
gh_edit_view_mode: "edit"

# Footer content
footer_content: >-
  LLM4S is released under the <a href="https://github.com/llm4s/llm4s/blob/main/LICENSE">MIT License</a>.
  Version: <code>{{ site.data.project.version }}</code>

# Enable last modified date on pages
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Search settings
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Color scheme (light/dark)
color_scheme: light

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"
