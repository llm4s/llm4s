# Project numbers shown in the stats band of the home page (_includes/stats-band.html) and on the Foundation page.
# The GitHub numbers and `as_of` are refreshed from the GitHub API on every deploy and daily by
# scripts/update-site-stats.sh (run by .github/workflows/pages.yml), so the values here are only the fallback used
# when the API cannot be reached; there is no need to edit them by hand. The talks count is computed from _data/events.yml at build time, so it needs no edit here.
# Never round up or add a number that cannot be checked from a public source.

as_of: "Nov 2026"
source_note: "GitHub, as of Nov 2026. Activity is also tracked on LFX Insights."
lfx_insights: https://insights.linuxfoundation.org/project/llm4s

github:
  - value: "276"
    label: GitHub stars
    url: https://github.com/llm4s/llm4s/stargazers
  - value: "135"
    label: Forks
    url: https://github.com/llm4s/llm4s/forks
  - value: "77"
    label: Contributors
    url: https://github.com/llm4s/llm4s/graphs/contributors
  - value: "1,337"
    label: Merged pull requests
    url: https://github.com/llm4s/llm4s/pulls?q=is%3Apr+is%3Amerged
  - value: "27"
    label: Releases
    url: https://github.com/llm4s/llm4s/releases
