# Talks, workshops and other LLM4S events, shown on /events/ and on the home page.
#
# Keep entries in date order. Fields:
#   start       first day, YYYY-MM-DD (required)
#   end         last day, for multi-day events
#   starts_at   start time with its UTC offset (ISO 8601), when known; the home page counts down to it
#   time        local time as shown to readers, e.g. "12:00-13:00 IST"
#   event       the conference or meetup (required)
#   title       the talk (required)
#   location    venue and city (required)
#   speakers    list of names (required)
#   url         the event's page
#   recording   the recording
#   slides      list of {label, url}; paths under /image_assets are site-relative
#   image       banner, site-relative
#
# An event is upcoming until the end of its last day; the page re-sorts in the browser, so a
# finished event moves to "Past talks" without a rebuild. The weekly Dev Hour is not listed here:
# the page computes its next session (see _includes/events-script.html).

