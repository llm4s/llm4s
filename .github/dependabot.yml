version: 2
updates:
  # Keeps GitHub Actions pinned to non-vulnerable versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

# sbt dependencies are NOT managed here. Scala Steward owns them
# (.github/workflows/scala-steward.yml, .scala-steward.conf): it resolves the
# build with sbt itself, applies Scalafix migrations and bumps scalaVersion.
# Dependabot gained an `sbt` ecosystem in May 2026 (version updates only), but
# enabling it as well would open a second PR for every bump - don't add it
# without removing Scala Steward.
