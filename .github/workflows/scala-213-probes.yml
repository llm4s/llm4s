name: Scala 2.13 probes

# Compiles and runs the Scala 2.13 probes (docs/design/scala-2.13-interop/probes, #1460) against this checkout's own
# artifacts, through the TASTy reader, and fails when any probe's outcome differs from the checked-in table
# (docs/design/scala-2.13-interop/expected.md), in either direction (#2301). A change to a frozen signature can
# silently break a Scala 2.13 caller (an opaque type, a uPickle type class in a signature, a top-level companion);
# and a fix that makes a blocked probe compile must update the table and docs/getting-started/scala-2-13.md with it.
# It needs a publishLocal of nine modules and Maven Central, so it runs nightly and when the frozen modules,
# llm4s-java-api, the build or the probes change, not on every pull request.

on:
  schedule:
    - cron: "41 3 * * *"  # 03:41 UTC every day
  pull_request:
    paths:
      - modules/media/src/main/**
      - modules/core/src/main/**
      - modules/agent/src/main/**
      - modules/ollama/src/main/**
      - modules/openai/src/main/**
      - modules/openai-compatible/src/main/**
      - modules/anthropic/src/main/**
      - modules/gemini/src/main/**
      - modules/java-api/src/main/**
      - build.sbt
      - project/**
      - docs/design/scala-2.13-interop/**
      - .github/workflows/scala-213-probes.yml
  push:
    branches: [main]
    paths:
      - modules/media/src/main/**
      - modules/core/src/main/**
      - modules/agent/src/main/**
      - modules/ollama/src/main/**
      - modules/openai/src/main/**
      - modules/openai-compatible/src/main/**
      - modules/anthropic/src/main/**
      - modules/gemini/src/main/**
      - modules/java-api/src/main/**
      - build.sbt
      - project/**
      - docs/design/scala-2.13-interop/**
      - .github/workflows/scala-213-probes.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probes:
    name: Scala 2.13 probes (2.13.16 and latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before setup-java: it installs a JVM of its own and points JAVA_HOME at it. The probes pick JDK 21 themselves
      # (`//> using jvm 21` in common/project.scala); sbt runs on the JDK 21 setup-java installs next.
      - uses: VirtusLab/scala-cli-setup@3f5bf11a33bb88343238780c18257c8fa43789e1 # v1.18.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Publish the probed modules to the runner's ~/.ivy2/local
        # A fixed version, so the probes need not chase sbt-dynver's. llm4s-java-api's dependencies (the provider
        # modules it builds clients for) are published too, or its ivy.xml would not resolve.
        run: >-
          sbt 'set ThisBuild / version := "0.0.0-probes"'
          media/publishLocal core/publishLocal openaiCompatible/publishLocal openai/publishLocal
          anthropic/publishLocal gemini/publishLocal ollama/publishLocal agent/publishLocal javaApi/publishLocal

      - name: Run the probes and compare with expected.md
        run: docs/design/scala-2.13-interop/run-probes.sh --local 0.0.0-probes --check expected.md 2.13.16 latest
