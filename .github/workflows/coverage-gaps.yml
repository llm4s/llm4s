name: Coverage Gaps Analysis

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-coverage-gaps:
    name: Analyze Coverage Gaps
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Run tests with coverage
        env:
          PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/postgres
          PGVECTOR_USER: postgres
          PGVECTOR_PASSWORD: postgres
          PGVECTOR_TEST_USER: postgres
          PGVECTOR_TEST_PASSWORD: postgres
        run: sbt coverage core/test coverageAggregate

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Analyze coverage gaps
        run: |
          python3 scripts/analyze-coverage.py --local --output coverage-gaps.txt
          cat coverage-gaps.txt

      - name: Create summary markdown
        id: coverage-summary
        run: |
          python3 scripts/generate-coverage-summary.py
          cat coverage-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Post coverage gaps comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const gapsReport = fs.readFileSync('coverage-gaps.txt', 'utf8');
            
            // Create a collapsible details section to keep the comment compact
            const comment = `## 📊 Test Coverage Analysis
            
            <details>
            <summary>Click to view coverage gaps</summary>
            
            \`\`\`
            ${gapsReport}
            \`\`\`
            
            </details>
            
            📚 **Tips for improving coverage:**
            - Focus on files with the lowest coverage percentages
            - Add tests for uncovered functions listed in the report
            - Run \`sbt coverage core/test coverageReport\` locally to explore coverage details
            - See [Testing Guide](https://llm4s.org/reference/testing-guide.html) for best practices`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-analysis
          path: |
            coverage-gaps.txt
            target/scala-3.7.1/scoverage-report/
            modules/*/target/scala-3.7.1/scoverage-report/
          retention-days: 30

      - name: Comment on findings if coverage is low
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('coverage-gaps.txt', 'utf8');
            
            // Check if any module has coverage below 50%
            if (report.includes('✗')) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '⚠️ **Coverage Alert**: Some modules have coverage below 60%. Consider adding tests for these areas.'
              });
            }
