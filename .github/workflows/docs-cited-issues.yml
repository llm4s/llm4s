name: Docs Cited Issues

# Fails when a docs page cites an llm4s issue as open and it has closed, or as done and it is open (#2290):
# docs/guide/comparison.md described six closed issues as missing features before this existed. Every page that links
# an issue declares how it cites each one in its front matter (cites_open_issues, cites_closed_issues, cites_issues),
# and every page the site serves is checked (#2833); see scripts/check-cited-issues.sh. Quick Checks checks the
# declarations offline; an issue can close at any time, so the states are checked weekly as well as on docs changes.

on:
  schedule:
    - cron: '23 6 * * 1'   # weekly: Monday 06:23 UTC
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-cited-issues.sh'
      - 'scripts/test-check-cited-issues.sh'
      - '.github/workflows/docs-cited-issues.yml'
  workflow_dispatch:

concurrency:
  group: docs-cited-issues-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  cited-issues:
    name: Cited issues are in their stated state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the check
        run: scripts/test-check-cited-issues.sh

      - name: Check the issues every docs page cites
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-cited-issues.sh
