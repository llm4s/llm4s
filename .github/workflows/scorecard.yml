# OpenSSF Scorecard (#2306): scores the repository's supply-chain practices (pinned actions, token permissions, branch
# protection, signed releases, ...), publishes the result to https://scorecard.dev/viewer/?uri=github.com/llm4s/llm4s
# (the README badge reads it) and uploads the findings to the repository's code scanning alerts.
# The baseline and the checks deliberately not addressed are in docs/reference/security.md.
name: Scorecard supply-chain security

on:
  # Branch-Protection is re-scored when a rule changes.
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'   # weekly: 04:30 UTC on Monday
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the job adds only what publishing needs.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Results can be published only from the default branch of the upstream repository.
    if: github.repository == 'llm4s/llm4s'
    permissions:
      security-events: write  # to upload the SARIF to code scanning
      id-token: write         # to publish the results to the OpenSSF REST API (and get the badge)
      contents: read
      actions: read           # to read the workflow runs the CI-Tests check scores

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
