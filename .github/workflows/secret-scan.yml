name: Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # A GitHub merge queue on main (#1638) waits for every required check to report on its merge group.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 3 * * 1" # optional weekly scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Fetch full history so TruffleHog can optionally scan history
          fetch-depth: 0

      - name: Run TruffleHog on repo
        # Pinned to the v3.95.3 release commit (no floating `v3` tag exists upstream)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: .
          # The action works out what to scan from push and pull_request events only; for any other event it scans the
          # whole history. A merge group carries its own range, so scan just what the queue would land on main. On every
          # other event these are empty and the action keeps its own choice.
          base: ${{ github.event.merge_group.base_sha }}
          head: ${{ github.event.merge_group.head_sha }}
          # Scan the current commit (HEAD). Maintainers can adjust to history mode if desired.
          extra_args: "--only-verified"
