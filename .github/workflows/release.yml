name: Release

on:
  push:
    tags:
      - "v[0-9]*"

# Read-only by default; a job that needs more declares it (#2306, OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  # Run CI checks first
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # A release tag must be the `latest` line of docs/_data/support.yml, the Support Policy's table, before anything is
  # published (#2289): the table is updated by hand in the release pull request (docs/reference/release.md).
  support-table:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag is in the support table
        run: scripts/check-support-table.sh --tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}

  publish:
    needs: [ci, support-table]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # For trusted publishing, and the Sigstore certificate that signs the provenance
      attestations: write  # SLSA build provenance for every file staged for Maven Central (#2305)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Needed for sbt-dynver
      
      - name: Setup JVM
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"
          problem-matcher: true

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps
      
      - name: Setup sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      
      - name: Import GPG key
        run: |
          echo "${{ secrets.PGP_SECRET }}" | base64 --decode | gpg --batch --import
          echo "GPG keys imported:"
          gpg --list-secret-keys

      # The Scaladoc of the released code, checked before anything is signed or uploaded (#1967). The -javadoc.jars do
      # not carry it (each is a pointer to https://llm4s.org/scaladoc/, project/JavadocPointer.scala), so `ci-release`
      # never runs `doc`: this step is what keeps a release from shipping a Scaladoc warning, which the Pages workflow's
      # site Scaladoc would then publish. Scaladoc ignores `-Werror` and `-Wconf`, so a broken `[[link]]` never fails
      # `doc`; the log is read instead, as in CI's ScalaDoc job. It fails on a warning in an llm4s source, or in a
      # third-party source that is not on scripts/scaladoc-third-party-warnings.txt. `ci-release` then reuses the
      # compiled classes.
      - name: Check Scaladoc warnings
        run: |
          set -o pipefail
          scripts/test-check-scaladoc-warnings.sh
          sbt doc 2>&1 | tee scaladoc.log
          scripts/check-scaladoc-warnings.sh scaladoc.log
        env:
          SBT_OPTS: "-Xmx4G -XX:+UseG1GC"

      # Every module's -javadoc.jar is the small pointer and none is missing: Maven Central refuses a release without
      # one, and the full Scaladoc in each jar once put a release over Sonatype's monthly size limit.
      - name: Check the javadoc jars
        run: sbt javadocJarCheck
        env:
          SBT_OPTS: "-Xmx4G -XX:+UseG1GC"

      # `sbt ci-release` on a tag runs `clean`, `publishSigned` into the local staging directory (target/sona-staging,
      # build.sbt's `publishTo`) and then the command in CI_SONATYPE_RELEASE, by default `sonaRelease`, which uploads
      # the bundle the build's `sonaBundle` makes: no checksums of the signatures and no SBOMs, checked file by file and
      # capped at Sonatype's 1,000 files a month (project/CentralBundle.scala). Here it runs `sonaBundle` instead, which
      # only checks and zips it, so the staged files can be attested before anything irreversible happens; `sonaRelease`
      # below then uploads the same directory (#2305). What reaches Central is unchanged: the same signed files, by the
      # same route. The SBOMs go on the GitHub Release, and are attested there (the `sbom` job).
      - name: Build, sign and stage the release
        run: sbt ci-release
        env:
          SBT_OPTS: "-Xmx4G -XX:+UseG1GC"
          CI_SONATYPE_RELEASE: sonaBundle
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      # Attested in the job that built them: attesting files downloaded back from Central would prove nothing.
      # `gh attestation verify <file> -R llm4s/llm4s` checks one (docs/reference/verifying-releases.md).
      - name: Attest build provenance of the staged artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/sona-staging/**/*.jar
            target/sona-staging/**/*.pom

      - name: Upload the staged release to Maven Central
        run: sbt sonaRelease
        env:
          SBT_OPTS: "-Xmx4G -XX:+UseG1GC"
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  # org.llm4s:llm4s-kotlin-api, built by Gradle: publish-kotlin.yml, which can also be run by hand for a tag (#1494).
  # It runs after `publish` and is its own job, so a failure here can be re-run alone: `publish` cannot be re-run once
  # the sbt artifacts are on Central. `github-release` waits for both, so a Release is announced only when every
  # artifact of the version, the Kotlin one included, is on its way to Central.
  publish-kotlin:
    needs: publish
    uses: ./.github/workflows/publish-kotlin.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      attestations: write

  # Publish the GitHub Release. This is what makes a release visible in the repo UI and
  # what notifies anyone watching "Releases only" -- neither happened automatically
  # before, so every release relied on someone remembering.
  #
  # It runs after `publish` and `publish-kotlin` so a Release can only ever exist for a version
  # that actually reached Maven Central, Kotlin artifact included, and *before* `docs`, because the docs deploy reads the
  # published version from the Releases API.
  github-release:
    needs: [publish, publish-kotlin]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A semver pre-release identifier (v1.0.0-RC1) must be marked as such, or it
          # becomes GitHub's "latest" release -- which the docs deploy reads to decide
          # which version the install snippets name. An RC must not displace the last
          # stable version there.
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          # Idempotent, and specifically draft-aware. `gh release view` succeeds for a
          # DRAFT release, so an existence check alone would skip creation and leave the
          # draft in place. Drafts are excluded from the `releases/latest` endpoint the
          # docs deploy reads, so the site would then keep advertising the previous
          # version while the new artifacts were already on Maven Central. Deleting a tag
          # that has a Release attached leaves exactly such a draft behind, which is a
          # documented recovery path in docs/reference/release.md -- so this is reachable,
          # not hypothetical.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "Release $GITHUB_REF_NAME exists as a draft; publishing it."
              gh release edit "$GITHUB_REF_NAME" --draft=false $PRERELEASE
            else
              echo "Release $GITHUB_REF_NAME already published; leaving it untouched."
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $PRERELEASE
          fi

  # A CycloneDX SBOM and a licence report per published module, attached to the GitHub Release
  # (docs/reference/sbom.md, docs/reference/licences.md).
  #
  # It runs after the Release exists and nothing depends on it, so a failure here turns the run red but cannot
  # touch what is already irreversible (Maven Central, the Release), the docs deploy or the container image.
  # `--clobber` makes a re-run replace the assets instead of failing on them.
  sbom:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # the Sigstore certificate that signs the provenance
      attestations: write  # SLSA build provenance for the BOMs and licence reports (#2305)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Needed for sbt-dynver: the BOMs are named and versioned from the tag

      - name: Setup JVM
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"
          problem-matcher: true

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - name: Setup sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Generate and check the SBOMs and licence reports
        run: |
          sbt -batch publishedSboms licenseReport
          sbt -batch -no-colors -error listPublishedArtifacts | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -E '^(artifact|stub) ' > target/published-artifacts.txt
          scripts/check-sbom.sh target/sboms target/published-artifacts.txt
          # A BOM named for a snapshot would be attached to the wrong release: sbt-dynver derives the version from
          # the tag, so every file must carry exactly the tag's version.
          VERSION="${GITHUB_REF_NAME#v}"
          WRONG="$( (ls target/sboms | grep -vF -- "-${VERSION}.bom.json"; ls target/licences | grep -vF -- "-${VERSION}.licences.csv") || true)"
          if [ -n "$WRONG" ]; then
            echo "These BOMs or licence reports are not named for ${VERSION}:"
            echo "$WRONG"
            exit 1
          fi

      # A BOM downloaded from the Release is tied to this run by `gh attestation verify <file> -R llm4s/llm4s`.
      - name: Attest build provenance of the SBOMs and licence reports
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/sboms/*.bom.json
            target/licences/*.licences.csv

      - name: Attach the SBOMs and licence reports to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/sboms/*.bom.json target/licences/*.licences.csv --clobber

  # Deploy the docs once the release is published and visible. Deliberately independent
  # of the container image below: a registry failure must not leave llm4s.org advertising
  # the previous version when the release itself succeeded.
  #
  # pages.yml is DISPATCHED on `main` with this tag as its `ref`, not called as a reusable workflow.
  # A called workflow runs on the caller's ref, here the tag, and the `github-pages` environment
  # allows deployments only from `main`, so it rejected the deploy on every release (#1152). The
  # dispatched run deploys from `main` and builds the tag's content. This job waits for that run and
  # fails if the deploy fails, so the release does not go green over a docs deploy that never happened.
  # (An environment rule for `v*` tags would also fix it; see docs/reference/release.md.)
  docs:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write  # to dispatch pages.yml and read its run; pages: write belongs to that run, not this job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A warning, never a failure: the post can follow on main (docs/reference/release.md#write-the-news-post, #2319).
      - name: Check the release has a News post
        run: scripts/new-release-post.sh --check "${GITHUB_REF_NAME#v}"

      - name: Deploy the docs from main, built from this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/dispatch-docs-deploy.sh "$GITHUB_REF_NAME"

  # Container image. Split out of `publish` so that a registry failure cannot fail the
  # release after the artifacts are already on Maven Central and irreversible.
  docker:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push the image, and its provenance beside it
      id-token: write  # the Sigstore certificate that signs the provenance
      attestations: write  # SLSA build provenance for the image (#2305)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Needed for sbt-dynver

      - name: Setup JVM
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"
          problem-matcher: true

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - name: Setup sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: image
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          sbt "workspaceRunner/Docker/publishLocal"
          # The Docker plugin builds with the version tag, not 'latest'
          docker tag llm4s/workspace-runner:${VERSION#v} ghcr.io/${{ github.repository_owner }}/workspace-runner:latest
          docker tag llm4s/workspace-runner:${VERSION#v} ghcr.io/${{ github.repository_owner }}/workspace-runner:${VERSION#v}
          docker push ghcr.io/${{ github.repository_owner }}/workspace-runner:${VERSION#v}
          docker push ghcr.io/${{ github.repository_owner }}/workspace-runner:latest
          # The digest both tags now name in the registry: the provenance is bound to it, not to a tag.
          IMAGE="ghcr.io/${{ github.repository_owner }}/workspace-runner"
          DIGEST="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:${VERSION#v}" | grep -F "$IMAGE@sha256:" | head -1)"
          [ -n "$DIGEST" ] || { echo "No registry digest for $IMAGE:${VERSION#v} after the push."; exit 1; }
          echo "digest=${DIGEST#*@}" >> "$GITHUB_OUTPUT"

      # `gh attestation verify oci://ghcr.io/llm4s/workspace-runner:<version> -R llm4s/llm4s` checks it.
      - name: Attest build provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/workspace-runner
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false  # a storage record needs `artifact-metadata: write`; the attestation does not
