            modules/*/target/scala-3.7.1/scoverage-report/
          retention-days: 14

  # Main test matrix
  test:
    name: Test
    needs: [quick-checks]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [21]

    runs-on: ${{ matrix.os }}
    # Healthy runs take up to about 50 minutes on Windows; the default limit is 360, so a hung run would hold
    # the PR for six hours.
    timeout-minutes: 90
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'
      
      - uses: sbt/setup-sbt@v1
      
      - name: Run tests
        run: sbt test
      
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/target/test-reports/
            **/target/scala-3.7.1/test-reports/
          retention-days: 5

  # Tier 2: containerised integration tests — pgvector, Qdrant and Neo4j as service
  # containers. Reproducible and secret-free, so unlike the Ollama and cloud tiers this
  # runs on every PR. `LLM4S_IT_STRICT=true` makes a suite that cannot reach its service
  # fail instead of skip: this job promises the services are there, so a skip here would be
  # the same silent non-execution that #1143 was about.
  integration-tests:
    name: Integration Tests
    needs: quick-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      qdrant:
        image: qdrant/qdrant:v1.13.0
        ports:
          - 6333:6333

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/llm4stest
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      # Postgres is covered by the service health check above. The Qdrant and Neo4j images
      # ship no shell tooling to health-check with, so poll them from the runner instead —
      # and fail the job if they never come up, rather than letting the suites skip.
      - name: Wait for Qdrant and Neo4j
        run: |
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -sf "$2" > /dev/null; then echo "$1 is ready"; return 0; fi
              sleep 2
            done
            echo "$1 did not become ready within 120s" >&2
            exit 1
          }
          wait_for Qdrant http://localhost:6333/readyz
          wait_for Neo4j http://localhost:7474

      - name: Run containerised integration tests
        env:
          LLM4S_IT_STRICT: "true"
          PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/postgres
          PGVECTOR_USER: postgres
          PGVECTOR_PASSWORD: postgres
          PGVECTOR_TEST_USER: postgres
          PGVECTOR_TEST_PASSWORD: postgres
          POSTGRES_TEST_ENABLED: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          QDRANT_TEST_URL: http://localhost:6333
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: llm4stest
        run: sbt testIntegration

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-integration
          path: |
            modules/it/target/**/test-reports/
          retention-days: 5

  # Binary compatibility (MiMa). Only the frozen modules have a baseline (see `mimaFrozen` in
  # build.sbt), and none until 0.5.0 is published (#1281), so this checks nothing yet. The build
  # is Scala 3 only, with no `crossScalaVersions`, so a bare `mimaReportBinaryIssues` covers every
  # artifact; use `+mimaReportBinaryIssues` if a second Scala version returns (#1126).
  mima-check:
    name: Binary Compatibility (MiMa)
    needs: quick-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      # Resolving the baseline and the build's artifacts from Maven Central can hit a connection reset (seen once,
      # run 37316745524: "download error: Caught java.net.SocketException (Connection reset)"); the wrapper
      # re-runs the step on that kind of error only. A binary-compatibility failure is never retried.
      - name: Check binary compatibility
        run: scripts/retry-on-transient-network.sh sbt mimaReportBinaryIssues

  # Kotlin coroutine API and the Java sample (modules/samples/gradle-java): separate Gradle builds that consume
  # llm4s-java-api from local Maven, so they share one publish of the library.
  kotlin-api:
    name: Kotlin API
    needs: quick-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Publish the library modules to local Maven
        # Pin to 0.1.0-SNAPSHOT so build.gradle.kts can reference a stable coordinate without
        # chasing dynver-generated versions. llm4s-java-api's POM depends on core, agent and the
        # provider modules, so all of them must be in the local repository, not just llm4s-java-api.
        run: sbt 'set ThisBuild / version := "0.1.0-SNAPSHOT"' publishM2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and test Kotlin API with coverage check
        working-directory: modules/kotlin-api
        run: gradle check

      # Compiles the Java sample against the library just published, so it cannot drift from the API it shows.
      - name: Build the Java sample
        working-directory: modules/samples/gradle-java
        run: gradle build installDist

      - name: Upload Kotlin coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-coverage-report
          path: modules/kotlin-api/build/reports/jacoco/
          retention-days: 14

  # All tests must pass
  all-tests-pass:
    name: All Tests Pass
    if: always()
    needs: [test, coverage, config-policy-check, scaladoc, integration-tests, mima-check, kotlin-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check all tests passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Some tests failed"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "Coverage job failed"
            exit 1
          fi
          if [[ "${{ needs.config-policy-check.result }}" != "success" ]]; then
            echo "Config policy check failed"
            exit 1
          fi
          if [[ "${{ needs.scaladoc.result }}" != "success" ]]; then
            echo "ScalaDoc job failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.mima-check.result }}" != "success" ]]; then
            echo "Binary compatibility check failed"
            exit 1
          fi
          if [[ "${{ needs.kotlin-api.result }}" != "success" ]]; then
            echo "Kotlin API tests failed"
            exit 1
          fi
          echo "All tests passed!"

  # Tier 3: Ollama integration tests — verifies full round-trip against a real
  # local LLM. Only runs on pushes to main to avoid slowing down PR builds.
  #
  # Carries a pgvector service as well as Ollama, because the RAG pipeline suite needs both:
  # real embeddings are the whole point of it, and pgvector is where the hybrid-search half
  # stores them. A suite declares exactly one tier, so the tier its scarcer dependency
  # belongs to has to supply the rest.
  ollama-integration:
    name: Ollama Integration
    needs: quick-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server is ready"
              break
            fi
            echo "Waiting for Ollama server... ($i/30)"
            sleep 1
          done

      # Two models: one to answer with, one to embed with. RAGPipelineOllamaIntegrationSpec
      # is the only suite in the repo that exercises retrieval against a real embedding
      # model, so leaving nomic-embed-text out would make it fail rather than skip here.
      - name: Pull test models
        run: |
          ollama pull qwen2.5:0.5b
          ollama pull nomic-embed-text

      - name: Run Ollama integration tests
        env:
          # This job installs Ollama, pulls the models and runs pgvector, so "not available"
          # here is a failure, not a reason to skip.
          LLM4S_IT_STRICT: "true"
          PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/postgres
          PGVECTOR_USER: postgres
          PGVECTOR_PASSWORD: postgres
        run: sbt testOllama

  # Tier 2: containerised workspace tests. Split from the `integration-tests` job because
  # this one has to build the workspace-runner image first (apt + sdkman + the Scala 3
  # toolchain), which is far too slow for every PR. The image tag comes from the build
  # itself — `it / Test / envVars` passes `workspaceRunner / Docker / version` to the suite.
  workspace-integration:
    name: Workspace Integration
    needs: quick-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # The image tag is derived from the version, which sbt-dynver reads from git
          # describe; a shallow clone with no tags yields a different tag than the test
          # is told to expect.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Build the workspace-runner image
        run: sbt workspaceRunner/Docker/publishLocal

      - name: Run containerised workspace tests
        env:
          LLM4S_IT_STRICT: "true"
          LLM4S_DOCKER_TESTS: "true"
        run: sbt testWorkspace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-workspace
          path: |
            modules/it/target/**/test-reports/
          retention-days: 5

  # Tier 4: Cloud smoke tests — minimal sanity checks against real cloud APIs.
  # Manual trigger only (workflow_dispatch) to avoid unintended API costs.
  cloud-smoke:
    name: Cloud Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Run cloud smoke tests
        env:
          # `LLM4S_IT_STRICT=true` turns a missing key into a failure. Without it this job
          # reported success while testing nothing — which is what GeminiSmokeSpec has been
          # doing all along: it reads GEMINI_API_KEY, and only GOOGLE_API_KEY was passed.
          LLM4S_IT_STRICT: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          # Speech smoke suites (modules/it, org.llm4s.speech): OpenAI TTS/STT reuse OPENAI_API_KEY.
          # With LLM4S_IT_STRICT=true each of these must be a repository secret, or its suite fails.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          # LangfuseSmokeSpec (llm4s-observability). LANGFUSE_URL is optional: unset, it is
          # Langfuse Cloud. The LLM in that suite is a mock, so it costs only a trace.
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_URL: ${{ secrets.LANGFUSE_URL }}
          # Keys for the smoke suites added with the new providers. With LLM4S_IT_STRICT=true each
          # one that is missing from the repository secrets makes its suite FAIL (not skip).
          # MistralSmokeSpec, ZaiSmokeSpec, JinaEmbeddingsSmokeSpec, StableDiffusionSmokeSpec.
          # (CohereEmbeddingsSmokeSpec reads COHERE_API_KEY, set above for CohereSmokeSpec.)
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          # BedrockSmokeSpec: AWS_REGION plus credentials the default chain finds
          # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, optionally AWS_SESSION_TOKEN).
          # BEDROCK_MODEL_ID is optional; unset, the suite uses its built-in default model.
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
        run: sbt testSmoke
