      # The data and report of each module this leg reported on, for the `Code Coverage` job's aggregate report. On a
      # fresh runner only those modules have a scoverage-report. A dependency's data (compiled and measured here too)
      # is left out: its statement ids differ from one compile to the next, so it must not overwrite the owning leg's.
      # Not on a pull request, where the aggregate report is not built (see the `coverage` job).
      - name: Collect this leg's coverage data
        if: github.event_name != 'pull_request'
        env:
          MODULES: ${{ join(matrix.modules, ' ') }}
        run: |
          mkdir -p coverage-out
          n=0
          while IFS= read -r report; do
            dir="${report%/scoverage-report}"
            mkdir -p "coverage-out/$dir"
            cp -R "$report" "$dir/scoverage-data" "coverage-out/$dir/"
            n=$((n + 1))
          done < <(find modules -type d -path '*/target/scala-3.7.1/scoverage-report')
          read -ra owned <<< "$MODULES"
          expected=${#owned[@]}
          echo "collected $n module report(s); the leg owns $expected"
          [ "$n" -eq "$expected" ]

      - name: Upload this leg's coverage data
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.leg }}
          path: coverage-out/
          retention-days: 1
          if-no-files-found: error

  # The coverage gate: green only when every leg is. `All Tests Pass` needs this job, so the required-check story is
  # what it was with one coverage job, and the check is still called `Code Coverage`. Off pull requests it also writes
  # the informational aggregate report, from the legs' coverage data (statement files and measurements; no compile).
  # On a pull request nobody reads that report (Codecov has the legs' own uploads), so the job is the gate alone: one
  # step, no checkout and no sbt, a few seconds instead of about two minutes.
  coverage:
    name: Code Coverage
    needs: [changes, coverage-leg]
    # It runs when a leg fails, to report it (`!cancelled()`); on a pull request only when it changes code, as the legs.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check every coverage leg passed
        run: |
          if [[ "${{ needs.coverage-leg.result }}" != "success" ]]; then
            echo "A coverage leg failed (result: ${{ needs.coverage-leg.result }}); see the Code Coverage (<leg>) jobs"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
        if: github.event_name != 'pull_request'

      - name: Download the legs' coverage data
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Aggregate the coverage report
        if: github.event_name != 'pull_request'
        run: scripts/retry-on-transient-network.sh sbt coverageAggregate

      - name: Upload coverage report artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            target/scala-3.7.1/scoverage-report/
            modules/**/target/scala-3.7.1/scoverage-report/
          retention-days: 14

  # The tests of the modules no coverage leg runs. Every module the root project aggregates is tested by exactly one of
  # the four `Code Coverage (<leg>)` jobs, instrumented, or by this job, in TEST_MODULES below:
  # scripts/check-coverage-legs.sh (Quick Checks) fails when one is in neither, or in both. This used to be `sbt test`,
  # which ran every module's tests a second time, uninstrumented, after the legs had run them, and was the longest job
  # of a run. Every module's main and test sources are still compiled by some job: Quick Checks compiles the main
  # sources, and each leg and this job compile the tests they run.
  #
  # The JDK matrix has one entry: it is where project/CompatibilityMatrix.scala and scripts/check-doc-support.sh read
  # which JDKs CI runs.
  test:
    name: Test (other modules, JDK ${{ matrix.java }})
    needs: [changes]
    # On a pull request only when it changes code (`changes`; never on a draft).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    permissions:
      contents: read
    strategy:
      matrix:
        java: [21]
    env:
      TEST_MODULES: >-
        samples configPolicy it springBootStarterBoot4 knowledgegraphNeo4j benchmarks
        workspaceShared workspaceRunner workspaceClient workspaceSamples
        scalafixRules scalafixInput scalafixOutput scalafixTests scalafixInput05 scalafixTests05
        bom relocationCore relocationWorkspaceClient relocationWorkspaceShared relocationTraceOpentelemetry
        relocationKnowledgegraphNeo4j

    runs-on: ubuntu-latest
    # Healthy runs take about 10 minutes; the default limit is 360, so a hung run would hold the PR for six hours.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      # The MCP Python SDK, pinned, for samples' PythonToolBridgeExampleSpec (#2333): it starts sentiment_tool.py with
      # the `python3` first on the PATH, so the venv goes there. Without it the spec is cancelled, not run.
      - name: Install the MCP Python SDK for the Python sidecar sample
        run: |
          python3 -m venv "$RUNNER_TEMP/mcp-venv"
          "$RUNNER_TEMP/mcp-venv/bin/pip" install --quiet -r modules/samples/src/main/python/requirements.txt
          echo "$RUNNER_TEMP/mcp-venv/bin" >> "$GITHUB_PATH"

      # Compiled-output cache pilot: the target directories the nightly run on main saved for this job kind, so a
      # pull request compiles only what changed since (zinc keys sources by content, not timestamp). Keyed by job kind:
      # instrumented classes (a coverage leg) must never meet uninstrumented ones. Test reports and coverage
      # measurements are left out of the entry. compiled-cache.yml keeps one entry per kind.
      - name: Restore the compiled output
        id: compiled
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/target
            !**/target/**/test-reports
            !**/target/**/scoverage-report
            !**/target/**/scoverage-data/scoverage.measurements.*
            !**/target/sboms
            !**/target/docker
          key: compiled-v1-test-${{ github.run_id }}
          restore-keys: compiled-v1-test-

      - name: Resolve the dependencies
        run: scripts/retry-on-transient-network.sh sbt resolveAll

      # The unforked suites (samples, ...) run inside the sbt JVM, and outgrew .sbtopts' 2 GB heap (OutOfMemoryError in
      # the launcher from 00a4d3e8 on). The flag comes after .sbtopts' -J-Xmx2g, so it wins; local runs keep 2 GB.
      - name: Run tests
        run: |
          args=()
          for m in $TEST_MODULES; do args+=("$m/test"); done
          echo "sbt -J-Xmx4g ${args[*]}"
          sbt -J-Xmx4g "${args[@]}"

      # Saved by the nightly run (and a manual run, to measure the pilot), never by a pull request or a push.
      - name: Save the compiled output
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/target
            !**/target/**/test-reports
            !**/target/**/scoverage-report
            !**/target/**/scoverage-data/scoverage.measurements.*
            !**/target/sboms
            !**/target/docker
          key: compiled-v1-test-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-ubuntu
          path: |
            **/target/test-reports/
            **/target/scala-3.7.1/test-reports/
          retention-days: 5

  # Windows runs `sbt testPlatform`: only the tests of what differs between platforms - file paths, separators,
  # permissions and links, deleting or moving an open file, spawning processes and their argument parsing, SQLite files
  # and their locks, line endings written to files, temporary files, the user's home - as project/PlatformTests.scala
  # lists them. Pure JVM logic runs on the same JVM on both, so running all of it again on Windows cost some 15 minutes a
  # PR and added no signal.
  #
  # The rule for new code: a test of platform-sensitive behaviour must run on Windows, so it goes in a module of
  # `PlatformTests.wholeModules` or is named in `PlatformTests.suites`. scripts/check-platform-tests.sh (Quick
  # Checks) enforces it for every main source that calls a platform-sensitive API, against
  # scripts/platform-sensitive-sources.txt, and `sbt testPlatform` fails when a suite it names no longer exists.
  test-windows:
    name: Test (Windows)
    needs: [changes]
    # On a pull request only when it changes something Windows tests (`changes`: a whole module of PlatformTests, a
    # source platform-sensitive-sources.txt lists, a suite it names, or a build file), and not on a push to main: the
    # nightly run runs it there.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.windows != 'false' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
    runs-on: windows-latest
    # Healthy runs take about 11-14 minutes.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      # The step runs in PowerShell, which cannot run the bash retry wrapper; this job is not part of the parallel burst
      # that rate-limited the ubuntu jobs on 2026-11-20.
      - name: Run tests
        run: sbt testPlatform

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-windows
          path: |
            **/target/test-reports/
            **/target/scala-3.7.1/test-reports/
          retention-days: 5

  # The performance tier: tests tagged `PerformanceTest` (org.llm4s.testutil.TestTags), which check how an
  # operation's cost grows with its input - linear, not quadratic - with `LinearTime.assertLinear`. `sbt test`
  # and the coverage run leave them out: algorithmic growth is the same on every platform, so running them on
  # Windows and under coverage instrumentation only multiplied their cost (they were most of each test job's
  # time, #1932). Here they run once, uninstrumented, on Linux, in parallel with the other test jobs: on a pull request
  # that changes core, agent or a build file, and in the nightly run (which replaced performance-nightly.yml). Gating, through `All Tests Pass`: it is the only check of linear-time growth;
  # `sbt test` keeps only megabyte hang guards. `sbt testPerformance` compiles and runs only core and agent, the modules
  # with tagged tests (`performanceTestProjects` in build.sbt, checked by Quick Checks), not every module's tests.
  performance-tests:
    name: Performance tests
    needs: [changes]
    # Not on a draft, not on a push to main (the nightly run runs it there), and on a pull request only when it changes
    # core, agent or media, or a build file (`changes`): the only modules with tagged tests, and what they test.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.draft != 'true' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main') &&
      needs.changes.outputs.performance != 'false' }}
    runs-on: ubuntu-latest
    # Healthy runs take about 10 minutes; the default limit is 360, so a hung run would hold the PR for six hours.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Resolve the dependencies
        run: scripts/retry-on-transient-network.sh sbt resolveAll

      - name: Run performance tests
        run: sbt testPerformance

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-performance
          path: |
            **/target/test-reports/
            **/target/scala-3.7.1/test-reports/
          retention-days: 5

  # Tier 2: containerised integration tests — pgvector, Qdrant and Neo4j as service
  # containers. Reproducible and secret-free, so unlike the Ollama and cloud tiers this
  # runs on every PR. `LLM4S_IT_STRICT=true` makes a suite that cannot reach its service
  # fail instead of skip: this job promises the services are there, so a skip here would be
  # the same silent non-execution that #1143 was about.
  integration-tests:
    name: Integration Tests
    needs: [changes]
    # On a pull request only when it changes modules/it, deploy/, config/ or a module the @Docker suites reach
    # (`changes`; never on a draft).
    if: ${{ !cancelled() && needs.changes.outputs.integration != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      qdrant:
        image: qdrant/qdrant:v1.13.0
        ports:
          - 6333:6333

      # ElasticsearchVectorStoreSpec (#1469): one node, security off, a small heap.
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200

      # OpenSearchVectorStoreSpec (#1469): one node with the k-NN plugin, the security plugin (and its demo
      # certificates and admin password) off, a small heap. Host port 9201: Elasticsearch has 9200.
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
      # RedisVectorStoreSpec (#1470): Redis with the Redis Query Engine (search) module.
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6379:6379

      # ValkeyVectorStoreSpec (#1470): Valkey with valkey-search, through the same store.
      valkey:
        image: valkey/valkey-bundle:9.0.6
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6380:6379

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/llm4stest
        ports:
          - 7687:7687
          - 7474:7474

      # VaultApiKeyProviderIntegrationSpec (#2479): Vault in dev mode, KV v2 mounted at secret/, a known root token.
      vault:
        image: hashicorp/vault:1.18
        env:
          VAULT_DEV_ROOT_TOKEN_ID: llm4s-it-root-token
        ports:
          - 8200:8200

      # AwsSecretsManagerApiKeyProviderIntegrationSpec (#2479): moto's Secrets Manager, which accepts any credentials.
      moto:
        image: motoserver/moto:5.2.5
        ports:
          - 5000:5000

      # KafkaTicketPipelineSpec (#2297): a single-node broker in KRaft mode, advertised on localhost:9092.
      kafka:
        image: apache/kafka:3.9.1
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      # LiteLLMGatewaySpec (#2315): the enterprise overlay's gateway, a LiteLLM proxy, routing to a fake upstream that
      # the suite runs on this runner at port 18089 (host.docker.internal from inside the container). Started here
      # rather than as a service container because it needs the checked-out config file. Same image as the overlay.
      - name: Start LiteLLM gateway
        run: |
          docker run -d --name litellm --add-host=host.docker.internal:host-gateway -p 4000:4000 \
            -e LITELLM_MASTER_KEY=sk-it-master-0001 -e UPSTREAM_API_KEY=sk-it-upstream-0001 \
            -e LITELLM_LOCAL_MODEL_COST_MAP=True \
            -v "$GITHUB_WORKSPACE/modules/it/src/test/resources/litellm/gateway-it.yaml:/app/config.yaml:ro" \
            ghcr.io/berriai/litellm:main-v1.83.14-stable --config /app/config.yaml --port 4000

      # Postgres, Redis and Valkey are covered by the service health checks above. The Qdrant and Neo4j images
      # ship no shell tooling to health-check with, so poll them from the runner instead —
      # and fail the job if they never come up, rather than letting the suites skip.
      - name: Wait for Qdrant, Neo4j, Elasticsearch, OpenSearch, Vault, moto and LiteLLM
        run: |
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -sf "$2" > /dev/null; then echo "$1 is ready"; return 0; fi
              sleep 2
            done
            echo "$1 did not become ready within 120s" >&2
            return 1
          }
          wait_for Qdrant http://localhost:6333/readyz
          wait_for Neo4j http://localhost:7474
          wait_for Elasticsearch "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          wait_for OpenSearch "http://localhost:9201/_cluster/health?wait_for_status=yellow&timeout=5s"
          wait_for LiteLLM http://localhost:4000/health/liveliness || { docker logs litellm; exit 1; }
          wait_for Vault http://localhost:8200/v1/sys/health
          wait_for moto http://localhost:5000/moto-api/

      # The suites run with coverage instrumentation on the modules whose code only they reach against real services
      # (#2349): the pgvector, Qdrant and permission-index stores in rag, the Elasticsearch/OpenSearch and
      # Redis/Valkey stores, memory-postgres, the Neo4j graph store, and the Postgres checkpointer and run queue.
      # Each module's report is uploaded below under the flag its coverage leg uploads, and Codecov merges the two
      # uploads of a flag on a commit, so the integration hits count towards patch and project coverage.
      #
      # Only COVERAGE_MODULES are instrumented (not `sbt coverage`, which would instrument every dependency of
      # modules/it and slow the compile), and their floors are switched off for this run: a report here measures only
      # the integration suites, and each floor is enforced by the module's coverage leg on its own tests.
      # scripts/check-coverage-legs.sh checks this list against the upload steps below.
      # With `coverage`, which adds scoverage's runtime to every project's dependencies: a superset of what the
      # instrumented modules below need.
      - name: Resolve the dependencies
        run: scripts/retry-on-transient-network.sh sbt coverage resolveAll

      - name: Run containerised integration tests
        env:
          COVERAGE_MODULES: rag vectorstoreElasticsearch vectorstoreRedis memoryPostgres knowledgegraphNeo4j agentCheckpointPostgres secretsVault secretsAws
          LLM4S_IT_STRICT: "true"
          PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/postgres
          PGVECTOR_USER: postgres
          PGVECTOR_PASSWORD: postgres
          PGVECTOR_TEST_USER: postgres
          PGVECTOR_TEST_PASSWORD: postgres
          POSTGRES_TEST_ENABLED: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          QDRANT_TEST_URL: http://localhost:6333
          ELASTICSEARCH_TEST_URL: http://localhost:9200
          OPENSEARCH_TEST_URL: http://localhost:9201
          REDIS_TEST_URL: redis://localhost:6379
          VALKEY_TEST_URL: redis://localhost:6380
          KAFKA_TEST_BOOTSTRAP: localhost:9092
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: llm4stest
          LITELLM_TEST_URL: http://localhost:4000
          LITELLM_TEST_MASTER_KEY: sk-it-master-0001
          LITELLM_TEST_UPSTREAM_KEY: sk-it-upstream-0001
          VAULT_TEST_ADDR: http://localhost:8200
          VAULT_TEST_TOKEN: llm4s-it-root-token
          AWS_SECRETS_MANAGER_TEST_ENDPOINT: http://localhost:5000
        run: |
          settings=()
          reports=()
          for m in $COVERAGE_MODULES; do
            settings+=("set $m / coverageEnabled := true" "set $m / coverageFailOnMinimum := false"
                       "set $m / coverageMinimumStmtTotal := 0")
            reports+=("$m/coverageReport")
          done
          echo "sbt ${settings[*]} testIntegration ${reports[*]}"
          sbt "${settings[@]}" testIntegration "${reports[@]}"

      # One upload per module in COVERAGE_MODULES, under the same flag as that module's coverage-leg upload.
      - name: Upload rag integration coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/rag/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: rag
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload vectorstore-elasticsearch integration coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/vectorstore-elasticsearch/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: vectorstore-elasticsearch
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload vectorstore-redis integration coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/vectorstore-redis/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: vectorstore-redis
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload memory-postgres integration coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/memory-postgres/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: memory-postgres
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      # knowledgegraph-neo4j is in no coverage leg (scripts/check-coverage-legs.sh, EXEMPT), so this is its only upload.
      - name: Upload knowledgegraph-neo4j integration coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/knowledgegraph-neo4j/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: knowledgegraph-neo4j
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload agent-checkpoint-postgres integration coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/agent-checkpoint-postgres/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: agent-checkpoint-postgres
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload secrets-vault integration coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/secrets-vault/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: secrets-vault
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload secrets-aws integration coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/secrets-aws/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: secrets-aws
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-integration
          path: |
            modules/it/target/**/test-reports/
          retention-days: 5

      - name: Show LiteLLM gateway logs
        if: failure()
        run: docker logs litellm || true

  # Everything built outside sbt against the library as published to local Maven, in one job with one `publishM2`
  # (it used to be three jobs, Kotlin API, Quarkus extension and Micronaut and Helidon samples, each publishing the whole
  # library first): the Kotlin coroutine API and its Maven Central publication, the Java, Maven, BOM, doctor and REPL
  # consumers, the Quarkus extension and its sample (#2280), and the Micronaut and Helidon samples (#2281). Each
  # consumer is its own named step that runs once the publish has succeeded, whatever the steps before it did
  # (`!cancelled() && steps.publish.outcome == 'success'`), so one consumer's failure does not hide another's. The
  # Quarkus extension and the samples' tests run against stub servers or FakeLlmClient: no model, no key, no Docker.
  consumers:
    name: Kotlin, Java and framework consumers
    needs: [changes]
    # On a pull request only when it changes the Java, Kotlin, Spring or Quarkus modules, what they build on, or what
    # this job checks (`changes`), and not on a push to main: the nightly run runs it there.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.consumers != 'false' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    # Healthy runs take about 15 minutes.
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Check the Micronaut and Helidon guides' snippets are the samples'
        run: scripts/check-framework-guide-snippets.sh

      - name: Publish the library modules to local Maven
        id: publish
        if: ${{ !cancelled() }}
        # Pin to 0.1.0-SNAPSHOT so build.gradle.kts can reference a stable coordinate without
        # chasing dynver-generated versions. llm4s-java-api's POM depends on core, agent and the
        # provider modules, so all of them must be in the local repository, not just llm4s-java-api.
        run: scripts/retry-on-transient-network.sh sbt 'set ThisBuild / version := "0.1.0-SNAPSHOT"' publishM2

      # The Maven Central bundle `sbt ci-release` uploads, built as the release builds it but signed with a throwaway key
      # and never uploaded: `publishSigned` at a release version writes the local staging directory, and `sonaBundle`
      # (project/CentralBundle.scala) zips it, failing on a checksum of a signature, a CycloneDX SBOM, a file without its
      # .asc, .md5 and .sha1, more than 16 files for one artifact, or more than Sonatype's 1,000 files a month in all.
      # The classes are already compiled by the step above.
      - name: Dry-run the Maven Central bundle
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          set -o pipefail
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --pinentry-mode loopback --passphrase ci-dry-run \
            --quick-gen-key 'llm4s CI dry run <ci-dry-run@llm4s.invalid>' rsa3072 sign never
          PGP_PASSPHRASE=ci-dry-run sbt 'set ThisBuild / version := "0.1.0"' 'set ThisBuild / isSnapshot := false' \
            publishSigned sonaBundle 2>&1 | tee bundle.log | grep -E '\[error\]|Maven Central bundle'

      - name: Setup Gradle
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
          # Licence: v6's default 'enhanced' cache provider (gradle-actions-caching) is
          # proprietary, under the Gradle Terms of Use. 'basic' is MIT-licensed, keeping
          # llm4s CI fully open source.
          cache-provider: basic

      - name: Build and test Kotlin API with coverage check
        id: kotlin
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: modules/kotlin-api
        run: gradle check

      # The Maven Central publication of org.llm4s:llm4s-kotlin-api, as release.yml builds it but unsigned (no secret
      # here), written to a file repository: its POM must carry the sbt artifacts' metadata and name llm4s-java-api_3 at
      # the same version, it must have sources and javadoc jars, and a throwaway Gradle project that takes its version
      # from llm4s-bom must compile Kotlin code against it (#1494).
      - name: Dry-run the Kotlin API's Maven Central publication
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          (cd modules/kotlin-api && gradle publishMavenPublicationToStagingRepository)
          scripts/check-kotlin-publication.sh 0.1.0-SNAPSHOT modules/kotlin-api/build/staging-deploy

      # The release signs the publication with an in-memory key (release.yml, publish-kotlin). This signs it the same way
      # with a throwaway key made here, so the signing configuration is exercised without the release secret: every file
      # must get a signature that verifies.
      - name: Dry-run signing the Kotlin API's publication with a throwaway key
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --pinentry-mode loopback --passphrase ci-dry-run \
            --quick-gen-key 'llm4s CI dry run <ci-dry-run@llm4s.invalid>' rsa3072 sign never
          ORG_GRADLE_PROJECT_signingKey="$(gpg --batch --pinentry-mode loopback --passphrase ci-dry-run --armor --export-secret-keys)"
          export ORG_GRADLE_PROJECT_signingKey ORG_GRADLE_PROJECT_signingPassword=ci-dry-run
          rm -rf modules/kotlin-api/build/staging-deploy
          (cd modules/kotlin-api && gradle publishMavenPublicationToStagingRepository)
          REQUIRE_SIGNATURES=1 SKIP_CONSUMER=1 scripts/check-kotlin-publication.sh 0.1.0-SNAPSHOT modules/kotlin-api/build/staging-deploy
          for f in modules/kotlin-api/build/staging-deploy/org/llm4s/llm4s-kotlin-api/0.1.0-SNAPSHOT/*.{pom,jar,module}; do
            gpg --batch --verify "$f.asc" "$f"
          done

      # Compiles the Java sample against the library just published, so it cannot drift from the API it shows, and runs
      # AsyncCalls, which answers from FakeLlmClient and needs no API key.
      - name: Build the Java sample
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: modules/samples/gradle-java
        run: gradle build installDist runAsyncCalls

      # The Maven sample (docs/getting-started/maven.md), compiled the same way, with its enforcer rules.
      - name: Build the Maven sample
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: modules/samples/maven-java
        run: mvn -q -B compile

      # A Gradle and a Maven project that import llm4s-bom and declare two modules with no version must build
      # against the library just published, and a Gradle project without the BOM must not (#1462).
      - name: Build a Gradle and a Maven project against llm4s-bom
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          REQUIRE_MAVEN: '1'
        run: scripts/check-bom-consumers.sh 0.1.0-SNAPSHOT

      # The doctor as docs/reference/doctor.md tells a user to run it, against the library just published and from
      # empty directories: `cs launch` with llm4s-ollama only (whose report must register `ollama` alone), and a Maven
      # and a Gradle project reading their own application.conf (#2283).
      - name: Launch the doctor from cs, Maven and Gradle
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          REQUIRE_MAVEN: '1'
          REQUIRE_GRADLE: '1'
        run: scripts/check-doctor-launch.sh 0.1.0-SNAPSHOT

      # The Quarkus extension (modules/quarkus), pinned in modules/quarkus/pom.xml. Its QuarkusUnitTest suites: the client
      # beans from properties, a misconfigured provider failing the build with a message naming the property, the
      # readiness check UP and DOWN, a user's bean replacing the client.
      - name: Build and test the Quarkus extension
        id: quarkus
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: modules/quarkus
        run: mvn -B --no-transfer-progress install

      # The Quarkus sample (docs/guide/quarkus.md), on the extension just installed. Its @QuarkusTest runs the
      # extension's client against a stub Ollama server (#1468).
      - name: Build and test the Quarkus sample
        if: ${{ !cancelled() && steps.quarkus.outcome == 'success' }}
        working-directory: modules/samples/quarkus-java
        run: |
          ../../../scripts/check-quarkus-guide-snippets.sh
          mvn -q -B verify

      # The Micronaut and Helidon samples (docs/guide/micronaut.md, docs/guide/helidon.md). Their tests replace the
      # client with FakeLlmClient, so they need no model and no key (#2281).
      - name: Build and test the Micronaut sample
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: modules/samples/micronaut-java
        run: gradle build

      - name: Build and test the Helidon sample
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: modules/samples/helidon-java
        run: gradle build

      # Last of the builds: scala-cli-setup installs a JVM of its own and points JAVA_HOME at it, so the Maven and Gradle
      # builds above would compile against that JVM ("release version 21 not supported") if they came after it.
      - uses: VirtusLab/scala-cli-setup@3f5bf11a33bb88343238780c18257c8fa43789e1 # v1.18.0
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}

      # examples/repl's Scala CLI script and Metals worksheet, run with `scala-cli run` against the llm4s-repl just
      # published and Session.offline, so with no API key (#2342).
      - name: Run the llm4s-repl script and worksheet with Scala CLI
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: scripts/check-repl-scripts.sh 0.1.0-SNAPSHOT

      - name: Upload Kotlin coverage report
        if: ${{ !cancelled() && steps.kotlin.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-coverage-report
          path: modules/kotlin-api/build/reports/jacoco/
          retention-days: 14

  # The Spring compatibility ranges, tested at the newest end: the starter is built against the oldest supported Spring
  # Boot 3.x and llm4s-spring-ai against the oldest Spring AI 2.0.x (project/Dependencies.scala), and `sbt test` runs
  # their specs there, as it runs springBootStarterBoot4's on the Boot 4.0 line (Versions.springBoot4Baseline). This runs
  # the same specs on the latest Spring Boot 3.x (#1467), the latest 4.x (springBootStarterBoot4: the starter's classes
  # as published, compiled against Boot 3, on a Boot 4 classpath) and the latest Spring AI 2.0.x (#2278), so the ranges
  # docs/guide/spring-boot.md and docs/guide/spring-ai.md state are tested at both ends. One job, three named steps (each
  # a separate sbt, since each sets a different version property): they used to be three jobs, each compiling the
  # library again. Every step runs whatever the one before did, so one failure does not hide another.
  spring-compat:
    name: Spring Boot and Spring AI (latest)
    needs: [changes]
    # On a pull request only when it changes the Java, Kotlin, Spring or Quarkus modules, what they build on, or what
    # this job checks (`changes`), and not on a push to main: the nightly run runs it there.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.consumers != 'false' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    # Healthy runs take about 6 minutes.
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Test the starter against the latest Spring Boot 3.x
        run: scripts/retry-on-transient-network.sh sbt -Dllm4s.springBootVersion=3.5.16 springBootStarter/test

      - name: Test the starter against the latest Spring Boot 4.x
        if: ${{ !cancelled() }}
        run: scripts/retry-on-transient-network.sh sbt -Dllm4s.springBoot4Version=4.1.1 springBootStarterBoot4/test

      - name: Test llm4s-spring-ai against the latest Spring AI 2.0.x
        if: ${{ !cancelled() }}
        run: scripts/retry-on-transient-network.sh sbt -Dllm4s.springAiVersion=2.0.2 springAi/test

  # A pull request that changes docs and no code (`changes`: docs/, the top-level markdown, other workflows, scripts/...)
  # skips the coverage legs and the other test jobs. A few dozen suites read docs/ - a guide's code blocks, links and
  # tables tested against the code - so a docs-only change can still break them: this runs those, tagged DocsSpec
  # (`sbt testDocs`, the modules in `docsTestProjects` in build.sbt). scripts/check-docs-tests.sh (Quick Checks) fails
  # when a suite reads docs/ without the tag. On a change with code the coverage legs and `Test (other modules)` run
  # these suites with all the others, so this job is skipped.
  docs-tests:
    name: Docs tests
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    # Healthy runs take about 10 minutes: samples compiles most of the build.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Resolve the dependencies
        run: scripts/retry-on-transient-network.sh sbt resolveAll

      # The unforked suites (samples, ...) run inside the sbt JVM: the same heap as `Test (other modules)`.
      - name: Run the suites that read docs/
        run: sbt -J-Xmx4g testDocs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-docs
          path: |
            **/target/test-reports/
            **/target/scala-3.7.1/test-reports/
          retention-days: 5

  # All tests must pass. The one check a merge needs (docs/reference/merge-queue.md), so it knows, job by job, when
  # `skipped` is a pass: never for the jobs every event runs; on a push to main for those the nightly run takes there;
  # on a pull request for a job its change does not need (`changes`). Skipped itself on a draft pull request, where
  # nothing ran: neither a pass nor a failure.
  all-tests-pass:
    name: All Tests Pass
    if: ${{ always() && needs.changes.outputs.draft != 'true' }}
    # changes, workspace-integration and performance-tests run only where they apply (#1982): skipped is a pass for
    # them, failed is not, so a PR that changes the workspace cannot merge with the live suites red.
    needs: [changes, quick-checks, test, test-windows, performance-tests, coverage, scaladoc, docs-tests, integration-tests, consumers, spring-compat, workspace-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check all tests passed
        env:
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.changes.outputs.docs }}
          WINDOWS: ${{ needs.changes.outputs.windows }}
          INTEGRATION: ${{ needs.changes.outputs.integration }}
          CONSUMERS: ${{ needs.changes.outputs.consumers }}
          PERFORMANCE: ${{ needs.changes.outputs.performance }}
        run: |
          failed=0
          # require LABEL RESULT [SKIP_OK]: RESULT must be success, or skipped when SKIP_OK is true
          require() {
            if [[ "$2" == "success" || ( "$2" == "skipped" && "${3:-false}" == "true" ) ]]; then
              echo "ok   $1: $2"
            else
              echo "::error::$1: $2"
              failed=1
            fi
          }
          # skip_ok DECISION...: true on a push to main, or when the `changes` job decided any of them false (on a pull
          # request; elsewhere the decisions are empty)
          skip_ok() {
            local d
            [[ "$MAIN_PUSH" == "true" ]] && { echo true; return; }
            for d in "$@"; do [[ "$d" == "false" ]] && { echo true; return; }; done
            echo false
          }
          not_pr_skip() { local d; for d in "$@"; do [[ "$d" == "false" ]] && { echo true; return; }; done; echo false; }
          require "Quick Checks" "${{ needs.quick-checks.result }}"
          require "Test (other modules)" "${{ needs.test.result }}" "$(not_pr_skip "$CODE")"
          require "Code Coverage" "${{ needs.coverage.result }}" "$(not_pr_skip "$CODE")"
          require "Integration Tests" "${{ needs.integration-tests.result }}" "$(not_pr_skip "$INTEGRATION")"
          require "Test (Windows)" "${{ needs.test-windows.result }}" "$(skip_ok "$WINDOWS")"
          scaladoc_skip=false
          if [[ "$MAIN_PUSH" == "true" || ( "$CODE" == "false" && "$DOCS" == "false" ) ]]; then scaladoc_skip=true; fi
          require "ScalaDoc" "${{ needs.scaladoc.result }}" "$scaladoc_skip"
          require "Kotlin, Java and framework consumers" "${{ needs.consumers.result }}" "$(skip_ok "$CONSUMERS")"
          require "Spring Boot and Spring AI (latest)" "${{ needs.spring-compat.result }}" "$(skip_ok "$CONSUMERS")"
          require "Performance tests" "${{ needs.performance-tests.result }}" "$(skip_ok "$PERFORMANCE")"
          # Docs tests runs only on a pull request that changes docs and no code; anywhere else skipped is the pass.
          if [[ "${{ needs.docs-tests.result }}" != "success" && "${{ needs.docs-tests.result }}" != "skipped" ]]; then
            echo "::error::Docs tests: ${{ needs.docs-tests.result }}"
            failed=1
          fi
          if [[ "$DOCS" == "true" && "$CODE" == "false" && "${{ needs.docs-tests.result }}" != "success" ]]; then
            echo "::error::The change touches docs/ only, but Docs tests did not run and pass"
            failed=1
          fi
          if [[ "${{ needs.changes.result }}" != "success" && "${{ needs.changes.result }}" != "skipped" ]]; then
            echo "::error::Deciding what the change needs failed"
            failed=1
          fi
          if [[ "${{ needs.workspace-integration.result }}" != "success" && "${{ needs.workspace-integration.result }}" != "skipped" ]]; then
            echo "::error::Workspace integration tests failed"
            failed=1
          fi
          # skipped passes only where the tier does not apply: on a pull request the detector must run, and a change that
          # touches the workspace must run the tier (a PR that disables either job's condition fails here)
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::Deciding what the pull request needs did not run"
            failed=1
          fi
          if [[ "${{ needs.changes.outputs.workspace }}" == "true" && "${{ needs.workspace-integration.result }}" != "success" ]]; then
            echo "::error::The change touches the workspace but Workspace Integration did not run and pass"
            failed=1
          fi
          if [[ "$failed" != 0 ]]; then exit 1; fi
          echo "All tests passed!"

  # Tier 3: Ollama integration tests — verifies full round-trip against a real
  # local LLM. Runs on pushes to main, and by `workflow_dispatch` with tier=ollama, to avoid slowing down PR builds.
  #
  # Carries a pgvector service as well as Ollama, because the RAG pipeline suite needs both:
  # real embeddings are the whole point of it, and pgvector is where the hybrid-search half
  # stores them. A suite declares exactly one tier, so the tier its scarcer dependency
  # belongs to has to supply the rest.
  ollama-integration:
    name: Ollama Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.tier == 'all' || inputs.tier == 'ollama'))
    permissions:
      contents: read

    services:
      # The official image, pinned by digest rather than installed with `curl ... | sh`, which Scorecard's
      # Pinned-Dependencies check flags (#2306). Dependabot does not watch service images: bump the tag
      # comment and the digest together.
      ollama:
        image: ollama/ollama@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761 # 0.40.15
        options: >-
          --health-cmd "ollama list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 11434:11434

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Wait for the Ollama server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server is ready"
              exit 0
            fi
            echo "Waiting for Ollama server... ($i/30)"
            sleep 1
          done
          echo "Ollama server did not start" >&2
          exit 1

      # Two models: one to answer with, one to embed with. RAGPipelineOllamaIntegrationSpec
      # is the only suite in the repo that exercises retrieval against a real embedding
      # model, so leaving nomic-embed-text out would make it fail rather than skip here.
      - name: Pull test models
        run: |
          docker exec ${{ job.services.ollama.id }} ollama pull qwen2.5:0.5b
          docker exec ${{ job.services.ollama.id }} ollama pull nomic-embed-text

      - name: Run Ollama integration tests
        env:
          # This job runs Ollama, pulls the models and runs pgvector, so "not available"
          # here is a failure, not a reason to skip.
          LLM4S_IT_STRICT: "true"
          PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/postgres
          PGVECTOR_USER: postgres
          PGVECTOR_PASSWORD: postgres
        run: scripts/retry-on-transient-network.sh sbt testOllama

  # Tier 2: containerised workspace tests. Split from the `integration-tests` job because
  # this one has to build the workspace-runner image first (apt + sdkman + the Scala 3
  # toolchain), which is far too slow for every PR. The image tag comes from the build
  # itself — `it / Test / envVars` passes `workspaceRunner / Docker / version` to the suite.
  workspace-integration:
    name: Workspace Integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # On a push to main, on a pull request that changes the workspace (`changes`; All Tests Pass then requires
    # it to pass), and on demand: `gh workflow run ci.yml --ref <branch> -f tier=workspace`. Not on a merge group: the
    # queued PR already ran it. `!cancelled()` because `changes` is skipped on every event but a pull request.
    needs: [changes]
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (inputs.tier == 'all' || inputs.tier == 'workspace')) ||
        needs.changes.outputs.workspace == 'true')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The image tag is derived from the version, which sbt-dynver reads from git
          # describe; a shallow clone with no tags yields a different tag than the test
          # is told to expect.
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Build the workspace-runner image
        run: scripts/retry-on-transient-network.sh sbt workspaceRunner/Docker/publishLocal

      - name: Run containerised workspace tests
        env:
          LLM4S_IT_STRICT: "true"
          LLM4S_DOCKER_TESTS: "true"
        run: sbt testWorkspace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-workspace
          path: |
            modules/it/target/**/test-reports/
          retention-days: 5

  # Tier 2: the MCP client against the official MCP reference server (@McpReference,
  # MCPReferenceServerSpec, #1006). Split from `integration-tests` because starting the server
  # downloads the node image from Docker Hub and the server's pinned dependency tree from npm on
  # every run; an outage of either would fail unrelated PRs. So, like the Workspace and Ollama
  # tiers, it runs on pushes to main - and also on manual dispatch (`-f tier=mcp-reference`), to check a branch on
  # demand. Not in `all-tests-pass` for the same reason.
  mcp-reference-integration:
    name: MCP Reference Server Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.tier == 'all' || inputs.tier == 'mcp-reference'))
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      # The official MCP reference server (#1006). Started in a step rather than as a service
      # container because a service cannot be given a command, and the server picks its
      # transport from one. Everything it runs is pinned: the image by digest (node
      # 22.23.3 on Alpine), and the server, 2026.8.31, with its whole dependency tree by
      # modules/it/mcp-reference-server/package-lock.json. run.sh installs that tree with
      # `npm ci --ignore-scripts`, from a read-only mount. The container gets no secrets and no
      # environment from the job. It does need registry.npmjs.org and Docker Hub: if either is
      # down, this step fails the job - which is why the job is not run on PRs.
      - name: Start the MCP reference server
        run: |
          docker run -d --name mcp-everything -p 3001:3001 \
            -v "$GITHUB_WORKSPACE/modules/it/mcp-reference-server:/src:ro" \
            node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 \
            sh /src/run.sh
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3001/mcp; then echo "MCP reference server is ready"; exit 0; fi
            sleep 2
          done
          docker logs mcp-everything >&2
          echo "MCP reference server did not become ready within 120s" >&2
          exit 1

      - name: Run the MCP reference-server tests
        env:
          # This job starts the server, so "not reachable" here is a failure, not a reason to skip.
          LLM4S_IT_STRICT: "true"
          MCP_SERVER_URL: http://localhost:3001/mcp
        run: scripts/retry-on-transient-network.sh sbt testMcpReference

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-mcp-reference
          path: |
            modules/it/target/**/test-reports/
          retention-days: 5

  # Tier 4: Cloud smoke tests — minimal sanity checks against real cloud APIs.
  # Manual trigger only (workflow_dispatch, `-f tier=cloud-smoke`) to avoid unintended API costs.
  cloud-smoke:
    name: Cloud Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && (inputs.tier == 'all' || inputs.tier == 'cloud-smoke')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore the sbt dependency cache
        uses: ./.github/actions/restore-sbt-deps

      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      # VertexAISmokeSpec authenticates with Application Default Credentials: a service-account
      # JSON key, held as the VERTEX_CREDENTIALS_JSON secret, written to a file for
      # GOOGLE_APPLICATION_CREDENTIALS. Without the secret nothing is written, and the suite fails
      # under LLM4S_IT_STRICT like any other missing key.
      - name: Write Vertex AI credentials
        env:
          VERTEX_CREDENTIALS_JSON: ${{ secrets.VERTEX_CREDENTIALS_JSON }}
        run: |
          if [ -n "$VERTEX_CREDENTIALS_JSON" ]; then
            umask 077
            printf '%s' "$VERTEX_CREDENTIALS_JSON" > "$RUNNER_TEMP/vertex-credentials.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/vertex-credentials.json" >> "$GITHUB_ENV"
          fi

      - name: Run cloud smoke tests
        env:
          # `LLM4S_IT_STRICT=true` turns a missing key into a failure. Without it this job
          # reported success while testing nothing — which is what GeminiSmokeSpec has been
          # doing all along: it reads GEMINI_API_KEY, and only GOOGLE_API_KEY was passed.
          LLM4S_IT_STRICT: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          # Speech smoke suites (modules/it, org.llm4s.speech): OpenAI TTS/STT reuse OPENAI_API_KEY.
          # With LLM4S_IT_STRICT=true each of these must be a repository secret, or its suite fails.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          # LangfuseSmokeSpec (llm4s-observability). LANGFUSE_URL is optional: unset, it is
          # Langfuse Cloud. The LLM in that suite is a mock, so it costs only a trace.
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_URL: ${{ secrets.LANGFUSE_URL }}
          # Keys for the smoke suites added with the new providers. With LLM4S_IT_STRICT=true each
          # one that is missing from the repository secrets makes its suite FAIL (not skip).
          # MistralSmokeSpec, ZaiSmokeSpec, XaiSmokeSpec, JinaEmbeddingsSmokeSpec, StableDiffusionSmokeSpec.
          # (CohereEmbeddingsSmokeSpec reads COHERE_API_KEY, set above for CohereSmokeSpec.)
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          # BedrockSmokeSpec: AWS_REGION plus credentials the default chain finds
          # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, optionally AWS_SESSION_TOKEN).
          # BEDROCK_MODEL_ID is optional; unset, the suite uses its built-in default model.
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          # WatsonXAssumptionProbeSpec: an IBM Cloud API key plus a project (or deployment space).
          # WATSONX_BASE_URL and WATSONX_MODEL are optional; unset, the suite uses us-south and its
          # default model.
          WATSONX_API_KEY: ${{ secrets.WATSONX_API_KEY }}
          WATSONX_PROJECT_ID: ${{ secrets.WATSONX_PROJECT_ID }}
          WATSONX_SPACE_ID: ${{ secrets.WATSONX_SPACE_ID }}
          WATSONX_BASE_URL: ${{ secrets.WATSONX_BASE_URL }}
          WATSONX_MODEL: ${{ secrets.WATSONX_MODEL }}
          # JevSmokeSpec (llm4s-jev): a TypeSafe API key, billed at a few hundred input tokens per test.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # PerplexitySmokeSpec (llm4s-perplexity): a Perplexity API key; billed per web search as well as per token.
          # PERPLEXITY_MODEL is optional; unset, the suite uses perplexity/sonar.
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PERPLEXITY_MODEL: ${{ secrets.PERPLEXITY_MODEL }}
          # Smoke suites added for #1213. With LLM4S_IT_STRICT=true each required one that is
          # missing from the repository secrets makes its suite FAIL (not skip).
          # AzureSmokeSpec: the resource key, its endpoint (https://<resource>.openai.azure.com) and a
          # chat deployment's name. AZURE_OPENAI_CUSTOM_ENDPOINT (the resource behind a custom domain)
          # is optional; unset, that one test is cancelled.
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_CUSTOM_ENDPOINT: ${{ secrets.AZURE_OPENAI_CUSTOM_ENDPOINT }}
          # RequestySmokeSpec.
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          # OpenAICompatibleSmokeSpec: the generic provider against Groq. GROQ_MODEL is optional.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          # VoyageEmbeddingsSmokeSpec.
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # VertexAISmokeSpec: the project, plus the credentials file written above.
          # GOOGLE_CLOUD_LOCATION (default us-central1) and VERTEX_MODEL are optional.
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          VERTEX_MODEL: ${{ secrets.VERTEX_MODEL }}
        run: scripts/retry-on-transient-network.sh sbt testSmoke
