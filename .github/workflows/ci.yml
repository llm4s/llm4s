name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # A GitHub merge queue on main (#1638): the queue builds main plus the queued pull request(s) on a temporary
  # gh-readonly-queue/... branch and waits for the required checks to report on it, so this workflow must run there
  # too or the queue waits until its timeout. A no-op until a maintainer enables the queue (docs/reference/merge-queue.md).
  # The push-to-main-only tiers below (Ollama, Workspace, MCP reference) stay off it: they are not required checks.
  merge_group:
    types: [checks_requested]
  # A manual run (`gh workflow run ci.yml --ref <branch> -f tier=workspace`) runs the PR jobs plus the tier(s) named:
  # `all` (the default) is every on-demand tier, so on a branch without the cloud keys pick the one you need (#1982).
  workflow_dispatch:
    inputs:
      tier:
        description: 'On-demand tier(s) to run besides the PR jobs'
        type: choice
        options: [all, workspace, mcp-reference, cloud-smoke, none]
        default: all
  workflow_call:

# Concurrency settings to prevent conflicts
concurrency:
  # For PRs, cancel duplicate runs. For pushes to main/master, queue them. A merge group's ref is its own temporary
  # branch, unique per group, so it falls through to github.ref and is never cancelled by another group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  # Only cancel in-progress runs for pull requests, not for pushes to main/master
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job sets timeout-minutes, about twice its usual duration on main, so a hung job cannot hold a runner and the
# merge queue for GitHub's six-hour default (#2370). Raising one: CONTRIBUTING.md#ci-time-limits.
jobs:
  config-policy-check:
    name: Config Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      # Smoke test: exercises CheckPolicies + dev policy against committed HOCON (no live Ollama).
      - name: Run policy check
        run: >-
          sbt "configPolicy/runMain org.llm4s.configpolicy.CheckPolicies
          --env=dev
          --config config/examples/application-policy-smoke.conf"

      # Env-var based engine (EnvCheckPolicies) - alternative facet, driven by LLM_* env vars.
      - name: Validate default prod-safe policy (env engine)
        env:
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4o-mini
          LLM_MAX_TOKENS: "2048"
          LLM_REASONING_BUDGET: "5000"
          LLM_REGION: eastus
        run: sbt "configPolicy/runMain org.llm4s.configpolicy.EnvCheckPolicies --env=prod --preset=prod-safe"

      - name: Validate staging-balanced policy (env engine)
        env:
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-1.5-pro
          LLM_MAX_TOKENS: "4096"
          LLM_REASONING_BUDGET: "8000"
          LLM_REGION: westeurope
        run: sbt "configPolicy/runMain org.llm4s.configpolicy.EnvCheckPolicies --env=staging --preset=staging-balanced"

      - name: Validate dev-sandbox policy (env engine)
        env:
          LLM_PROVIDER: ollama
          LLM_MODEL: qwen2.5:0.5b
          LLM_MAX_TOKENS: "12000"
          LLM_REASONING_BUDGET: "30000"
          LLM_REGION: eastus
        run: sbt "configPolicy/runMain org.llm4s.configpolicy.EnvCheckPolicies --env=dev --preset=dev-sandbox"

  # Checks that need no tests run: formatting, scalafix, compile, the build's policy checks and the scripts' own
  # tests. No job waits for it: the test, coverage and other jobs start alongside it, so a PR's wall clock is the
  # longest job, not Quick Checks plus the longest job. It used to gate them all, which put its ~10 minutes in
  # front of every one. A compile error still fails fast without it, in every job that compiles; what the gate
  # saved was runner minutes on a PR that fails only formatting or a policy check, and concurrency already cancels
  # a superseded run. It still gates the merge, through `All Tests Pass`.
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'
      
      - uses: sbt/setup-sbt@v1

      # Fails when a docs page pins a literal llm4s version in an install snippet: the docs site fills in
      # `latest_release` from the latest GitHub Release, so a literal one lags the release by design. README.md,
      # which GitHub renders without Liquid, must instead show literal versions equal to `latest_release` (#2322).
      - name: Check install snippets do not pin a literal version
        run: scripts/check-doc-versions.sh

      # Fails on a broken relative link in README.md, CONTRIBUTING.md, CHANGELOG.md and the migration guides, and on a
      # link anywhere in the repository to a README.md heading that no longer exists (#2322).
      - name: Check README and changelog links
        run: scripts/check-doc-links.sh

      # Fails when two docs pages under the same parent declare the same `nav_order`: the site then orders them by
      # title instead, so the number stops meaning anything and nothing reports it (#1623).
      - name: Check docs nav_order is unique within each parent
        run: scripts/check-doc-nav-order.sh

      # The cited-issue check itself needs the network and runs weekly and on docs pull requests
      # (docs-cited-issues.yml); its tests run it against a fake `gh`.
      - name: Test the cited-issue check
        run: scripts/test-check-cited-issues.sh

      # The release's docs deploy: release.yml dispatches pages.yml on `main` (the github-pages environment rejects a
      # tag ref, #1152) and waits for it. This runs the dispatcher against a fake `gh`, with no network, and checks that
      # pages.yml, release.yml and the script agree on the run's title and the tag pattern, and that no workflow input
      # reaches a shell. It needs jq and ruby, both on the runner.
      - name: Test the release docs-deploy dispatcher
        run: scripts/test-dispatch-docs-deploy.sh

      # A merge queue on main waits for each required check to report on its merge group (#1638). Fails if CI, DCO or
      # the secret scan loses its merge_group trigger, if a required job or anything it needs would be skipped there,
      # or if a step reads github.event.pull_request without a pull_request gate. Needs ruby, on the runner.
      - name: Test that the required workflows run in a merge queue
        run: scripts/test-merge-queue-workflows.sh

      # The dependency-footprint table in docs/reference/dependency-conflicts.md (#1496): the script against a fake `cs`,
      # with no network.
      - name: Test the dependency-footprint script
        run: scripts/test-dependency-footprint.sh

      # Which pull requests run the workspace tier (#1982): scripts/workspace-tier-changes.sh against scratch git repos.
      - name: Test the workspace-tier change detection
        run: scripts/test-workspace-tier-changes.sh

      # Fails on a broken internal link in docs/ that scripts/docs-link-baseline.txt does not list, and on a
      # listed link that no longer breaks (the baseline only shrinks). Links are resolved the way llm4s.org serves
      # them; see the header of the script. The test runs the check against fixture trees, with no network.
      - name: Check internal docs links
        run: |
          scripts/test-check-docs-site-links.sh
          scripts/check-docs-site-links.sh

      # Every sbt step below talks to this one sbt server through the thin client (`sbt --client`), instead of each
      # starting its own sbt: loading this build (65k settings) took 12-15 s per invocation, and there are some fifteen.
      # Each check stays its own step, so a failure is reported under the step's name, and its exit status is the
      # command's. The server keeps its state between steps: compiled classes, the resolved dependencies, the loaded
      # build. Nothing here uses `set` or `reload`, so a later step sees the build exactly as a fresh sbt would.
      - name: Start the sbt server
        run: sbt --client about

      # Fails when the docs state a Scala or JDK version, a module or an sbt command the build does not have.
      # The Scala 2.13 thread began with exactly that kind of claim (#874, #1134); this keeps it corrected.
      # The build's side is what sbt loaded (project/BuildModel.scala), not a reading of build.sbt's text.
      # It also fails when a project's scalac/javac options or a Gradle build target a JDK other than the documented
      # minimum, the oldest JDK CI runs (#1493).
      - name: Write the build model
        run: sbt --client "dumpBuildModel target/build-model.json"

      - name: Check the documented support matrix matches the build
        run: |
          scripts/test-check-doc-support.sh target/build-model.json
          scripts/check-doc-support.sh --model target/build-model.json

      # Fails when a module with a coverage floor is in no leg of the `coverage-leg` job below (so nothing enforces
      # its floor), in two, or lacks its one Codecov upload step. It reads the build model, so a new module with
      # `coverageFloor(n)` in build.sbt fails here until a leg takes it.
      - name: Check every coverage floor is enforced by a coverage leg
        run: |
          scripts/test-check-coverage-legs.sh target/build-model.json
          scripts/check-coverage-legs.sh --model target/build-model.json

      # Fails when a main source that calls a platform-sensitive API (processes, path separators, permissions,
      # temporary files, writing or deleting files, file locks, SQLite, line separators, the OS name) has no test
      # that runs on Windows: the `test` job's Windows leg runs only `sbt testPlatform` (project/PlatformTests.scala),
      # so such a file must be in a module that runs whole there or be listed in scripts/platform-sensitive-sources.txt
      # with the suite that tests it. Also fails when a test that checks which OS it is on does not run on Windows.
      - name: Check every platform-sensitive source is tested on Windows
        run: |
          scripts/test-check-platform-tests.sh target/build-model.json
          scripts/check-platform-tests.sh --model target/build-model.json

      # The wrapper below re-runs a step only when its `[error]` output shows a transient download failure and
      # never otherwise; this runs it against a fake command, with no network, to keep that true.
      - name: Test the transient-network retry wrapper
        run: scripts/test-retry-on-transient-network.sh

      # The frozen set is written down in build.sbt (`mimaFrozen`), in three tier lists beside it, in
      # docs/reference/v1-scope.md's Package Map and in two prose lists. This keeps them in step; it reads
      # text only, so it needs no sbt.
      - name: Check the documented stability tiers match the build
        run: |
          scripts/test-check-tier-drift.sh
          scripts/check-tier-drift.sh

      # The Scala CLI quick start pins a published llm4s version, which must be docs/_data/project.yml's
      # latest_release (#1456). The offline check runs here; scala-cli-quickstart.yml adds Maven Central and a compile.
      - name: Check the Scala CLI quick start pins the latest release
        run: |
          scripts/test-check-scala-cli-quickstart.sh
          scripts/check-scala-cli-quickstart.sh

      # scripts/mima-dry-run.sh is a manual release-readiness script (it publishes the whole build, minutes). Its
      # tests run it against a fixture repository and a fake `sbt`, with no network, in about ten seconds, so the
      # script's checks stay able to fail between releases.
      - name: Test the MiMa dry-run script
        run: scripts/test-mima-dry-run.sh

      # scripts/verify-release.sh (after a release: is every artifact on Central?) and scripts/publish-kotlin-api.sh (the
      # release's upload of llm4s-kotlin-api to the Central Portal) run only on release day; their tests run them against
      # a fake `curl`, with no network and no credentials, so they stay able to fail between releases (#1494).
      - name: Test the release verification and Kotlin upload scripts
        run: |
          scripts/test-verify-release.sh
          scripts/test-publish-kotlin-api.sh

      # scalafmtCheckAll covers sources only; scalafmtSbtCheck covers build.sbt and project/*.scala.
      # scalafmt downloads scalafmt-core at run time, and a network hiccup used to fail this step in about five
      # seconds ("scalafmt: [v3.7.14] failed to download [.scalafmt.conf]", 2 of 267 runs in three days, both
      # with a warm 450 MB sbt cache restored, so a cache would not have prevented them). The wrapper re-runs it,
      # at most twice, on exactly that kind of error; a real formatting failure still fails on the first attempt.
      - name: Check formatting
        run: scripts/retry-on-transient-network.sh sbt --client "scalafmtCheckAll; scalafmtSbtCheck"

      - name: Run Scalafix
        run: sbt --client scalafixAll

      # Fails when any module declares neither a coverage floor nor an explicit opt-out.
      # Coverage floors are per-module and never inherited, so a new (e.g. carved-out)
      # module must make the decision visible in build.sbt rather than pick up a default.
      - name: Check coverage policy is declared for every module
        run: sbt --client coveragePolicyCheck

      # Fails when a published llm4s-* artifact has no tier row in v1-scope.md or no install line in
      # installation.md. A release cannot be amended, so a module that ships undocumented stays so.
      - name: Check every published artifact is documented
        run: sbt --client publishedArtifactsCheck

      # Fails when the generated llm4s-bom does not list exactly the artifacts the build publishes
      # (project/Bom.scala). A release cannot be amended, so a BOM that omits a module stays that way.
      - name: Check the BOM lists every published artifact
        run: sbt --client bomCheck

      # Fails when a published POM lacks what Maven Central requires (name, description, https URL, licence,
      # developer, SCM) or points its <scm> anywhere but https://github.com/llm4s/llm4s, which is how Scaladex
      # finds the project (#1455). It reads the generated POMs (project/PomMetadata.scala).
      - name: Check every published POM has its metadata
        run: sbt --client pomMetadataCheck

      - name: Compile
        run: sbt --client compile

      # docs/_data/capabilities.yml (from the provider descriptors discovery finds) and docs/_data/tested-versions.yml
      # (from Versions, Common and this workflow) are generated, and docs/reference/compatibility-matrix.md renders them
      # (#2290). Fails when the committed copies differ from what the code says now, so a new provider module or a
      # dependency bump cannot ship with a stale matrix.
      - name: Check the generated compatibility matrix is up to date
        run: |
          sbt --client generateCompatibilityMatrix
          if ! git diff --exit-code -- docs/_data/capabilities.yml docs/_data/tested-versions.yml; then
            echo "::error::The compatibility matrix is stale: run 'sbt generateCompatibilityMatrix' and commit docs/_data."
            exit 1
          fi

      # Builds the CycloneDX SBOMs that the release workflow attaches to a GitHub release (docs/reference/sbom.md), so a
      # change that breaks their generation fails here and not on release day. It also fails when a published module has
      # no BOM, or a BOM names a build-machine path or a test framework. The dependencies are resolved by now, so this is
      # a few seconds of sbt, not a second build.
      # The thin client passes the server's terminal codes through, so they are stripped before the listing is read.
      - name: Generate and check the SBOMs
        run: |
          set -o pipefail
          sbt --client publishedSboms
          sbt --client listPublishedArtifacts | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' | grep -E '^(artifact|stub) ' > target/published-artifacts.txt
          scripts/test-check-sbom.sh
          scripts/test-osv-scan.sh
          scripts/check-sbom.sh target/sboms target/published-artifacts.txt

      - name: Upload the SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/sboms/*.bom.json
          retention-days: 14
          if-no-files-found: error

      # Fails when a frozen module resolves a document-parsing, speech, cloud-storage, database,
      # observability-backend or foreign vendor-SDK dependency, so the programme's definition of done
      # (#1126) stays true until the 1.0 freeze.
      - name: Check no frozen module resolves a dependency the modularisation moved out
        run: sbt --client frozenDependencyCheck

      # Fails when an integration suite in modules/it declares no tier, i.e. when no command
      # and no CI job below would run it. Eleven of eighteen suites were in that state.
      - name: Check every integration suite declares a test tier
        run: sbt --client it/itTierCheck

      # Fails when a top-level public type of a frozen module is not marked @Stable or @Experimental,
      # so the tier lives in the code and cannot drift from docs/reference/v1-scope.md; and when a @Stable
      # signature names an @Experimental type or a deny-listed third-party type (RFC 0004); and when a @Stable
      # case class has a public constructor or copy (RFC 0002 growth safety).
      - name: Check every frozen type declares a stability tier
        run: sbt --client stabilityTierCheck

      # The staged-deployment template (deploy/, .github/workflows/deploy-staged.yml) is never run by CI, so
      # these keep it from rotting: every overlay must render with the image, namespace, replica count and
      # pod hardening it promises (kubectl is on the GitHub-hosted runners), and the image definition must
      # still stage without a Docker daemon and run as a numeric non-root user.
      - name: Check the deployment manifests render
        run: deploy/scripts/deploy.sh check

      - name: Check the deploy-service image definition
        run: |
          sbt --client deployService/Docker/stage
          grep -qx 'USER 1001:0' modules/deploy-service/target/docker/stage/Dockerfile

  scaladoc:
    name: ScalaDoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Generate ScalaDoc
        # `doc` covers each module on its own; `docs/doc` builds the single aggregate API tree
        # that the docs site publishes (see the `docs` project in build.sbt). Both run here so
        # a module missing from that project's source list fails a PR rather than quietly
        # disappearing from the published Scaladoc.
        #
        # Scaladoc ignores `-Werror` and `-Wconf`, so a broken `[[link]]` is only a `[warn]` line and `doc` still
        # succeeds. The log is checked instead: a Scaladoc warning in an llm4s source fails the job, and so does one in a
        # third-party source that scripts/scaladoc-third-party-warnings.txt does not list (#1967). The release's publish
        # job runs the same check before `sbt ci-release`.
        run: |
          set -o pipefail
          scripts/test-check-scaladoc-warnings.sh
          sbt doc docs/doc 2>&1 | tee scaladoc.log
          scripts/check-scaladoc-warnings.sh scaladoc.log

  # Code coverage, measured on one configuration (ubuntu) to avoid duplication, in four legs that run in parallel.
  #
  # `<module>/coverageReport` is what enforces each module's floor (build.sbt: coverageFloor(n)); the aggregate
  # report is informational only, since a build-wide average is not a meaningful gate. A leg runs, for each module
  # it owns, `<module>/test <module>/coverageReport`. A report counts every measurement taken so far in the leg, so
  # each leg keeps the order the single job used, and modules whose tests exercise another's code mostly stay in its
  # leg (rag before knowledgegraph, media and observability; image before observabilityPrometheus; the providers
  # before providerTestkit; docs/reference/test-coverage.md names the two pairs that are split). The legs used to be one job running some 40 commands in series (19 minutes after #1935); split
  # by dependency cluster, each leg is a few minutes of tests plus one instrumented compile of core. `sbt test`'s
  # exclusion of `PerformanceTest` (commonSettings) applies here too, because the legs run `<module>/test`.
  #
  # Every module with a coverage floor is in exactly one leg, and uploads its Codecov flag from that leg once; the
  # only other uploads are the `integration-tests` job's, for the modules in its COVERAGE_MODULES (#2349), which
  # Codecov merges with the leg's. `scripts/check-coverage-legs.sh` (in Quick Checks) fails when a floor is in no leg,
  # in two, or has no upload step, so a new module cannot drop out of measurement. A new module joins the leg holding its dependencies
  # (the order inside a leg matters: a new module goes after the modules it depends on).
  #
  # The legs are summarised by the `Code Coverage` job below, which `All Tests Pass` needs.
  coverage-leg:
    name: Code Coverage (${{ matrix.leg }})
    runs-on: ubuntu-latest
    # Healthy legs take about 10 minutes; the default limit is 360, so a hung run would hold the PR for six hours.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Every leg runs to the end, so one failing floor does not hide another leg's result.
      fail-fast: false
      matrix:
        # Balanced by the per-module times of the single job (#1935's run): about 5 minutes of sbt each.
        include:
          - leg: core
            modules: [core, memory, memoryPostgres, schemaDerivation, testkit, observabilityMicrometer, agentTools,
                      traceOpentelemetry, gradleDemo]
          - leg: rag
            modules: [rag, vectorstoreElasticsearch, vectorstoreRedis, knowledgegraph, mcp, media, image, speech,
                      observability, observabilityPrometheus]
          - leg: providers
            modules: [ollama, gemini, anthropic, openai, openaiCompatible, voyage, bedrock, jina, jev, cohere, watsonx,
                      azureIdentity, providerTestkit, javaApi, javaRag, reactor, springBootStarter, deployService,
                      examplesHttp]
          - leg: agent
            modules: [agent, agentTestkit, agentCheckpointSqlite, agentCheckpointPostgres, agentMemory, llm4sEffect, llm4sZio,
                      llm4sPekko]

    # rag's and memory-postgres's pgvector suites need it. A service cannot be given to some legs only; on the
    # others it costs a few seconds of start-up.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Run tests with coverage
        env:
          MODULES: ${{ join(matrix.modules, ' ') }}
          PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/postgres
          PGVECTOR_USER: postgres
          PGVECTOR_PASSWORD: postgres
          PGVECTOR_TEST_USER: postgres
          PGVECTOR_TEST_PASSWORD: postgres
        run: |
          args=()
          for m in $MODULES; do args+=("$m/test" "$m/coverageReport"); done
          echo "sbt coverage ${args[*]}"
          sbt coverage "${args[@]}"

      # One upload per measured module, each carrying that module's flag - Codecov attributes a file to a flag whose
      # `paths` contain it, so a module uploaded under someone else's flag is worse than not uploaded. Flags are
      # defined in codecov.yml. Each step runs only in the leg that owns its module, so each flag is uploaded once per
  # leg run (the integration-tests job adds a second upload for the modules its suites measure).
      # Leg `core`
      - name: Upload core coverage to Codecov
        if: contains(matrix.modules, 'core')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/core/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: core
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload memory coverage to Codecov
        if: contains(matrix.modules, 'memory')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/memory/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: memory
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload memory-postgres coverage to Codecov
        if: contains(matrix.modules, 'memoryPostgres')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/memory-postgres/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: memory-postgres
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload schema-derivation coverage to Codecov
        if: contains(matrix.modules, 'schemaDerivation')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/schema-derivation/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: schema-derivation
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload testkit coverage to Codecov
        if: contains(matrix.modules, 'testkit')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/testkit/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: testkit
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload observability-micrometer coverage to Codecov
        if: contains(matrix.modules, 'observabilityMicrometer')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/observability-micrometer/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: observability-micrometer
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload agent-tools coverage to Codecov
        if: contains(matrix.modules, 'agentTools')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/agent-tools/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: agent-tools
