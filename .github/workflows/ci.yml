      # The data and report of each module this leg reported on, for the `Code Coverage` job's aggregate report. On a
      # fresh runner only those modules have a scoverage-report. A dependency's data (compiled and measured here too)
      # is left out: its statement ids differ from one compile to the next, so it must not overwrite the owning leg's.
      - name: Collect this leg's coverage data
        env:
          MODULES: ${{ join(matrix.modules, ' ') }}
        run: |
          mkdir -p coverage-out
          n=0
          while IFS= read -r report; do
            dir="${report%/scoverage-report}"
            mkdir -p "coverage-out/$dir"
            cp -R "$report" "$dir/scoverage-data" "coverage-out/$dir/"
            n=$((n + 1))
          done < <(find modules -type d -path '*/target/scala-3.7.1/scoverage-report')
          read -ra owned <<< "$MODULES"
          expected=${#owned[@]}
          echo "collected $n module report(s); the leg owns $expected"
          [ "$n" -eq "$expected" ]

      - name: Upload this leg's coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.leg }}
          path: coverage-out/
          retention-days: 1
          if-no-files-found: error

  # The coverage gate: green only when every leg is. `All Tests Pass` needs this job, so the required-check story is
  # what it was with one coverage job, and the check is still called `Code Coverage`. It also writes the
  # informational aggregate report, from the legs' coverage data (statement files and measurements; no compile).
  coverage:
    name: Code Coverage
    needs: [coverage-leg]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check every coverage leg passed
        run: |
          if [[ "${{ needs.coverage-leg.result }}" != "success" ]]; then
            echo "A coverage leg failed (result: ${{ needs.coverage-leg.result }}); see the Code Coverage (<leg>) jobs"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Download the legs' coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Aggregate the coverage report
        run: sbt coverageAggregate

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            target/scala-3.7.1/scoverage-report/
            modules/**/target/scala-3.7.1/scoverage-report/
          retention-days: 14

  # Main test matrix. Ubuntu runs every test (`sbt test`). Windows runs `sbt testPlatform`: only the tests of what
  # differs between platforms - file paths, separators, permissions and links, deleting or moving an open file,
  # spawning processes and their argument parsing, SQLite files and their locks, line endings written to files,
  # temporary files, the user's home - as project/PlatformTests.scala lists them. Pure JVM logic runs on the same
  # JVM on both, so running all of it again on Windows cost some 15 minutes a PR and added no signal.
  #
  # The rule for new code: a test of platform-sensitive behaviour must run on Windows, so it goes in a module of
  # `PlatformTests.wholeModules` or is named in `PlatformTests.suites`. scripts/check-platform-tests.sh (Quick
  # Checks) enforces it for every main source that calls a platform-sensitive API, against
  # scripts/platform-sensitive-sources.txt, and `sbt testPlatform` fails when a suite it names no longer exists.
  test:
    name: Test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [21]

    runs-on: ${{ matrix.os }}
    # Healthy runs take about 10-15 minutes; the default limit is 360, so a hung run would hold the PR for six hours.
    timeout-minutes: 40
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'
      
      - uses: sbt/setup-sbt@v1
      
      # `sbt test` on ubuntu; `sbt testPlatform` on Windows (see above).
      - name: Run tests
        run: sbt ${{ runner.os == 'Windows' && 'testPlatform' || 'test' }}
      
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/target/test-reports/
            **/target/scala-3.7.1/test-reports/
          retention-days: 5

  # The performance tier: tests tagged `PerformanceTest` (org.llm4s.testutil.TestTags), which check how an
  # operation's cost grows with its input - linear, not quadratic - with `LinearTime.assertLinear`. `sbt test`
  # and the coverage run leave them out: algorithmic growth is the same on every platform, so running them on
  # Windows and under coverage instrumentation only multiplied their cost (they were most of each test job's
  # time, #1932). Here they run once, uninstrumented, on Linux, in parallel with the other test jobs, and nightly
  # in performance-nightly.yml. Gating, through `All Tests Pass`: it is the only check of linear-time growth;
  # `sbt test` keeps only megabyte hang guards.
  performance-tests:
    name: Performance tests
    runs-on: ubuntu-latest
    # Healthy runs take about 15 minutes; the default limit is 360, so a hung run would hold the PR for six hours.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Run performance tests
        run: sbt testPerformance

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-performance
          path: |
            **/target/test-reports/
            **/target/scala-3.7.1/test-reports/
          retention-days: 5

  # Tier 2: containerised integration tests — pgvector, Qdrant and Neo4j as service
  # containers. Reproducible and secret-free, so unlike the Ollama and cloud tiers this
  # runs on every PR. `LLM4S_IT_STRICT=true` makes a suite that cannot reach its service
  # fail instead of skip: this job promises the services are there, so a skip here would be
  # the same silent non-execution that #1143 was about.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      qdrant:
        image: qdrant/qdrant:v1.13.0
        ports:
          - 6333:6333

      # ElasticsearchVectorStoreSpec (#1469): one node, security off, a small heap.
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200

      # OpenSearchVectorStoreSpec (#1469): one node with the k-NN plugin, the security plugin (and its demo
      # certificates and admin password) off, a small heap. Host port 9201: Elasticsearch has 9200.
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
      # RedisVectorStoreSpec (#1470): Redis with the Redis Query Engine (search) module.
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6379:6379

      # ValkeyVectorStoreSpec (#1470): Valkey with valkey-search, through the same store.
      valkey:
        image: valkey/valkey-bundle:9.0.6
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6380:6379

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/llm4stest
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      # Postgres, Redis and Valkey are covered by the service health checks above. The Qdrant and Neo4j images
      # ship no shell tooling to health-check with, so poll them from the runner instead —
      # and fail the job if they never come up, rather than letting the suites skip.
      - name: Wait for Qdrant, Neo4j, Elasticsearch and OpenSearch
        run: |
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -sf "$2" > /dev/null; then echo "$1 is ready"; return 0; fi
              sleep 2
            done
            echo "$1 did not become ready within 120s" >&2
            exit 1
          }
          wait_for Qdrant http://localhost:6333/readyz
          wait_for Neo4j http://localhost:7474
          wait_for Elasticsearch "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          wait_for OpenSearch "http://localhost:9201/_cluster/health?wait_for_status=yellow&timeout=5s"

      # The suites run with coverage instrumentation on the modules whose code only they reach against real services
      # (#2349): the pgvector, Qdrant and permission-index stores in rag, the Elasticsearch/OpenSearch and
      # Redis/Valkey stores, memory-postgres, the Neo4j graph store, and the Postgres checkpointer and run queue.
      # Each module's report is uploaded below under the flag its coverage leg uploads, and Codecov merges the two
      # uploads of a flag on a commit, so the integration hits count towards patch and project coverage.
      #
      # Only COVERAGE_MODULES are instrumented (not `sbt coverage`, which would instrument every dependency of
      # modules/it and slow the compile), and their floors are switched off for this run: a report here measures only
      # the integration suites, and each floor is enforced by the module's coverage leg on its own tests.
      # scripts/check-coverage-legs.sh checks this list against the upload steps below.
      - name: Run containerised integration tests
        env:
          COVERAGE_MODULES: rag vectorstoreElasticsearch vectorstoreRedis memoryPostgres knowledgegraphNeo4j agentCheckpointPostgres
          LLM4S_IT_STRICT: "true"
          PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/postgres
          PGVECTOR_USER: postgres
          PGVECTOR_PASSWORD: postgres
          PGVECTOR_TEST_USER: postgres
          PGVECTOR_TEST_PASSWORD: postgres
          POSTGRES_TEST_ENABLED: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          QDRANT_TEST_URL: http://localhost:6333
          ELASTICSEARCH_TEST_URL: http://localhost:9200
          OPENSEARCH_TEST_URL: http://localhost:9201
          REDIS_TEST_URL: redis://localhost:6379
          VALKEY_TEST_URL: redis://localhost:6380
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: llm4stest
        run: |
          settings=()
          reports=()
          for m in $COVERAGE_MODULES; do
            settings+=("set $m / coverageEnabled := true" "set $m / coverageFailOnMinimum := false"
                       "set $m / coverageMinimumStmtTotal := 0")
            reports+=("$m/coverageReport")
          done
          echo "sbt ${settings[*]} testIntegration ${reports[*]}"
          sbt "${settings[@]}" testIntegration "${reports[@]}"

      # One upload per module in COVERAGE_MODULES, under the same flag as that module's coverage-leg upload.
      - name: Upload rag integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/rag/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: rag
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload vectorstore-elasticsearch integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/vectorstore-elasticsearch/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: vectorstore-elasticsearch
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload vectorstore-redis integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/vectorstore-redis/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: vectorstore-redis
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload memory-postgres integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/memory-postgres/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: memory-postgres
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      # knowledgegraph-neo4j is in no coverage leg (scripts/check-coverage-legs.sh, EXEMPT), so this is its only upload.
      - name: Upload knowledgegraph-neo4j integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/knowledgegraph-neo4j/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: knowledgegraph-neo4j
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload agent-checkpoint-postgres integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/agent-checkpoint-postgres/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: agent-checkpoint-postgres
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-integration
          path: |
            modules/it/target/**/test-reports/
          retention-days: 5

  # Binary compatibility (MiMa). Only the frozen modules have a baseline (see `mimaFrozen` in
  # build.sbt), and none until #1281 sets one (`mimaBaselineVersion`, per module through
  # `mimaBaselineOverrides`), so this checks nothing yet. The build
  # is Scala 3 only, with no `crossScalaVersions`, so a bare `mimaReportBinaryIssues` covers every
  # artifact; use `+mimaReportBinaryIssues` if a second Scala version returns (#1126).
  mima-check:
    name: Binary Compatibility (MiMa)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      # Resolving the baseline and the build's artifacts from Maven Central can hit a connection reset (seen once,
      # run 37316745524: "download error: Caught java.net.SocketException (Connection reset)"); the wrapper
      # re-runs the step on that kind of error only. A binary-compatibility failure is never retried.
      - name: Check binary compatibility
        run: scripts/retry-on-transient-network.sh sbt mimaReportBinaryIssues

  # Kotlin coroutine API and the Java sample (modules/samples/gradle-java): separate Gradle builds that consume
  # llm4s-java-api from local Maven, so they share one publish of the library.
  kotlin-api:
    name: Kotlin API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Publish the library modules to local Maven
        # Pin to 0.1.0-SNAPSHOT so build.gradle.kts can reference a stable coordinate without
        # chasing dynver-generated versions. llm4s-java-api's POM depends on core, agent and the
        # provider modules, so all of them must be in the local repository, not just llm4s-java-api.
        run: sbt 'set ThisBuild / version := "0.1.0-SNAPSHOT"' publishM2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          # Licence: v6's default 'enhanced' cache provider (gradle-actions-caching) is
          # proprietary, under the Gradle Terms of Use. 'basic' is MIT-licensed, keeping
          # llm4s CI fully open source.
          cache-provider: basic

      - name: Build and test Kotlin API with coverage check
        working-directory: modules/kotlin-api
        run: gradle check

      # The Maven Central publication of org.llm4s:llm4s-kotlin-api, as release.yml builds it but unsigned (no secret
      # here), written to a file repository: its POM must carry the sbt artifacts' metadata and name llm4s-java-api_3 at
      # the same version, it must have sources and javadoc jars, and a throwaway Gradle project that takes its version
      # from llm4s-bom must compile Kotlin code against it (#1494).
      - name: Dry-run the Kotlin API's Maven Central publication
        run: |
          (cd modules/kotlin-api && gradle publishMavenPublicationToStagingRepository)
          scripts/check-kotlin-publication.sh 0.1.0-SNAPSHOT modules/kotlin-api/build/staging-deploy

      # The release signs the publication with an in-memory key (release.yml, publish-kotlin). This signs it the same way
      # with a throwaway key made here, so the signing configuration is exercised without the release secret: every file
      # must get a signature that verifies.
      - name: Dry-run signing the Kotlin API's publication with a throwaway key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --pinentry-mode loopback --passphrase ci-dry-run \
            --quick-gen-key 'llm4s CI dry run <ci-dry-run@llm4s.invalid>' rsa3072 sign never
          ORG_GRADLE_PROJECT_signingKey="$(gpg --batch --pinentry-mode loopback --passphrase ci-dry-run --armor --export-secret-keys)"
          export ORG_GRADLE_PROJECT_signingKey ORG_GRADLE_PROJECT_signingPassword=ci-dry-run
          rm -rf modules/kotlin-api/build/staging-deploy
          (cd modules/kotlin-api && gradle publishMavenPublicationToStagingRepository)
          REQUIRE_SIGNATURES=1 SKIP_CONSUMER=1 scripts/check-kotlin-publication.sh 0.1.0-SNAPSHOT modules/kotlin-api/build/staging-deploy
          for f in modules/kotlin-api/build/staging-deploy/org/llm4s/llm4s-kotlin-api/0.1.0-SNAPSHOT/*.{pom,jar,module}; do
            gpg --batch --verify "$f.asc" "$f"
          done

      # Compiles the Java sample against the library just published, so it cannot drift from the API it shows, and runs
      # AsyncCalls, which answers from FakeLlmClient and needs no API key.
      - name: Build the Java sample
        working-directory: modules/samples/gradle-java
        run: gradle build installDist runAsyncCalls

      # The Maven sample (docs/getting-started/maven.md), compiled the same way, with its enforcer rules.
      - name: Build the Maven sample
        working-directory: modules/samples/maven-java
        run: mvn -q -B compile

      # The Quarkus sample (docs/guide/quarkus.md): built and tested against the library just published. Its
      # @QuarkusTest runs the real client against a stub Ollama server, so it needs no model and no key (#1468).
      - name: Build and test the Quarkus sample
        working-directory: modules/samples/quarkus-java
        run: |
          ../../../scripts/check-quarkus-guide-snippets.sh
          mvn -q -B verify

      # A Gradle and a Maven project that import llm4s-bom and declare two modules with no version must build
      # against the library just published, and a Gradle project without the BOM must not (#1462).
      - name: Build a Gradle and a Maven project against llm4s-bom
        env:
          REQUIRE_MAVEN: '1'
        run: scripts/check-bom-consumers.sh 0.1.0-SNAPSHOT

      - name: Upload Kotlin coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-coverage-report
          path: modules/kotlin-api/build/reports/jacoco/
          retention-days: 14

  # The starter is built against the oldest supported Spring Boot 3.x (project/Dependencies.scala); this runs its
  # specs against the latest 3.x, so the documented range (docs/guide/spring-boot.md) is tested at both ends (#1467).
  spring-boot-latest:
    name: Spring Boot 3.x (latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Test the starter against the latest Spring Boot 3.x
        run: sbt -Dllm4s.springBootVersion=3.5.16 springBootStarter/test

  # The same artifact supports Spring Boot 4 (#1467): springBootStarterBoot4 runs the starter's specs on a Boot 4
  # classpath, against the starter's classes as published (compiled against Boot 3). It runs on the 4.0 line
  # (Versions.springBoot4Baseline in project/Dependencies.scala) and on the latest 4.x, as docs/guide/spring-boot.md says.
  spring-boot-4:
    name: Spring Boot 4.x
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Test the starter against Spring Boot 4.0
        run: sbt springBootStarterBoot4/test

      - name: Test the starter against the latest Spring Boot 4.x
        run: sbt -Dllm4s.springBoot4Version=4.1.1 springBootStarterBoot4/test

  # All tests must pass
  all-tests-pass:
    name: All Tests Pass
    if: always()
    # workspace-changes and workspace-integration run only where they apply (#1982): skipped is a pass for them, failed
    # is not, so a PR that changes the workspace cannot merge with the live suites red.
    needs: [quick-checks, test, performance-tests, coverage, config-policy-check, scaladoc, integration-tests, mima-check, kotlin-api, spring-boot-latest, spring-boot-4, workspace-changes, workspace-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check all tests passed
        run: |
          if [[ "${{ needs.quick-checks.result }}" != "success" ]]; then
            echo "Quick checks failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Some tests failed"
            exit 1
          fi
          if [[ "${{ needs.performance-tests.result }}" != "success" ]]; then
            echo "Performance tests failed"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "Coverage job failed"
            exit 1
          fi
          if [[ "${{ needs.config-policy-check.result }}" != "success" ]]; then
            echo "Config policy check failed"
            exit 1
          fi
          if [[ "${{ needs.scaladoc.result }}" != "success" ]]; then
            echo "ScalaDoc job failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.mima-check.result }}" != "success" ]]; then
            echo "Binary compatibility check failed"
            exit 1
          fi
          if [[ "${{ needs.kotlin-api.result }}" != "success" ]]; then
            echo "Kotlin API tests failed"
            exit 1
          fi
          if [[ "${{ needs.spring-boot-latest.result }}" != "success" ]]; then
            echo "Spring Boot 3.x (latest) tests failed"
            exit 1
          fi
          if [[ "${{ needs.spring-boot-4.result }}" != "success" ]]; then
            echo "Spring Boot 4.x tests failed"
            exit 1
          fi
          if [[ "${{ needs.workspace-changes.result }}" != "success" && "${{ needs.workspace-changes.result }}" != "skipped" ]]; then
            echo "Deciding whether the change touches the workspace failed"
            exit 1
          fi
          if [[ "${{ needs.workspace-integration.result }}" != "success" && "${{ needs.workspace-integration.result }}" != "skipped" ]]; then
            echo "Workspace integration tests failed"
            exit 1
          fi
          # skipped passes only where the tier does not apply: on a pull request the detector must run, and a change that
          # touches the workspace must run the tier (a PR that disables either job's condition fails here)
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.workspace-changes.result }}" != "success" ]]; then
            echo "Deciding whether the pull request touches the workspace did not run"
            exit 1
          fi
          if [[ "${{ needs.workspace-changes.outputs.changed }}" == "true" && "${{ needs.workspace-integration.result }}" != "success" ]]; then
            echo "The change touches the workspace but Workspace Integration did not run and pass"
            exit 1
          fi
          echo "All tests passed!"

  # Tier 3: Ollama integration tests — verifies full round-trip against a real
  # local LLM. Only runs on pushes to main to avoid slowing down PR builds.
  #
  # Carries a pgvector service as well as Ollama, because the RAG pipeline suite needs both:
  # real embeddings are the whole point of it, and pgvector is where the hybrid-search half
  # stores them. A suite declares exactly one tier, so the tier its scarcer dependency
  # belongs to has to supply the rest.
  ollama-integration:
    name: Ollama Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server is ready"
              break
            fi
            echo "Waiting for Ollama server... ($i/30)"
            sleep 1
          done

      # Two models: one to answer with, one to embed with. RAGPipelineOllamaIntegrationSpec
      # is the only suite in the repo that exercises retrieval against a real embedding
      # model, so leaving nomic-embed-text out would make it fail rather than skip here.
      - name: Pull test models
        run: |
          ollama pull qwen2.5:0.5b
          ollama pull nomic-embed-text

      - name: Run Ollama integration tests
        env:
          # This job installs Ollama, pulls the models and runs pgvector, so "not available"
          # here is a failure, not a reason to skip.
          LLM4S_IT_STRICT: "true"
          PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/postgres
          PGVECTOR_USER: postgres
          PGVECTOR_PASSWORD: postgres
        run: sbt testOllama

  # Whether a pull request touches the workspace, so the workspace tier runs on it (#1982). The checkout is the PR's
  # merge commit, so its first parent is the base and HEAD^1..HEAD is exactly the PR's change; no PR context is read.
  # scripts/workspace-tier-changes.sh lists the paths.
  workspace-changes:
    name: Workspace Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check whether the change touches the workspace
        id: diff
        run: scripts/workspace-tier-changes.sh HEAD^1 HEAD >> "$GITHUB_OUTPUT"

  # Tier 2: containerised workspace tests. Split from the `integration-tests` job because
  # this one has to build the workspace-runner image first (apt + sdkman + the Scala 3
  # toolchain), which is far too slow for every PR. The image tag comes from the build
  # itself — `it / Test / envVars` passes `workspaceRunner / Docker / version` to the suite.
  workspace-integration:
    name: Workspace Integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # On a push to main, on a pull request that changes the workspace (workspace-changes; All Tests Pass then requires
    # it to pass), and on demand: `gh workflow run ci.yml --ref <branch> -f tier=workspace`. Not on a merge group: the
    # queued PR already ran it. `!cancelled()` because workspace-changes is skipped on every event but a pull request.
    needs: [workspace-changes]
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (inputs.tier == 'all' || inputs.tier == 'workspace')) ||
        needs.workspace-changes.outputs.changed == 'true')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # The image tag is derived from the version, which sbt-dynver reads from git
          # describe; a shallow clone with no tags yields a different tag than the test
          # is told to expect.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Build the workspace-runner image
        run: sbt workspaceRunner/Docker/publishLocal

      - name: Run containerised workspace tests
        env:
          LLM4S_IT_STRICT: "true"
          LLM4S_DOCKER_TESTS: "true"
        run: sbt testWorkspace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-workspace
          path: |
            modules/it/target/**/test-reports/
          retention-days: 5

  # Tier 2: the MCP client against the official MCP reference server (@McpReference,
  # MCPReferenceServerSpec, #1006). Split from `integration-tests` because starting the server
  # downloads the node image from Docker Hub and the server's pinned dependency tree from npm on
  # every run; an outage of either would fail unrelated PRs. So, like the Workspace and Ollama
  # tiers, it runs on pushes to main - and also on manual dispatch (`-f tier=mcp-reference`), to check a branch on
  # demand. Not in `all-tests-pass` for the same reason.
  mcp-reference-integration:
    name: MCP Reference Server Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.tier == 'all' || inputs.tier == 'mcp-reference'))
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      # The official MCP reference server (#1006). Started in a step rather than as a service
      # container because a service cannot be given a command, and the server picks its
      # transport from one. Everything it runs is pinned: the image by digest (node
      # 22.23.3 on Alpine), and the server, 2026.8.31, with its whole dependency tree by
      # modules/it/mcp-reference-server/package-lock.json. run.sh installs that tree with
      # `npm ci --ignore-scripts`, from a read-only mount. The container gets no secrets and no
      # environment from the job. It does need registry.npmjs.org and Docker Hub: if either is
      # down, this step fails the job - which is why the job is not run on PRs.
      - name: Start the MCP reference server
        run: |
          docker run -d --name mcp-everything -p 3001:3001 \
            -v "$GITHUB_WORKSPACE/modules/it/mcp-reference-server:/src:ro" \
            node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 \
            sh /src/run.sh
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3001/mcp; then echo "MCP reference server is ready"; exit 0; fi
            sleep 2
          done
          docker logs mcp-everything >&2
          echo "MCP reference server did not become ready within 120s" >&2
          exit 1

      - name: Run the MCP reference-server tests
        env:
          # This job starts the server, so "not reachable" here is a failure, not a reason to skip.
          LLM4S_IT_STRICT: "true"
          MCP_SERVER_URL: http://localhost:3001/mcp
        run: sbt testMcpReference

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-mcp-reference
          path: |
            modules/it/target/**/test-reports/
          retention-days: 5

  # Tier 4: Cloud smoke tests — minimal sanity checks against real cloud APIs.
  # Manual trigger only (workflow_dispatch, `-f tier=cloud-smoke`) to avoid unintended API costs.
  cloud-smoke:
    name: Cloud Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && (inputs.tier == 'all' || inputs.tier == 'cloud-smoke')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Run cloud smoke tests
        env:
          # `LLM4S_IT_STRICT=true` turns a missing key into a failure. Without it this job
          # reported success while testing nothing — which is what GeminiSmokeSpec has been
          # doing all along: it reads GEMINI_API_KEY, and only GOOGLE_API_KEY was passed.
          LLM4S_IT_STRICT: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          # Speech smoke suites (modules/it, org.llm4s.speech): OpenAI TTS/STT reuse OPENAI_API_KEY.
          # With LLM4S_IT_STRICT=true each of these must be a repository secret, or its suite fails.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          # LangfuseSmokeSpec (llm4s-observability). LANGFUSE_URL is optional: unset, it is
          # Langfuse Cloud. The LLM in that suite is a mock, so it costs only a trace.
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_URL: ${{ secrets.LANGFUSE_URL }}
          # Keys for the smoke suites added with the new providers. With LLM4S_IT_STRICT=true each
          # one that is missing from the repository secrets makes its suite FAIL (not skip).
          # MistralSmokeSpec, ZaiSmokeSpec, XaiSmokeSpec, JinaEmbeddingsSmokeSpec, StableDiffusionSmokeSpec.
          # (CohereEmbeddingsSmokeSpec reads COHERE_API_KEY, set above for CohereSmokeSpec.)
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          # BedrockSmokeSpec: AWS_REGION plus credentials the default chain finds
          # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, optionally AWS_SESSION_TOKEN).
          # BEDROCK_MODEL_ID is optional; unset, the suite uses its built-in default model.
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          # WatsonXAssumptionProbeSpec: an IBM Cloud API key plus a project (or deployment space).
          # WATSONX_BASE_URL and WATSONX_MODEL are optional; unset, the suite uses us-south and its
          # default model.
          WATSONX_API_KEY: ${{ secrets.WATSONX_API_KEY }}
          WATSONX_PROJECT_ID: ${{ secrets.WATSONX_PROJECT_ID }}
          WATSONX_SPACE_ID: ${{ secrets.WATSONX_SPACE_ID }}
          WATSONX_BASE_URL: ${{ secrets.WATSONX_BASE_URL }}
          WATSONX_MODEL: ${{ secrets.WATSONX_MODEL }}
          # JevSmokeSpec (llm4s-jev): a TypeSafe API key, billed at a few hundred input tokens per test.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: sbt testSmoke
