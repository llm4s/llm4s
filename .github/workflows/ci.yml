name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  workflow_call:

# Concurrency settings to prevent conflicts
concurrency:
  # For PRs, cancel duplicate runs. For pushes to main/master, queue them.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  # Only cancel in-progress runs for pull requests, not for pushes to main/master
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config-policy-check:
    name: Config Policy Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      # Smoke test: exercises CheckPolicies + dev policy against committed HOCON (no live Ollama).
      - name: Run policy check
        run: >-
          sbt "configPolicy/runMain org.llm4s.configpolicy.CheckPolicies
          --env=dev
          --config config/examples/application-policy-smoke.conf"

      # Env-var based engine (EnvCheckPolicies) - alternative facet, driven by LLM_* env vars.
      - name: Validate default prod-safe policy (env engine)
        env:
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4o-mini
          LLM_MAX_TOKENS: "2048"
          LLM_REASONING_BUDGET: "5000"
          LLM_REGION: eastus
        run: sbt "configPolicy/runMain org.llm4s.configpolicy.EnvCheckPolicies --env=prod --preset=prod-safe"

      - name: Validate staging-balanced policy (env engine)
        env:
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-1.5-pro
          LLM_MAX_TOKENS: "4096"
          LLM_REASONING_BUDGET: "8000"
          LLM_REGION: westeurope
        run: sbt "configPolicy/runMain org.llm4s.configpolicy.EnvCheckPolicies --env=staging --preset=staging-balanced"

      - name: Validate dev-sandbox policy (env engine)
        env:
          LLM_PROVIDER: ollama
          LLM_MODEL: qwen2.5:0.5b
          LLM_MAX_TOKENS: "12000"
          LLM_REASONING_BUDGET: "30000"
          LLM_REGION: eastus
        run: sbt "configPolicy/runMain org.llm4s.configpolicy.EnvCheckPolicies --env=dev --preset=dev-sandbox"

  # Quick checks that should fail fast
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'
      
      - uses: sbt/setup-sbt@v1
      
      - name: Check formatting
        run: sbt scalafmtCheckAll

      - name: Run Scalafix
        run: sbt scalafixAll

      # Fails when any module declares neither a coverage floor nor an explicit opt-out.
      # Coverage floors are per-module and never inherited, so a new (e.g. carved-out)
      # module must make the decision visible in build.sbt rather than pick up a default.
      - name: Check coverage policy is declared for every module
        run: sbt coveragePolicyCheck

      - name: Check documented support matrix
        run: python3 scripts/check-doc-support.py

      - name: Compile
        run: sbt compile

      # Fails when an integration suite in modules/it declares no tier, i.e. when no command
      # and no CI job below would run it. Eleven of eighteen suites were in that state.
      - name: Check every integration suite declares a test tier
        run: sbt it/itTierCheck

  scaladoc:
    name: ScalaDoc
    needs: quick-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Generate ScalaDoc
        # `doc` covers each module on its own; `docs/doc` builds the single aggregate API tree
        # that the docs site publishes (see the `docs` project in build.sbt). Both run here so
        # a module missing from that project's source list fails a PR rather than quietly
        # disappearing from the published Scaladoc.
        run: sbt doc docs/doc

  # Code coverage (runs on one configuration to avoid duplication)
  coverage:
    name: Code Coverage
    needs: [quick-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Run tests with coverage
        env:
          PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/postgres
          PGVECTOR_USER: postgres
          PGVECTOR_PASSWORD: postgres
          PGVECTOR_TEST_USER: postgres
          PGVECTOR_TEST_PASSWORD: postgres
        # `<module>/coverageReport` is what enforces each module's per-module floor
        # (build.sbt: coverageFloor(n)) - the aggregate report is informational only, since a
        # build-wide average is not a meaningful gate. Each carve slice adds its new modules
        # here, so the code it moved keeps a floor instead of dropping out of measurement.
        run: >-
          sbt coverage
          core/test core/coverageReport
          rag/test rag/coverageReport
          knowledgegraph/test knowledgegraph/coverageReport
          memory/test memory/coverageReport
          memoryPostgres/test memoryPostgres/coverageReport
          mcp/test mcp/coverageReport
          media/test media/coverageReport
          image/test image/coverageReport
          speech/test speech/coverageReport
          coverageAggregate

      # One upload per measured module, each carrying that module's flag - Codecov attributes
      # a file to a flag whose `paths` contain it, so a module uploaded under someone else's
      # flag is worse than not uploaded. Flags are defined in codecov.yml.
      - name: Upload core coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/core/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: core
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload rag coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/rag/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: rag
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload knowledgegraph coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/knowledgegraph/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: knowledgegraph
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload memory coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/memory/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: memory
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload memory-postgres coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/memory-postgres/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: memory-postgres
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload mcp coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/mcp/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: mcp
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload media coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/media/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: media
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload image coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/image/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: image
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload speech coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/speech/target/scala-3.7.1/scoverage-report/scoverage.xml
          flags: speech
          slug: llm4s/llm4s
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            target/scala-3.7.1/scoverage-report/
            modules/*/target/scala-3.7.1/scoverage-report/
          retention-days: 14

  # Main test matrix
  test:
    name: Test
    needs: [quick-checks]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [21]

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'
      
      - uses: sbt/setup-sbt@v1
      
      - name: Run tests
        run: sbt test
      
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/target/test-reports/
            **/target/scala-3.7.1/test-reports/
          retention-days: 5

  # Tier 2: containerised integration tests — pgvector, Qdrant and Neo4j as service
  # containers. Reproducible and secret-free, so unlike the Ollama and cloud tiers this
  # runs on every PR. `LLM4S_IT_STRICT=true` makes a suite that cannot reach its service
  # fail instead of skip: this job promises the services are there, so a skip here would be
  # the same silent non-execution that #1143 was about.
  integration-tests:
    name: Integration Tests
    needs: quick-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      qdrant:
        image: qdrant/qdrant:v1.13.0
        ports:
          - 6333:6333

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/llm4stest
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      # Postgres is covered by the service health check above. The Qdrant and Neo4j images
      # ship no shell tooling to health-check with, so poll them from the runner instead —
      # and fail the job if they never come up, rather than letting the suites skip.
      - name: Wait for Qdrant and Neo4j
        run: |
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -sf "$2" > /dev/null; then echo "$1 is ready"; return 0; fi
              sleep 2
            done
            echo "$1 did not become ready within 120s" >&2
            exit 1
          }
          wait_for Qdrant http://localhost:6333/readyz
          wait_for Neo4j http://localhost:7474

      - name: Run containerised integration tests
        env:
          LLM4S_IT_STRICT: "true"
          PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/postgres
          PGVECTOR_USER: postgres
          PGVECTOR_PASSWORD: postgres
          PGVECTOR_TEST_USER: postgres
          PGVECTOR_TEST_PASSWORD: postgres
          POSTGRES_TEST_ENABLED: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          QDRANT_TEST_URL: http://localhost:6333
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: llm4stest
        run: sbt testIntegration

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-integration
          path: |
            modules/it/target/**/test-reports/
          retention-days: 5

  # All tests must pass
  all-tests-pass:
    name: All Tests Pass
    if: always()
    needs: [test, coverage, config-policy-check, scaladoc, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check all tests passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Some tests failed"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "Coverage job failed"
            exit 1
          fi
          if [[ "${{ needs.config-policy-check.result }}" != "success" ]]; then
            echo "Config policy check failed"
            exit 1
          fi
          if [[ "${{ needs.scaladoc.result }}" != "success" ]]; then
            echo "ScalaDoc job failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          echo "All tests passed!"

  # Tier 3: Ollama integration tests — verifies full round-trip against a real
  # local LLM. Only runs on pushes to main to avoid slowing down PR builds.
  ollama-integration:
    name: Ollama Integration
    needs: quick-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server is ready"
              break
            fi
            echo "Waiting for Ollama server... ($i/30)"
            sleep 1
          done

      - name: Pull test model
        run: ollama pull qwen2.5:0.5b

      - name: Run Ollama integration tests
        env:
          # This job installs Ollama and pulls the model, so "Ollama not available" here is a
          # failure, not a reason to skip.
          LLM4S_IT_STRICT: "true"
        run: sbt testOllama

  # Tier 2: containerised workspace tests. Split from the `integration-tests` job because
  # this one has to build the workspace-runner image first (apt + sdkman + two Scala
  # versions), which is far too slow for every PR. The image tag comes from the build
  # itself — `it / Test / envVars` passes `workspaceRunner / Docker / version` to the suite.
  workspace-integration:
    name: Workspace Integration
    needs: quick-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # The image tag is derived from the version, which sbt-dynver reads from git
          # describe; a shallow clone with no tags yields a different tag than the test
          # is told to expect.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Build the workspace-runner image
        run: sbt workspaceRunner/Docker/publishLocal

      - name: Run containerised workspace tests
        env:
          LLM4S_IT_STRICT: "true"
          LLM4S_DOCKER_TESTS: "true"
        run: sbt testWorkspace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-workspace
          path: |
            modules/it/target/**/test-reports/
          retention-days: 5

  # Tier 4: Cloud smoke tests — minimal sanity checks against real cloud APIs.
  # Manual trigger only (workflow_dispatch) to avoid unintended API costs.
  cloud-smoke:
    name: Cloud Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Run cloud smoke tests
        env:
          # `LLM4S_IT_STRICT=true` turns a missing key into a failure. Without it this job
          # reported success while testing nothing — which is what GeminiSmokeSpec has been
          # doing all along: it reads GEMINI_API_KEY, and only GOOGLE_API_KEY was passed.
          LLM4S_IT_STRICT: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: sbt testSmoke
