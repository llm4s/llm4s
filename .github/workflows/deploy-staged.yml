# Reusable CI/CD template for staged deployments (dev → staging → prod).
# Issue #846: CI/CD Templates for Safe Model Deployments.
#
# Builds the Safe Deployment Service image, runs smoke tests, and optionally
# deploys to dev/staging/prod when KUBE_CONFIG is configured. Use GitHub
# Environments with required reviewers for staging → prod promotion.

name: Deploy Staged

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev, staging, prod)"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/safe-deployment

jobs:
  # Skip heavy Docker build on PR; run only on push to main. Smoke-test builds image on PR.
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and build
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.safe-deployment
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke test (health + llm-check)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker build -f deploy/Dockerfile.safe-deployment -t safe-deployment:smoke .
          echo "SMOKE_IMAGE=safe-deployment:smoke" >> $GITHUB_ENV

      - name: Pull image for smoke test (push)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev safe-deployment:smoke
          echo "SMOKE_IMAGE=safe-deployment:smoke" >> $GITHUB_ENV

      - name: Run container and smoke test
        run: |
          docker run -d --name app -p 8080:8080 ${{ env.SMOKE_IMAGE }}
          echo "Waiting for service to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then echo "Health OK"; break; fi
            if [ "$i" -eq 30 ]; then echo "Health check timeout"; docker logs app; exit 1; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/llm-check
          docker stop app

  # Deploy jobs run when repo variable ENABLE_KUBE_DEPLOY is 'true' and KUBE_CONFIG secret is set.
  # Configure GitHub Environments (dev, staging, prod) with required reviewers for staging → prod.
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: [ build-and-push, smoke-test ]
    if: github.event_name != 'pull_request' && (vars.ENABLE_KUBE_DEPLOY == 'true' || github.event.inputs.environment == 'dev')
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to dev
        run: |
          kubectl apply -k deploy/overlays/dev --namespace=llm4s-dev
          kubectl rollout status deployment/llm4s-safe-deployment -n llm4s-dev --timeout=120s

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [ deploy-dev ]
    if: github.event_name != 'pull_request' && (vars.ENABLE_KUBE_DEPLOY == 'true' || github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to staging
        run: |
          kubectl apply -k deploy/overlays/staging --namespace=llm4s-staging
          kubectl rollout status deployment/llm4s-safe-deployment -n llm4s-staging --timeout=120s

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: [ deploy-staging ]
    if: github.event_name != 'pull_request' && (vars.ENABLE_KUBE_DEPLOY == 'true' || github.event.inputs.environment == 'prod')
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to prod
        run: |
          kubectl apply -k deploy/overlays/prod --namespace=llm4s-prod
          kubectl rollout status deployment/llm4s-safe-deployment -n llm4s-prod --timeout=120s
