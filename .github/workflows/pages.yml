name: Deploy Documentation

# A release run is named after its tag so that release.yml can find, and wait for, the run it dispatched
# (scripts/dispatch-docs-deploy.sh matches this exact title; scripts/test-dispatch-docs-deploy.sh checks the two agree).
run-name: ${{ inputs.ref != '' && format('Deploy Documentation ({0})', inputs.ref) || 'Deploy Documentation' }}

on:
  # Docs changes on main deploy directly.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # Every module's sources, not just core's: the carve slices (#1126) keep moving public
      # API out of core, and a filter naming only core stops triggering a docs deploy for the
      # modules that now hold it.
      - 'modules/*/src/**'
      - 'modules/workspace/*/src/**'
      - '.github/workflows/pages.yml'

  # Releases deploy by DISPATCHING this workflow on `main` from release.yml (scripts/dispatch-docs-deploy.sh), gated on
  # the Maven publish and the GitHub Release, with the release tag as `ref`.
  #
  # It used to be a `workflow_call`, which inherits the caller's ref, so the deploy job ran on the tag and the
  # `github-pages` environment, whose deployment rule allows only the `main` branch, rejected it before the job
  # started (#1152). A dispatched run's ref is the ref it was dispatched on, so it deploys from `main`, while the
  # build below still checks out the tag: `git describe` and sbt-dynver see exactly the release, as before.
  #
  # Gating on the Release *workflow* instead (a `workflow_run` trigger) would suppress the docs deploy when a step
  # after `sbt ci-release` fails (the container image push), even though the artifacts are already live on Maven
  # Central, which is why release.yml dispatches from its own `docs` job.
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Release tag to build the docs from (for example v0.5.0). Leave it empty to build the branch this run was
          started on. Either way the deploy runs on the branch the run was started on, which must be `main`.
        required: false
        default: ''
        type: string

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The input reaches the checkout's `ref`, not a shell, but it is still checked first: only a release tag
      # (v1.2.3, v1.2.3-RC1) is accepted, and `refs/tags/` below stops a branch of the same name from being built.
      - name: Validate the requested ref
        if: ${{ inputs.ref != '' }}
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$REQUESTED_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::ref must be a release tag such as v0.5.0 or v1.0.0-RC1."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The requested release tag, or else the ref this run was started on.
          ref: ${{ inputs.ref != '' && format('refs/tags/{0}', inputs.ref) || github.ref }}
          fetch-depth: 0  # needed for `git describe` to see release tags

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Extract version from sbt
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Working version of this commit. On an untagged main, sbt-dynver returns
          # something like 0.4.0+3-abc1234-SNAPSHOT, which is NOT resolvable from
          # Maven Central. It is fine to display, but must never appear in an
          # install snippet.
          VERSION=$(sbt -no-colors 'print version' | tail -1 | tr -d '\n')

          # Latest published release, from the GitHub Releases API. Install snippets use
          # this, and it is deliberately NOT `git describe`: a tag exists from the moment
          # it is pushed, whereas a Release is created only after `sbt ci-release` has
          # actually published (see release.yml). `git describe` also answers "newest tag
          # reachable from this ref", which silently gives the wrong answer when a newer
          # release is still publishing, or when a release was cut from a branch other
          # than the one being built.
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null | sed 's/^v//')
          if [ -z "$LATEST" ]; then
            echo "::error::No published GitHub Release found; cannot determine the published version."
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "latest_release=$LATEST" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION / latest release: $LATEST"

          sed -i "s/^version:.*/version: \"$VERSION\"/" docs/_data/project.yml
          sed -i "s/^latest_release:.*/latest_release: \"$LATEST\"/" docs/_data/project.yml

          echo "Updated docs/_data/project.yml:"
          cat docs/_data/project.yml

      - name: Generate Scaladoc
        run: |
          set -euo pipefail

          # One Scaladoc run across every published module. This used to be `core/doc`, which
          # was right when core was the whole library; the carve slices (#1126) have since
          # moved rag, knowledgegraph, memory, memory-postgres and mcp out of it, and a
          # core-only build silently dropped their API pages. See the `docs` project in
          # build.sbt for what it spans and how to keep it current.
          sbt "docs/doc"

          SCALADOC_DIR=$(find modules/docs/target -name "api" -type d | grep "scala-3" | head -1)

          if [ -z "$SCALADOC_DIR" ] || [ ! -d "$SCALADOC_DIR" ]; then
            echo "::error::Aggregate Scaladoc not found under modules/docs/target."
            exit 1
          fi

          echo "Scaladoc directory: $SCALADOC_DIR"

          # Guard against a silently partial site: every published module must contribute at
          # least one package page. This is the check that would have caught slices 1 and 2
          # dropping out of the published API docs.
          missing=""
          for pkg in llmconnect toolapi agent assistant rag knowledgegraph vectorstore mcp media imagegeneration imageprocessing speech workspace trace testkit; do
            if [ ! -d "$SCALADOC_DIR/org/llm4s/$pkg" ]; then missing="$missing $pkg"; fi
          done
          if [ ! -d "$SCALADOC_DIR/org/llm4s/agent/memory" ]; then missing="$missing agent.memory"; fi
          # `trace` itself stays in core (the contract); these two are llm4s-observability's.
          if [ ! -d "$SCALADOC_DIR/org/llm4s/trace/store" ]; then missing="$missing trace.store"; fi
          if [ ! -d "$SCALADOC_DIR/org/llm4s/trace/model" ]; then missing="$missing trace.model"; fi
          # `toolapi` itself stays in core (the tool API); `builtin` is llm4s-agent-tools'.
          if [ ! -d "$SCALADOC_DIR/org/llm4s/toolapi/builtin" ]; then missing="$missing toolapi.builtin"; fi
          if [ -n "$missing" ]; then
            echo "::error::Aggregate Scaladoc is missing package(s):$missing"
            echo "::error::Add the owning module to the \`docs\` project in build.sbt."
            exit 1
          fi

          mkdir -p docs/scaladoc
          cp -r "$SCALADOC_DIR"/* docs/scaladoc/
          echo "Scaladoc copied successfully"

      - name: Build Jekyll site
        working-directory: docs
        run: |
          bundle install
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
