name: Deploy Documentation

on:
  # Docs changes on main deploy directly.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'modules/core/src/**'
      - '.github/workflows/pages.yml'

  # Releases deploy by calling this workflow from release.yml, gated on the Maven
  # publish job alone. Two reasons it is a `workflow_call` rather than a trigger here:
  #
  #  - Gating on the Release *workflow* would suppress the docs deploy when a step
  #    after `sbt ci-release` fails (the container image push), even though the
  #    artifacts are already live on Maven Central.
  #  - A called workflow inherits the caller's ref, so `git describe` sees exactly
  #    the tag being released. Deriving it from the default branch instead could
  #    pick a newer tag that has not published yet, or miss a tag not reachable
  #    from main.
  workflow_call:

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for `git describe` to see release tags

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Extract version from sbt
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Working version of this commit. On an untagged main, sbt-dynver returns
          # something like 0.4.0+3-abc1234-SNAPSHOT, which is NOT resolvable from
          # Maven Central. It is fine to display, but must never appear in an
          # install snippet.
          VERSION=$(sbt -no-colors 'print version' | tail -1 | tr -d '\n')

          # Latest published release, from the GitHub Releases API. Install snippets use
          # this, and it is deliberately NOT `git describe`: a tag exists from the moment
          # it is pushed, whereas a Release is created only after `sbt ci-release` has
          # actually published (see release.yml). `git describe` also answers "newest tag
          # reachable from this ref", which silently gives the wrong answer when a newer
          # release is still publishing, or when a release was cut from a branch other
          # than the one being built.
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null | sed 's/^v//')
          if [ -z "$LATEST" ]; then
            echo "::error::No published GitHub Release found; cannot determine the published version."
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "latest_release=$LATEST" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION / latest release: $LATEST"

          sed -i "s/^version:.*/version: \"$VERSION\"/" docs/_data/project.yml
          sed -i "s/^latest_release:.*/latest_release: \"$LATEST\"/" docs/_data/project.yml

          echo "Updated docs/_data/project.yml:"
          cat docs/_data/project.yml

      - name: Generate Scaladoc
        run: |
          # Generate Scaladoc for both Scala versions
          sbt "core/doc"

          # Find the generated doc directory (use Scala 3 by default)
          SCALADOC_DIR=$(find modules/core/target -name "api" -type d | grep "scala-3" | head -1)

          if [ -z "$SCALADOC_DIR" ]; then
            # Fall back to Scala 2.13 if Scala 3 not found
            SCALADOC_DIR=$(find modules/core/target -name "api" -type d | head -1)
          fi

          echo "Scaladoc directory: $SCALADOC_DIR"

          # Create scaladoc directory in docs
          mkdir -p docs/scaladoc

          # Copy Scaladoc to docs
          if [ -n "$SCALADOC_DIR" ] && [ -d "$SCALADOC_DIR" ]; then
            cp -r "$SCALADOC_DIR"/* docs/scaladoc/
            echo "Scaladoc copied successfully"
            ls -la docs/scaladoc/
          else
            echo "Warning: Scaladoc directory not found"
            echo "<html><body><h1>Scaladoc</h1><p>API documentation will be available after the next release.</p></body></html>" > docs/scaladoc/index.html
          fi

      - name: Build Jekyll site
        working-directory: docs
        run: |
          bundle install
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
