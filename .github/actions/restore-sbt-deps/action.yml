name: Restore the sbt dependency cache
description: >-
  Restores the sbt, Ivy and Coursier caches that .github/workflows/dependency-cache.yml saves on main. Restore only:
  no other workflow saves them.

# Why (2026-11-20, PRs #2563 and #2564): setup-java's `cache: 'sbt'` keyed the cache on the build files with no
# restore-keys, and the first job to finish after a build-file change saved it. That job resolved only what it used, so
# every other job downloaded the rest from Maven Central at the same moment, from shared runner IPs, and Quick Checks,
# Kotlin API and MiMa failed on HTTP 429. dependency-cache.yml resolves every project, compiler bridge and tool once, and
# is the only writer; every job restores that.
#
# The key is the build files' hash. When it misses - a pull request that changes a dependency, or main before
# dependency-cache.yml has run for the new build files - the restore key falls back to the newest saved cache, so the
# job downloads only what changed. Caches are per OS and per branch scope; a pull request reads main's.

outputs:
  cache-hit:
    description: "'true' when the cache for exactly these build files was restored"
    value: ${{ steps.restore.outputs.cache-hit }}
  key:
    description: The key a complete cache for these build files is saved under (computed before sbt runs)
    value: ${{ steps.restore.outputs.cache-primary-key }}
  paths:
    description: The cached paths, for actions/cache/save; the save must name the same paths or the restore misses it
    value: ${{ steps.paths.outputs.paths }}

runs:
  using: composite
  steps:
    # The same paths as setup-java's sbt cache. Never ~/.ivy2/local (publishLocal output would be restored into later
    # builds as if it were a release) and never a target/ directory. Coursier's cache is in a different place per OS.
    - id: paths
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Windows) coursier='~/AppData/Local/Coursier/Cache' ;;
          macOS)   coursier='~/Library/Caches/Coursier' ;;
          *)       coursier='~/.cache/coursier' ;;
        esac
        {
          echo 'paths<<EOF'
          echo '~/.ivy2/cache'
          echo '~/.sbt'
          echo "$coursier"
          echo '!~/.sbt/*.lock'
          echo '!~/**/ivydata-*.properties'
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: sbt-deps-v1-${{ runner.os }}-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt') }}
        restore-keys: |
          sbt-deps-v1-${{ runner.os }}-
