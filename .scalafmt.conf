version = 3.7.14
runner.dialect = scala213

# Maximum line length
maxColumn = 120

# Vertical alignment
align.preset = more

# Newlines
newlines.afterCurlyLambdaParams = squash
newlines.alwaysBeforeMultilineDef = false

# Indentation
indent.main = 2
indent.callSite = 2
indent.defnSite = 2

# Spaces
spaces.inImportCurlyBraces = true

# Code rewrite rules
rewrite.rules = [
  AvoidInfix,
  RedundantBraces,
  RedundantParens,
  SortModifiers,
  PreferCurlyFors
]

# Docstring formatting
docstrings.style = Asterisk
docstrings.wrap = no

# Trailing commas
trailingCommas = preserve

# The Scalafix migration rules' testkit input and expected output (#2330): the output is compared byte for byte with
# what the rules write, so neither is formatted.
project.excludePaths = [
  "glob:**/scalafix-rules/input/**",
  "glob:**/scalafix-rules/output/**"
]

fileOverride {
  "glob:**/samples/src/main/scala/**" {
     runner.dialect = scala3
  }
  "glob:**/workspaceRunner/src/test/scala/**" {
     runner.dialect = scala3
  }
  "glob:**/shared/src/main/scala/**" {
     runner.dialect = scala3
  }
  "glob:**/shared/src/test/scala/**" {
     runner.dialect = scala3
  }
  "glob:**/src/main/scala/**" {
     runner.dialect = scala3
  }
  "glob:**/src/test/scala/**" {
     runner.dialect = scala3
  }
  "glob:**/workspaceRunner/src/main/scala/**" {
     runner.dialect = scala3
  }
  "glob:**/crossTest/scala3/src/test/scala/**" {
     runner.dialect = scala3
  }
  "glob:**/src/main/scala-3/**" {
     runner.dialect = scala3
  }
}
