# Defaults for llm4s-rag.
#
# HOCON merges reference.conf across jars, so these keys sit under the same `llm4s`
# root as llm4s-core's. They live here rather than in core because the code that
# reads them lives here: `org.llm4s.config.PgSearchIndexConfigLoader` and
# `org.llm4s.reranker.RerankerFactory`. A key left behind in core would be a default
# that applies to nothing.
llm4s {

  # Reranker configuration (load at the app edge and pass to RerankerFactory.fromConfig).
  rerank {
    provider = ${?RERANK_PROVIDER} # cohere | none
    cohere {
      apiKey  = ${?COHERE_API_KEY}
      baseUrl = ${?COHERE_RERANK_BASE_URL}
      model   = ${?COHERE_RERANK_MODEL}
    }
  }

  # PostgreSQL settings used by permission-aware RAG (loaded at the app edge).
  # Env var overrides supported for convenience:
  #   PGVECTOR_HOST, PGVECTOR_PORT, PGVECTOR_DATABASE,
  #   PGVECTOR_USER, PGVECTOR_PASSWORD,
  #   PGVECTOR_TABLE, PGVECTOR_MAX_POOL_SIZE
  rag {
    permissions {
      pg {
        host = "localhost"
        host = ${?PGVECTOR_HOST}
        port = 5432
        port = ${?PGVECTOR_PORT}
        database = "postgres"
        database = ${?PGVECTOR_DATABASE}

        user = "postgres"
        user = ${?PGVECTOR_USER}
        password = ""
        password = ${?PGVECTOR_PASSWORD}

        vectorTableName = "vectors"
        vectorTableName = ${?PGVECTOR_TABLE}

        keywordTableName = "documents"
        keywordTableName = ${?PGVECTOR_KEYWORD_TABLE}

        maxPoolSize = 10
        maxPoolSize = ${?PGVECTOR_MAX_POOL_SIZE}
      }
    }
  }
}
