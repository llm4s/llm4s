# llm4s-openai-compatible defaults. HOCON merges this with llm4s-core's
# reference.conf, so these keys exist exactly when this module is on the
# classpath (#1132).
llm4s {
  # Each vendor's shared API key, keyed by provider id, bound to the variable the
  # vendor's own SDK or docs use. A chat section that sets no apiKey of its own
  # uses its vendor's, so with the variable set a section needs only `provider`
  # and `model`. Keys only: baseUrl stays in the section.
  #
  # The generic `openai-compatible` provider has no block: it has no vendor.
  credentials {
    deepseek {
      apiKey = ${?DEEPSEEK_API_KEY}
    }
    zai {
      apiKey = ${?ZAI_API_KEY}
    }
    openrouter {
      apiKey = ${?OPENROUTER_API_KEY}
    }
    mistral {
      apiKey = ${?MISTRAL_API_KEY}
    }
    # Shared with llm4s-rag's Cohere reranker, which binds the same key.
    cohere {
      apiKey = ${?COHERE_API_KEY}
    }
  }

  providers {
    # Named providers served by this module. Chat config is keyed by the
    # instance name you choose, so these can only be examples.
    #
    # deepseek-main {
    #   provider = "deepseek"
    #   model = "deepseek-chat"
    # }
    #
    # zai-main {
    #   provider = "zai"
    #   model = "glm-4.5"
    # }
    #
    # openrouter-main {
    #   provider = "openrouter"
    #   model = "openai/gpt-4o-mini"
    # }
    #
    # mistral-main {
    #   provider = "mistral"
    #   model = "mistral-large-latest"
    #   # The API root; requests go to <baseUrl>/v1/chat/completions.
    #   # baseUrl = "https://api.mistral.ai"
    # }
    #
    # cohere-main {
    #   provider = "cohere"
    #   model = "command-a-03-2025"
    #   # Cohere's OpenAI-compatibility API, https://api.cohere.ai/compatibility/v1
    #   # by default. A native API root such as https://api.cohere.com is mapped
    #   # to <root>/compatibility/v1.
    # }
    #
    # A section for a second account sets its own key, which wins over the
    # shared one:
    #
    # openrouter-team {
    #   provider = "openrouter"
    #   model = "openai/gpt-4o-mini"
    #   apiKey = ${?OPENROUTER_TEAM_API_KEY}
    # }
    #
    # Generic OpenAI-compatible endpoints. Any server speaking the OpenAI
    # /chat/completions API works with provider = "openai-compatible", and
    # several sections can use it side by side. `baseUrl` and `model` are
    # required; everything else is optional:
    #   apiKey            - sent as "Authorization: Bearer <key>"; omit it for
    #                       servers that take unauthenticated requests
    #   contextWindow     - the model's context window; overrides the model
    #                       registry (default: the registry's window for the
    #                       model when it has one, else 8192)
    #   registryProvider  - the model registry provider (groq, together_ai,
    #                       fireworks_ai, xai, perplexity, ...) whose entry for
    #                       the model gives the window when contextWindow is
    #                       not set; inferred from the baseUrl host for Groq,
    #                       Together, Fireworks, xAI and Perplexity
    #   reserveCompletion - tokens held back for the reply (default 2048)
    #   headers           - extra headers sent on every request
    #   streamUsage       - ask for token usage on a stream with
    #                       stream_options.include_usage (default true); set
    #                       false for a server that rejects that field
    #
    # To take the endpoint from the environment, bind the conventional variables
    # (OpenAICompatibleConfigKeys):
    #
    # compatible-env {
    #   provider = "openai-compatible"
    #   baseUrl = ${?OPENAI_COMPATIBLE_BASE_URL}
    #   model = ${?OPENAI_COMPATIBLE_MODEL}
    #   apiKey = ${?OPENAI_COMPATIBLE_API_KEY}
    # }
    #
    # groq-main {
    #   provider = "openai-compatible"
    #   baseUrl = "https://api.groq.com/openai/v1"
    #   model = "openai/gpt-oss-120b"
    #   apiKey = ${?GROQ_API_KEY}
    #   contextWindow = 131072
    #   reserveCompletion = 8192
    # }
    #
    # local-vllm {
    #   provider = "openai-compatible"
    #   baseUrl = "http://localhost:8000/v1"
    #   model = "Qwen/Qwen2.5-7B-Instruct"
    #   contextWindow = 32768
    # }
    #
    # internal-gateway {
    #   provider = "openai-compatible"
    #   baseUrl = "https://llm-gateway.internal.example/v1"
    #   model = "gpt-4o-mini"
    #   headers {
    #     X-Team = "search"
    #     X-Gateway-Token = ${?GATEWAY_TOKEN}
    #   }
    #   # This gateway rejects unknown request fields, so don't ask for
    #   # streamed usage.
    #   streamUsage = false
    # }
  }
}
