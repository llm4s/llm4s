# llm4s-vectorstore-elasticsearch defaults. HOCON merges this with the other modules' reference.conf, so these
# keys exist exactly when the Elasticsearch vector store is on the classpath (#1469). Read them at the app edge
# with org.llm4s.config.ElasticsearchVectorStoreConfigLoader and pass the result to ElasticsearchVectorStore.
llm4s {
  vectorstore {
    elasticsearch {
      # Binds environment variables only: the defaults (http://localhost:9200, index llm4s-vectors, cosine
      # similarity, refresh on write, a 30 second timeout) live in ElasticsearchConfig.
      baseUrl  = ${?ELASTICSEARCH_URL}
      index    = ${?ELASTICSEARCH_INDEX}
      # Credentials: an API key (its `encoded` value), or a username and password - not both.
      apiKey   = ${?ELASTICSEARCH_API_KEY}
      username = ${?ELASTICSEARCH_USERNAME}
      password = ${?ELASTICSEARCH_PASSWORD}
      # similarity     = cosine        # cosine | dot_product | l2_norm | max_inner_product
      # dimensions     = 1536          # unset: the first record's size
      # numCandidates  = 100           # unset: max(100, 10 * topK), at most 10000
      # refreshOnWrite = true
      # timeout        = 30 seconds
    }
  }
}
