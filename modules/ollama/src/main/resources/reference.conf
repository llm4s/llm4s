# llm4s-ollama defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the Ollama provider is on the classpath (#1132).
llm4s {
  providers {
    # A named Ollama provider. Chat config is keyed by the instance name you
    # choose, so this can only be an example - there is no key to bind here.
    #
    # ollama-local {
    #   provider = "ollama"
    #   model = "llama3.2"
    #   baseUrl = ${?OLLAMA_LOCAL_BASE_URL}
    # }
  }

  embeddings {
    # Ollama embeddings (local). Binds environment variables only: the defaults
    # (http://localhost:11434, nomic-embed-text) live in OllamaEmbeddingProvider's
    # EmbeddingConfigSpec.
    ollama {
      baseUrl = ${?OLLAMA_EMBEDDING_BASE_URL}
      model   = ${?OLLAMA_EMBEDDING_MODEL}
    }
  }
}
