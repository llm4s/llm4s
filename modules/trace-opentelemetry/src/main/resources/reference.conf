# llm4s-observability-otel defaults. HOCON merges this with llm4s-core's reference.conf,
# so these keys exist exactly when the OpenTelemetry backend is on the classpath (#1133).
llm4s {
  tracing {
    # OpenTelemetry: selected by TRACING_MODE=opentelemetry (or otel), which hands this
    # block to OpenTelemetryTracingBackend as TracingSettings.extras.
    opentelemetry {
      serviceName = "llm4s-agent"
      serviceName = ${?OTEL_SERVICE_NAME}
      endpoint = "http://localhost:4317"
      endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}

      # Headers sent with every export: a map set here in application.conf, or
      # OpenTelemetryConfig.headers in code. OTEL_EXPORTER_OTLP_HEADERS is not
      # read; bind a value yourself if you want one from the environment:
      # headers { Authorization = ${?OTEL_AUTH_HEADER} }
    }
  }
}
