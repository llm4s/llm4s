# llm4s-observability-otel defaults. HOCON merges this with llm4s-core's reference.conf,
# so these keys exist exactly when the OpenTelemetry backend is on the classpath (#1133).
llm4s {
  tracing {
    # OpenTelemetry: selected by TRACING_MODE=opentelemetry, or by otel, the alias
    # OpenTelemetryTracingBackend declares. Either hands this block to the backend as
    # TracingSettings.extras; there is no llm4s.tracing.otel block.
    opentelemetry {
      serviceName = "llm4s-agent"
      serviceName = ${?OTEL_SERVICE_NAME}
      endpoint = "http://localhost:4317"
      endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}

      # Record message content (prompts, completions, an agent's query, tool input and
      # output) on spans, redacted, as gen_ai.input.messages / gen_ai.output.messages.
      # Off by default: content often holds personal or confidential data (#2275).
      captureContent = false
      captureContent = ${?OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT}

      # Headers sent with every export: a map set here in application.conf, or
      # OpenTelemetryConfig.headers in code. OTEL_EXPORTER_OTLP_HEADERS is not
      # read; bind a value yourself if you want one from the environment:
      # headers { Authorization = ${?OTEL_AUTH_HEADER} }
    }

    # File: selected by TRACING_MODE=file (#2948). Every trace is written to a local file as OTLP JSON Lines,
    # with no tracing service: a placed trace (an agent run and everything under it) to <dir>/<trace-id>.jsonl,
    # and events without a placement (an embedding call, a model call made outside an agent) to one
    # <dir>/unplaced-<start>-<id>.jsonl per tracing.
    file {
      dir = "llm4s-traces"
      dir = ${?LLM4S_TRACE_DIR}
      serviceName = "llm4s-agent"
      serviceName = ${?OTEL_SERVICE_NAME}

      # Record message content (prompts, completions, tool input and output), redacted, as the opentelemetry
      # block does. Off by default, since the files sit on disk in plain text; a trace is far more useful for
      # investigation with it on: captureContent = true, or OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true.
      captureContent = false
      captureContent = ${?OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT}
    }
  }
}
