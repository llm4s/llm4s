# llm4s-agent-tools defaults. HOCON merges this with llm4s-core's reference.conf, so these keys
# exist exactly when the search tools are on the classpath. The block moved here from core with
# the tools and ToolsConfigLoader (#1242); keys, defaults and variables are unchanged.
llm4s {
  # Search tool configuration, read by ToolsConfigLoader.
  tools {
    brave {
      apiKey = ${?BRAVE_SEARCH_API_KEY}
      count = 5
      count = ${?BRAVE_SEARCH_COUNT}
      apiUrl = "https://api.search.brave.com/res/v1"
      apiUrl = ${?BRAVE_SEARCH_API_URL}
      safeSearch = "moderate"
      safeSearch = ${?BRAVE_SAFE_SEARCH}
    }

    duckduckgo {
      apiUrl = "https://api.duckduckgo.com/"
      apiUrl = ${?DUCK_DUCK_GO_SEARCH_API_URL}
    }

    exa {
      apiKey = ${?EXA_API_KEY}
      apiUrl = "https://api.exa.ai"
      apiUrl = ${?EXA_API_URL}
      numResults = 10
      numResults = ${?EXA_NUM_RESULTS}
      searchType = "auto"
      searchType = ${?EXA_SEARCH_TYPE}
      maxCharacters = 500
      maxCharacters = ${?EXA_MAX_CHARACTERS}
    }
  }
}
