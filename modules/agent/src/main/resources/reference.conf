# llm4s-agent defaults. HOCON merges this with llm4s-core's reference.conf. Override any key in the
# application's application.conf, or with a -D system property.
llm4s {
  agent {
    # The checkpoint store CheckpointerConfigLoader.open() opens (design 4.54). `kind` chooses it: memory (built in,
    # lost when the process ends), sqlite (llm4s-agent-checkpoint-sqlite) or postgres (llm4s-agent-checkpoint-postgres),
    # or the kind of any other CheckpointerBackend on the classpath. Each store module adds its own block here,
    # llm4s.agent.checkpointer.<kind>, with its defaults and bindings; only the selected kind's block is read.
    checkpointer {
      kind = "memory"
      kind = ${?LLM4S_CHECKPOINTER}
    }

    # The policies RuntimeConfigLoader gives a GraphRuntime (design 4.54). The run queue (llm4s.agent.queue) and the
    # worker (llm4s.agent.worker) settings sit beside this block.
    runtime {
      # How a run holds its thread's claim: the lease and how often it is renewed (keep renewEvery at most a third of
      # ttl), and the label that names this runtime in the logs, such as a host or pod name.
      claims {
        ttl = 30 seconds
        renewEvery = 10 seconds
        label = ${?LLM4S_RUNTIME_LABEL}
      }
      # How subscriptions learn of commits made through another runtime sharing the store: enabled, each live
      # subscription reads the store at most pollInterval apart.
      watch {
        enabled = true
        pollInterval = 250 milliseconds
      }
    }

    # The run queue's settings RunQueueConfigLoader.load() returns (design 4.55). The queue lives in the checkpoint
    # store's database; these say how its entries are run and kept.
    queue {
      # attempts an entry makes before it is closed failed (a dead letter); fixed on each entry when it is submitted
      maxAttempts = 5
      # how long a closed entry - its input, attempts and outcome - is kept before the retention sweep reclaims it;
      # waiting on a reclaimed ticket answers TicketExpired
      ticketLifetime = 24 hours
      # how a worker holds an entry: the lease and how often it is renewed (keep renewEvery at most a third of ttl)
      lease {
        ttl = 30 seconds
        renewEvery = 10 seconds
      }
    }

    # The settings WorkerConfigLoader.load() returns (design 4.56): how an AgentWorker takes and runs queued entries.
    worker {
      # the most runs one worker has at once
      concurrency = 4
      # how long the worker waits before asking the queue again when it found nothing to take
      pollInterval = 1 second
      # how long an entry may wait for a worker whose graph version can restore its thread before it is closed failed
      # (Unrunnable): long enough for a rolling upgrade's old workers to finish their runs
      unrunnableAfter = 1 hour
      # on shutdown: how long running runs have to reach a suspension or their end before they are cancelled, and how
      # long a cancelled run then has to exit; one that does not keeps its claim and lease until they expire
      drain {
        grace = 30 seconds
        exitTimeout = 10 seconds
      }
      # the store-wide retention sweep, run by one instance at a time: it prunes threads by `retention` (unset keys
      # remove nothing), reclaims tombstones older than `tombstoneAge` (unset: none), and reclaims closed queue entries
      # past the queue's ticketLifetime
      sweep {
        enabled = true
        every = 5 minutes
        batchSize = 100
        # tombstoneAge = 7 days
        # retention { maxAge = 30 days, maxCheckpoints = 20, maxEvents = 10000 }
      }
      # names the worker in its lease holder and logs, such as a host or pod name
      label = ${?LLM4S_WORKER_LABEL}
      # for a worker given a MetricsCollector (design 4.59): how often it samples its agents' queue depth
      metrics {
        queueDepthEvery = 15 seconds
      }
    }

    # The harness profile HarnessConfigLoader.load() returns (design 4.37): HarnessProfile.deepAgents with
    # these settings. Backends, a sandbox, permission rules and a model compressor are set in code on the
    # loaded profile. A section's `enabled = false` turns that feature off.
    harness {
      # Which of the harness tools (the file tools ls, read_file, write_file, edit_file, delete, glob,
      # grep, and execute with a sandbox) the agent gets: all, only (the names below) or except (all
      # but the names below).
      tools {
        mode = "all"
        names = []
      }

      # The bound on each run of a harness tool that declares none, such as "2 minutes". Unset: none.
      # toolTimeout = "2 minutes"

      # default (the harness's prompt), replace (text instead) or suffix (the harness's prompt, then text).
      systemPrompt {
        mode = "default"
        text = ""
      }

      todos {
        enabled = true
        maxTodos = 50
        maxTodoChars = 200
      }

      summarization {
        enabled = true
        # tokens: a request over `max` estimated tokens is summarised; messages: one of more than `max` messages
        trigger = "tokens"
        max = 100000
        keepRecent = 10
        maxSummaryTokens = 2000
      }

      offload {
        enabled = true
        thresholdTokens = 20000
        maxResultBytes = 1048576
        maxTotalBytes = 4194304
      }

      skills {
        enabled = true
        sources = ["/skills"]
        maxSkills = 20
        maxDescriptionChars = 256
        maxSectionTokens = 1500
        maxScanned = 100
        maxCachedRuns = 64
      }

      instructions {
        enabled = true
        paths = ["/AGENTS.md"]
        maxFileTokens = 1000
        maxTotalTokens = 2000
        maxCachedRuns = 64
      }

      # After each turn, a thread keeps its latest maxCheckpoints checkpoints: each is a full snapshot.
      retention {
        maxCheckpoints = 20
      }

      # Subagents (design 4.48): the general-purpose subagent, offered through the task tool, and the bounds on
      # every delegated task. Specialist subagents and subagent models are set in code.
      subagents {
        generalPurpose {
          enabled = true
        }
        # child runs one parent run has live at once; a task call over it waits for a slot
        maxConcurrentChildren = 4
        # task calls one parent turn may make
        maxTasksPerTurn = 16
        # how deep delegation nests: 1 lets the agent delegate and its children not
        maxDepth = 1
        # the most a task's tool message may be, in UTF-8 bytes; at least 64
        maxReportBytes = 65536
        # settled child threads each parent thread keeps
        childRetention = 64
      }
    }
  }
}
