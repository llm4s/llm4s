# llm4s-speech defaults for the cloud speech providers (#1010). HOCON merges this with
# llm4s-core's reference.conf, so these keys exist exactly when this module is on the classpath.
# Read by org.llm4s.speech.config.SpeechConfigLoader.
llm4s {
  speech {
    # Text-to-speech selection, "provider/model":
    #   openai/tts-1 | openai/tts-1-hd | elevenlabs/<voice-id> | azure/<voice-name>
    tts {
      model = ${?SPEECH_TTS_MODEL}
      # Optional voice override; OpenAI defaults to "alloy", ElevenLabs/Azure take the voice from the model spec.
      voice = ${?SPEECH_TTS_VOICE}
    }

    # Speech-to-text selection, "provider/model":
    #   openai/whisper-1 | azure/<default-language, e.g. en-US>
    stt {
      model = ${?SPEECH_STT_MODEL}
    }

    # Credentials and endpoints. A key is only required by the provider the model spec selects.
    openai {
      apiKey = ${?OPENAI_API_KEY}
      baseUrl = "https://api.openai.com"
      baseUrl = ${?OPENAI_SPEECH_BASE_URL}
    }

    elevenlabs {
      apiKey = ${?ELEVENLABS_API_KEY}
      baseUrl = "https://api.elevenlabs.io"
      baseUrl = ${?ELEVENLABS_BASE_URL}
      # Model id sent with every synthesis request.
      modelId = "eleven_multilingual_v2"
      modelId = ${?ELEVENLABS_MODEL_ID}
    }

    azure {
      apiKey = ${?AZURE_SPEECH_KEY}
      region = ${?AZURE_SPEECH_REGION}
      # Optional endpoint overrides; by default derived from the region.
      ttsBaseUrl = ${?AZURE_SPEECH_TTS_BASE_URL}
      sttBaseUrl = ${?AZURE_SPEECH_STT_BASE_URL}
    }
  }
}
