# Merged with core's test application.conf, which is on this module's test classpath too (`core % "test->test"`)
# and makes chat's default provider the canned fixturechat. This makes the default embedding model core's canned
# FixtureEmbeddingProvider, so Llm4s.createDefaultEmbeddingClient() succeeds here with no network and no real key.
llm4s {
  embeddings {
    model = "fixtureembedding/fixture-embed-small"
    fixtureembedding {
      apiKey = "test-key"
    }
  }
}
