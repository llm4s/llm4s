# The provider `hello.scala` uses: OpenAI, with the key from OPENAI_API_KEY. For a local Ollama with no key,
# run with --java-opt -Dconfig.resource=ollama.conf, which reads ollama.conf instead of this file.
llm4s {
  providers {
    provider = "openai-main"

    openai-main {
      provider = "openai"
      model    = "gpt-4o-mini"
      apiKey   = ${?OPENAI_API_KEY}
    }
  }
}
