# The providers `hello.scala` can use. `provider` names the default section; override it per run with
#   --java-opt -Dllm4s.providers.provider=ollama-local
llm4s {
  providers {
    provider = "openai-main"

    openai-main {
      provider = "openai"
      model    = "gpt-4o-mini"
      apiKey   = ${?OPENAI_API_KEY}
    }

    # No API key: needs `ollama serve` and `ollama pull llama3`.
    ollama-local {
      provider = "ollama"
      model    = "llama3"
      baseUrl  = "http://localhost:11434"
      baseUrl  = ${?OLLAMA_BASE_URL}
    }
  }
}
