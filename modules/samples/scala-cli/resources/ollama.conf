# The no-key alternative to application.conf: a local Ollama. Select it per run with
#   --java-opt -Dconfig.resource=ollama.conf
# (needs `ollama serve` and `ollama pull llama3`).
llm4s {
  providers {
    provider = "ollama-local"

    ollama-local {
      provider = "ollama"
      model    = "llama3"
      baseUrl  = "http://localhost:11434"
      baseUrl  = ${?OLLAMA_BASE_URL}
    }
  }
}
