# The provider HelloLlm4s.java uses: a local Ollama, which needs no API key. Start it with `ollama serve` and
# pull the model once with `ollama pull llama3` (or change `model` to one you have: `ollama list`).
llm4s {
  providers {
    provider = "ollama-local"

    ollama-local {
      provider = "ollama"
      model    = "llama3"
      baseUrl  = "http://localhost:11434"
      baseUrl  = ${?OLLAMA_BASE_URL}
    }
  }
}
