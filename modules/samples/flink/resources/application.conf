# The provider the job calls without `--scripted`: a local Ollama (`ollama serve`, `ollama pull llama3`). Bundled in
# the job's jar, so the task managers read it. Replace the section to call another provider; its module must be a
# dependency too (project.scala), and its key set on every task manager.
llm4s {
  providers {
    provider = "ollama-local"

    ollama-local {
      provider = "ollama"
      model    = "llama3"
      baseUrl  = "http://localhost:11434"
      baseUrl  = ${?OLLAMA_BASE_URL}
    }
  }
}
