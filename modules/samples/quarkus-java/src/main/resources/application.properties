# The client the quarkus-llm4s extension builds: one section of llm4s.providers, in the Spring Boot starter's spelling.
# The default is a local Ollama server at http://localhost:11434, which needs no key: `ollama pull llama3.2` first.
llm4s.providers.provider=main
llm4s.providers.main.provider=ollama
llm4s.providers.main.model=llama3.2
# llm4s.providers.main.base-url=http://localhost:11434

# Another provider is configuration only, with its module a dependency (pom.xml declares llm4s-openai and
# llm4s-anthropic). The key comes from the vendor's variable, OPENAI_API_KEY here, unless the section sets api-key:
#   llm4s.providers.main.provider=openai
#   llm4s.providers.main.model=gpt-4o-mini

# The readiness check at /q/health/ready is UP once the client is built. Set this to send the model a one-token
# completion instead, at most once every llm4s.health.probe-ttl (60s):
# llm4s.health.probe=true
