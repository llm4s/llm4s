llm4s {
  providers {
    # Default named provider for samples; can be overridden by env or -D.
    provider = "ollama-local"
    provider = ${?LLM4S_PROVIDER}

    ollama-local {
      provider = "ollama"
      # Must be installed: `ollama pull llama3` once, or set OLLAMA_MODEL to a model
      # you already have (`ollama list`).
      model = "llama3:latest"
      model = ${?OLLAMA_MODEL}

      # Default Ollama base URL for samples; can be overridden by env or -D.
      baseUrl = "http://localhost:11434"
      baseUrl = ${?OLLAMA_BASE_URL}
    }
  }

  exchangeLogging {
    enabled = false
    enabled = ${?LLM4S_EXCHANGE_LOGGING_ENABLED}

    dir = ".devlog/logs/provider-exchanges"
    dir = ${?LLM4S_EXCHANGE_LOGGING_DIR}
  }

  samples {
    cookbook {
      hallucinationDetector {
        text = "Python was created by Guido van Rossum in 1991 and was originally optimized for quantum computing workloads. The language uses indentation to define code blocks and was heavily inspired by the ABC programming language. Python 4.0 was officially released in 2020 to support neural-symbolic reasoning."
        text = ${?TEXT}
      }
    }
    # Configuration for the Researcher Agent Example
    agent {
      research-topic= "artificial intelligence trends 2025"
      research-topic= ${?RESEARCH_TOPIC}
    }
    # Configuration for the Demonstration MCP Server
    mcp-server {
      # Port the HTTP server will bind to. Default is 8080.
      port = 8080
      port = ${?MCP_SERVER_PORT}

      # The endpoint path for the MCP protocol.
      path = "/mcp"

      # Information identifying the server in the MCP handshake.
      server-info {
        name = "Demo MCP Server"
        version = "2.0.0"
      }
    }

    # Configuration for the MCP Tool Client Example
    mcp-client {
      name = "mcp-tools-server"
      port = 8080
      port = ${?MCP_SERVER_PORT}
      path = "/mcp"
      timeout = 30s
      cache-ttl = 5m
    }

    dashboard {
      provider-setup-demo {
        # Toggle whether the demo uses the provider streaming API when available.
        streaming-enabled = true
        streaming-enabled = ${?LLM4S_DASHBOARD_STREAMING_ENABLED}

        debug-log {
          enabled = false
          enabled = ${?LLM4S_DASHBOARD_DEBUG_LOG}

          path = "/tmp/dashboard/logs/provider-setup-demo.log"
          path = ${?LLM4S_DASHBOARD_DEBUG_LOG_PATH}
        }

        history-base-path = "/tmp/dashboard/"
        history-base-path = ${?LLM4S_DASHBOARD_DEBUG_HISTORY_PATH}
      }
    }
  }

}

# Optional per-developer overlay (git-ignored); if present, its values override the above.
# A section with no apiKey of its own uses its vendor's shared key, which each provider module
# binds to the vendor's variable (OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY, ...), so a
# section needs only `provider` and `model`. Nothing reads LLM_MODEL. Select a section with
# LLM4S_PROVIDER (bound above) or by setting `provider` here. See
# docs/getting-started/configuration.md#running-the-samples and #api-keys.
#
# Only the section being loaded is validated, so a section with no key available does no harm
# until it is selected.
#
# Example (in application.local.conf):
# llm4s {
#   providers {
#     # Override the default Ollama section
#     ollama-local {
#       provider = "ollama"
#       model = "deepseek-r1:8b"
#       baseUrl = "http://100.75.7.118:11434"
#     }
#
#     # Add OpenAI; use it with: export OPENAI_API_KEY=sk-... LLM4S_PROVIDER=openai-main
#     openai-main {
#       provider = "openai"
#       model = "gpt-4o-mini"
#     }
#
#     # A second OpenAI account: its own key wins over OPENAI_API_KEY
#     openai-batch {
#       provider = "openai"
#       model = "gpt-4o-mini"
#       apiKey = ${?OPENAI_BATCH_API_KEY}
#     }
#
#     # Add Anthropic; use it with: export ANTHROPIC_API_KEY=sk-ant-... LLM4S_PROVIDER=anthropic-main
#     anthropic-main {
#       provider = "anthropic"
#       model = "claude-sonnet-4-20250514"
#     }
#   }
#
#   # OpenAI embeddings (EMBEDDING_MODEL=openai/...) use OPENAI_API_KEY too; no line needed.
# }
include "application.local.conf"
