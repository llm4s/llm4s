# The provider `./mill app.run` uses: the section that `provider` names. OpenAI by default, with the key from
# OPENAI_API_KEY; `LLM4S_PROVIDER=ollama-local ./mill app.run` uses a local Ollama with no key instead
# (needs `ollama serve` and `ollama pull llama3`). Only the section being loaded is checked, so the other one
# needs nothing set.
llm4s {
  providers {
    provider = "openai-main"
    provider = ${?LLM4S_PROVIDER}

    openai-main {
      provider = "openai"
      model    = "gpt-4o-mini"
    }

    ollama-local {
      provider = "ollama"
      model    = "llama3"
      baseUrl  = "http://localhost:11434"
      baseUrl  = ${?OLLAMA_BASE_URL}
    }
  }
}
