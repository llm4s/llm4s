# The provider the sample uses, as a named section: see the configuration guide. With OPENAI_API_KEY set in the
# environment this works as it is; point it at another provider by changing the section, or override any key
# with a system property, for example -Dllm4s.providers.openai-main.model=gpt-5.6-terra.
llm4s {
  defaultProvider = "openai-main"
  providers {
    openai-main {
      provider = "openai"
      model    = "gpt-5.6-luna"
    }
  }

  # The embedding model, as provider/model; the key is the same OPENAI_API_KEY. EMBEDDING_MODEL overrides it.
  embeddings {
    model = "openai/text-embedding-3-small"
    model = ${?EMBEDDING_MODEL}
  }
}
