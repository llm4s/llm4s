# The provider the sample uses, as a named section: see the configuration guide. With OPENAI_API_KEY set in the
# environment this works as it is; point it at another provider by changing the section, or override any key
# with a system property, for example -Dllm4s.providers.openai-main.model=gpt-4o.
llm4s {
  providers {
    provider = "openai-main"

    openai-main {
      provider = "openai"
      model    = "gpt-4o-mini"
    }
  }
}
