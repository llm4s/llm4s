# llm4s-deploy-service defaults. HOCON merges this with llm4s-core's and llm4s-agent's reference.conf.
#
# The service is the thing the staged-deployment workflow (.github/workflows/deploy-staged.yml)
# builds and rolls out; PORT is the variable container platforms conventionally set.
#
# The store, the run queue, the worker and the claims are not configured here: they are llm4s-agent's
# llm4s.agent.{checkpointer,runtime,queue,worker} blocks, bound to LLM4S_CHECKPOINTER,
# LLM4S_CHECKPOINTER_POSTGRES_URL / _USER / _PASSWORD, LLM4S_RUNTIME_LABEL and LLM4S_WORKER_LABEL (design 4.54).
llm4s {
  deploy-service {
    host = "0.0.0.0"
    port = 8080
    port = ${?PORT}

    # The one agent the example service runs (design 4.60).
    agent {
      # The id queue entries name. Every instance sharing a store must run the same agent under it.
      id = "assistant"
      # demo: a built-in scripted model that needs no provider, no network and no key; each turn makes one call to
      # a `pause` tool that takes `toolDelay`, then answers "Echo: <your query>".
      # provider: the application's default provider section (llm4s.providers.provider).
      model = "demo"
      model = ${?LLM4S_SERVICE_MODEL}
      # How long the demo model's tool call takes: long enough to cancel, interrupt or kill a run part-way.
      toolDelay = 2 seconds
      toolDelay = ${?LLM4S_SERVICE_TOOL_DELAY}
    }

    # How GET /runs/{entryId}/events follows a run.
    events {
      # How long one read of the store waits for a commit before the stream sends a keep-alive comment.
      wait = 15 seconds
      # The most events one read returns.
      pageSize = 100
    }

    # GET /metrics: the agent runtime's run, claim, commit and queue metrics (design 4.59) in Prometheus text format.
    metrics {
      enabled = true
      enabled = ${?LLM4S_SERVICE_METRICS}
    }
  }
}
