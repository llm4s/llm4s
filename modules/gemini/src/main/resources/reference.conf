# llm4s-gemini defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the Gemini and Vertex AI providers are on the
# classpath (#1132).
llm4s {
  # The Gemini API's shared key. A chat section that sets no apiKey of its own -
  # provider = "gemini" or its alias "google" - uses this one. Google's SDKs read
  # GOOGLE_API_KEY and GEMINI_API_KEY and prefer GOOGLE_API_KEY when both are set;
  # the later line wins in HOCON, so the same precedence holds here.
  #
  # Vertex AI has no block: it authenticates with OAuth2 (Application Default
  # Credentials, or a service-account file), not an API key.
  credentials {
    gemini {
      apiKey = ${?GEMINI_API_KEY}
      apiKey = ${?GOOGLE_API_KEY}
    }
  }

  providers {
    # Named Gemini and Vertex AI providers. Chat config is keyed by the instance
    # name you choose, so these can only be examples.
    #
    # gemini-main {
    #   provider = "gemini"            # "google" is accepted as an alias
    #   model = "gemini-2.0-flash"
    # }
    #
    # A section for a second account sets its own key, which wins:
    #
    # gemini-team {
    #   provider = "gemini"
    #   model = "gemini-2.0-flash"
    #   apiKey = ${?GEMINI_TEAM_API_KEY}
    # }
    #
    # Vertex AI takes two provider-specific keys: `project`, the GCP project id
    # (required), and `location`, the region (default us-central1). `apiKey` is an
    # optional path to a service-account credential file - it authenticates with
    # OAuth2, using Application Default Credentials when `apiKey` is unset.
    # `endpoint` and `organization` are deprecated aliases for `project` and
    # `location` (#1215). Neither is a shared field any more (#1133): a Vertex AI
    # section that still sets them has them read as these aliases, with a warning.
    #
    # vertexai-main {
    #   provider = "vertexai"          # "vertex" is accepted as an alias
    #   model = "gemini-2.0-flash"
    #   project = ${?VERTEXAI_MAIN_PROJECT_ID}
    #   location = ${?VERTEXAI_MAIN_LOCATION}
    #   apiKey = ${?GOOGLE_APPLICATION_CREDENTIALS}
    # }
  }
}
