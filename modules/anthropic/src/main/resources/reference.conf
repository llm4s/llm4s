# llm4s-anthropic defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the Anthropic provider is on the classpath (#1132).
llm4s {
  # Anthropic's shared API key. A chat section that sets no apiKey of its own
  # uses this one, so with ANTHROPIC_API_KEY set a section needs only `provider`
  # and `model`.
  credentials {
    anthropic {
      apiKey = ${?ANTHROPIC_API_KEY}
    }
  }

  providers {
    # A named Anthropic provider. Chat config is keyed by the instance name you
    # choose, so this can only be an example.
    #
    # anthropic-main {
    #   provider = "anthropic"
    #   model = "claude-sonnet-4-20250514"
    # }
    #
    # A section for a second account sets its own key, which wins:
    #
    # anthropic-team {
    #   provider = "anthropic"
    #   model = "claude-sonnet-4-20250514"
    #   apiKey = ${?ANTHROPIC_TEAM_API_KEY}
    # }
  }
}
