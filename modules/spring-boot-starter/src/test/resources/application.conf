# The application.conf that Llm4s.createDefaultClient() reads in this module's tests: the "another provider" snippet of
# docs/guide/spring-boot.md builds its client from it. Ollama needs no key, and creating the client sends no request.
llm4s {
  providers {
    provider = "ollama-local"

    ollama-local {
      provider = "ollama"
      model    = "llama3.2"
      baseUrl  = "http://localhost:11434"
    }

    # A section whose key comes from this file, not from a Spring property: SpringProvidersSpec checks that the
    # health indicator keeps it out of its messages all the same.
    conf-fixture {
      provider = "fixturechat"
      model    = "fixture-model"
      apiKey   = "plain-conf-held-credential"
    }

    # #1820: credentials that are not a top-level text field of the resolved config - Bedrock's session credentials,
    # nested in `credentials`, and a gateway token in `headers` - kept out of the health indicator's messages too.
    conf-bedrock {
      provider        = "bedrock"
      model           = "anthropic.claude-3-5-sonnet-20241022-v2:0"
      region          = "us-east-1"
      accessKeyId     = "ASIACONFHELDKEYID"
      secretAccessKey = "conf-held-secret-access-key"
      sessionToken    = "conf-held-session-token"
    }

    conf-gateway {
      provider = "openai-compatible"
      model    = "gateway-model"
      baseUrl  = "https://gateway.example.test/v1"
      headers {
        Authorization = "Bearer conf-held-header-token"
        X-Gateway-Tenant = "conf-held-tenant-credential"
      }
    }
  }
}
