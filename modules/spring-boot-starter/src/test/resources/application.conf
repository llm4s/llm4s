# The application.conf that Llm4s.createDefaultClient() reads in this module's tests: the "another provider" snippet of
# docs/guide/spring-boot.md builds its client from it. Ollama needs no key, and creating the client sends no request.
llm4s {
  providers {
    provider = "ollama-local"

    ollama-local {
      provider = "ollama"
      model    = "llama3.2"
      baseUrl  = "http://localhost:11434"
    }

    # A section whose key comes from this file, not from a Spring property: SpringProvidersSpec checks that the
    # health indicator keeps it out of its messages all the same.
    conf-fixture {
      provider = "fixturechat"
      model    = "fixture-model"
      apiKey   = "plain-conf-held-credential"
    }
  }
}
