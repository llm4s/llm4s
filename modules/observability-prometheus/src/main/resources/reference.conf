# llm4s-observability-prometheus defaults. HOCON merges this with llm4s-core's reference.conf,
# so these keys exist exactly when the Prometheus backend is on the classpath (#1133). They
# were hard-coded in MetricsConfigLoader while it lived in core, which had no llm4s.metrics
# block; MetricsConfigLoader keeps the same values for a source without this file.
llm4s {
  metrics {
    # Off unless asked for: enabling it starts an HTTP server.
    enabled = false
    prometheus {
      # Only consulted when llm4s.metrics.enabled = true.
      enabled = true
      # Port for the /metrics endpoint Prometheus scrapes.
      port = 9090
    }
  }
}
