# llm4s-agent-checkpoint-sqlite defaults: the `sqlite` checkpoint store's block (design 4.54), read when
# llm4s.agent.checkpointer.kind = sqlite. Override any key in the application's application.conf, or with -D.
llm4s {
  agent {
    checkpointer {
      sqlite {
        # The database file, created if it does not exist (its directory must). Required.
        path = ${?LLM4S_CHECKPOINTER_SQLITE_PATH}
        # How long a write waits for the file's write lock; every call returns within twice this.
        busyTimeout = 5 seconds
      }
    }
  }
}
