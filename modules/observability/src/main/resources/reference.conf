# llm4s-observability defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the Langfuse backend is on the classpath (#1133).
llm4s {
  tracing {
    # Langfuse: selected by TRACING_MODE=langfuse, which hands this block to
    # LangfuseTracingBackend as TracingSettings.extras. Binds environment variables
    # only; the defaults (Langfuse Cloud, env "production", release and version
    # "1.0.0") live in LangfuseConfig. publicKey and secretKey are required.
    langfuse {
      url       = ${?LANGFUSE_URL}
      publicKey = ${?LANGFUSE_PUBLIC_KEY}
      secretKey = ${?LANGFUSE_SECRET_KEY}
      env       = ${?LANGFUSE_ENV}
      release   = ${?LANGFUSE_RELEASE}
      version   = ${?LANGFUSE_VERSION}
    }
  }
}
