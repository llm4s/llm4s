# llm4s-agent-checkpoint-postgres defaults: the `postgres` checkpoint store's block (design 4.54), read when
# llm4s.agent.checkpointer.kind = postgres. Override any key in the application's application.conf, or with -D.
llm4s {
  agent {
    checkpointer {
      postgres {
        # The database, as jdbc:postgresql://host:port/database. Required.
        url = ${?LLM4S_CHECKPOINTER_POSTGRES_URL}
        # The role the store connects as. Required.
        user = ${?LLM4S_CHECKPOINTER_POSTGRES_USER}
        # Its password; unset for none. Never logged.
        password = ${?LLM4S_CHECKPOINTER_POSTGRES_PASSWORD}
        # The schema the store's tables live in, created if missing.
        schema = "llm4s"
        # How long one call may hold its connection (the server's statement and lock timeouts), and how long it
        # waits for a connection from the pool: every call returns within their sum.
        callTimeout = 5 seconds
        connectionTimeout = 5 seconds
        # The store's own connection pool.
        maxPoolSize = 10
      }
    }
  }
}
