# llm4s-vectorstore-redis defaults. HOCON merges this with the other modules' reference.conf, so these keys exist
# exactly when the Redis vector store is on the classpath (#1470). Read them at the app edge with
# org.llm4s.config.RedisVectorStoreConfigLoader and pass the result to RedisVectorStore.
llm4s {
  vectorstore {
    redis {
      # Binds environment variables only: the defaults (localhost:6379, no TLS, no authentication, index
      # llm4s-vectors, HNSW with cosine distance, a 10 second timeout) live in RedisConfig.
      host     = ${?REDIS_HOST}
      port     = ${?REDIS_PORT}
      tls      = ${?REDIS_TLS}
      username = ${?REDIS_USERNAME}
      password = ${?REDIS_PASSWORD}
      index    = ${?REDIS_VECTOR_INDEX}
      # database       = 0
      # keyPrefix      = "llm4s-vectors:"  # unset: "<index>:"
      # algorithm      = HNSW              # HNSW | FLAT
      # distanceMetric = COSINE            # COSINE | IP | L2
      # dimensions     = 1536              # unset: the first record's size
      # timeout        = 10 seconds
    }
  }
}
