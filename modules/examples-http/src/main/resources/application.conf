# The reference apps' provider, as in the samples (modules/samples/src/main/resources/application.conf): a local
# Ollama by default. Select another named section with LLM4S_PROVIDER, or run with --fake to need no model at all.
llm4s {
  providers {
    provider = "ollama-local"
    provider = ${?LLM4S_PROVIDER}

    ollama-local {
      provider = "ollama"
      # Must be installed: `ollama pull llama3` once, or set OLLAMA_MODEL to a model you already have.
      model = "llama3:latest"
      model = ${?OLLAMA_MODEL}

      baseUrl = "http://localhost:11434"
      baseUrl = ${?OLLAMA_BASE_URL}
    }

    # Uses OPENAI_API_KEY: export it and LLM4S_PROVIDER=openai-main.
    openai-main {
      provider = "openai"
      model = "gpt-4o-mini"
    }

    # Uses ANTHROPIC_API_KEY: export it and LLM4S_PROVIDER=anthropic-main.
    anthropic-main {
      provider = "anthropic"
      model = "claude-sonnet-4-20250514"
    }
  }
}

# The Play app (org.llm4s.examples.http.playframework, #2339). This file is Play's application.conf too: the Play app
# reads the llm4s block above from Play's own configuration (Llm4sConfig.from), so it sits beside Play's keys. The
# other apps ignore everything below.
play {
  modules.enabled += "org.llm4s.examples.http.playframework.ChatModule"
  http.router = "org.llm4s.examples.http.playframework.ChatRouter"

  # Production mode refuses to start without a secret of 32 bytes or more. The app sets no cookies and signs nothing,
  # so this one only satisfies that check; a real service sets its own through APPLICATION_SECRET.
  http.secret.key = "llm4s-examples-http-play-app-signs-nothing"
  http.secret.key = ${?APPLICATION_SECRET}
}

examples.chat {
  # Serve the scripted client instead of the provider: what --fake sets.
  fake = false

  # How often a quiet /chat/stream sends a comment.
  heartbeat = 15 seconds

  # The dispatcher POST /chat waits for its run on (ChatExecutionContext): a provider call blocks a thread, so it
  # never runs on Play's default dispatcher. Size the pool for the requests you serve at once.
  blocking-dispatcher {
    executor = "thread-pool-executor"
    throughput = 1
    thread-pool-executor {
      fixed-pool-size = 16
    }
  }
}
