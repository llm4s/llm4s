# The reference apps' provider, as in the samples (modules/samples/src/main/resources/application.conf): a local
# Ollama by default. Select another named section with LLM4S_PROVIDER, or run with --fake to need no model at all.
llm4s {
  providers {
    provider = "ollama-local"
    provider = ${?LLM4S_PROVIDER}

    ollama-local {
      provider = "ollama"
      # Must be installed: `ollama pull llama3` once, or set OLLAMA_MODEL to a model you already have.
      model = "llama3:latest"
      model = ${?OLLAMA_MODEL}

      baseUrl = "http://localhost:11434"
      baseUrl = ${?OLLAMA_BASE_URL}
    }

    # Uses OPENAI_API_KEY: export it and LLM4S_PROVIDER=openai-main.
    openai-main {
      provider = "openai"
      model = "gpt-4o-mini"
    }

    # Uses ANTHROPIC_API_KEY: export it and LLM4S_PROVIDER=anthropic-main.
    anthropic-main {
      provider = "anthropic"
      model = "claude-sonnet-4-20250514"
    }
  }
}
