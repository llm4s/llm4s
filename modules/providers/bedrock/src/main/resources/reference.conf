# llm4s-bedrock defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the Bedrock provider is on the classpath (#1008).
llm4s {
  # Bedrock has no vendor API key to share: it authenticates with AWS credentials, which the
  # AWS SDK finds itself (environment variables, ~/.aws, an instance or task role) when the
  # section names none. So there is no llm4s.credentials.bedrock block.
  providers {
    # A named Bedrock provider. Chat config is keyed by the instance name you choose, so this
    # can only be an example. `region` is required and is never defaulted.
    #
    # claude-bedrock {
    #   provider = "bedrock"
    #   model    = "anthropic.claude-3-5-sonnet-20241022-v2:0"   # or an inference profile, us.anthropic....
    #   region   = ${?AWS_REGION}
    #   # profile = ${?AWS_PROFILE}                               # a shared-config profile
    #   # accessKeyId     = ${?AWS_ACCESS_KEY_ID}                 # explicit credentials ...
    #   # secretAccessKey = ${?AWS_SECRET_ACCESS_KEY}
    #   # sessionToken    = ${?AWS_SESSION_TOKEN}                 # ... plus this when temporary
    # }
  }
}
