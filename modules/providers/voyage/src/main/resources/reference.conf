# llm4s-voyage defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the Voyage provider is on the classpath (#1132).
llm4s {
  embeddings {
    # Voyage AI embeddings (cloud). Binds environment variables only: the
    # defaults (https://api.voyageai.com/v1, API key required) live in
    # VoyageAIEmbeddingProvider's EmbeddingConfigSpec.
    voyage {
      apiKey  = ${?VOYAGE_API_KEY}
      baseUrl = ${?VOYAGE_EMBEDDING_BASE_URL}
      model   = ${?VOYAGE_EMBEDDING_MODEL}
    }
  }
}
