# llm4s-perplexity defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the perplexity provider is on the classpath (#1026).
llm4s {
  # Perplexity's API key. A chat section that sets no apiKey of its own uses this
  # one, so with PERPLEXITY_API_KEY set a section needs only `provider` and `model`.
  credentials {
    perplexity {
      apiKey = ${?PERPLEXITY_API_KEY}
    }
  }

  providers {
    # A named Perplexity Agent API provider. Chat config is keyed by the instance
    # name you choose, so this can only be an example.
    #
    # perplexity-main {
    #   provider = "perplexity"
    #   model = "perplexity/sonar"          # an Agent API model, provider/model
    #   # webSearch = false                 # default true: offer the web_search tool (billed per search)
    #   # contextWindow = 128000            # default: the model registry's, else 128000
    # }
  }
}
