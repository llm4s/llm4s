# llm4s-jlama defaults (#2284). Jlama runs the model inside the JVM, so there is
# no API key to bind and no server to point at: no credentials block.
llm4s {
  providers {
    # A named local provider. Chat config is keyed by the instance name you
    # choose, so this can only be an example.
    #
    # local {
    #   provider = "jlama"
    #   model    = "tjake/Llama-3.2-1B-Instruct-JQ4"   # a Hugging Face model id, owner/name
    #   # modelDir = "/data/models"                   # default: ~/.cache/llm4s/jlama
    #   # threads  = 4                                # default: Jlama's, the physical core count
    # }
  }
}
