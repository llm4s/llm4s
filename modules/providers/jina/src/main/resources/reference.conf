# llm4s-jina defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the Jina provider is on the classpath (#1028).
llm4s {
  # Jina AI's shared API key. The embeddings block below uses it unless it sets
  # an apiKey of its own.
  credentials {
    jina {
      apiKey = ${?JINA_API_KEY}
    }
  }

  embeddings {
    # Jina AI embeddings (cloud). Binds environment variables only: the
    # defaults (https://api.jina.ai/v1, API key required) live in
    # JinaEmbeddingProvider's EmbeddingConfigSpec. An apiKey set here wins
    # over llm4s.credentials.jina.apiKey.
    jina {
      baseUrl = ${?JINA_EMBEDDING_BASE_URL}
      model   = ${?JINA_EMBEDDING_MODEL}
    }
  }
}
