# llm4s-cohere defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the Cohere embedding provider is on the classpath.
llm4s {
  # Cohere's shared API key. llm4s-openai-compatible (Cohere chat) and llm4s-rag
  # (the reranker) bind the same key, so one COHERE_API_KEY serves all three; it
  # is bound here too so llm4s-cohere works without either. The embeddings block
  # below uses it unless it sets an apiKey of its own.
  credentials {
    cohere {
      apiKey = ${?COHERE_API_KEY}
    }
  }

  embeddings {
    # Cohere embeddings (cloud). Binds environment variables only: the
    # defaults (https://api.cohere.com, API key required) live in
    # CohereEmbeddingProvider's EmbeddingConfigSpec. An apiKey set here wins
    # over llm4s.credentials.cohere.apiKey.
    cohere {
      baseUrl = ${?COHERE_EMBEDDING_BASE_URL}
      model   = ${?COHERE_EMBEDDING_MODEL}
    }
  }
}
