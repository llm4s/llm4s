# llm4s-jev defaults. HOCON merges this with llm4s-core's reference.conf, so these keys exist exactly
# when the Jev client is on the classpath (#1265).
llm4s {
  # TypeSafe's API key, keyed by the vendor (a TypeSafe account's key, not a Jev-only one), bound to the
  # variable TypeSafe's own SDKs read. The llm4s.jev block below uses it unless it sets an apiKey of its own.
  credentials {
    typesafe {
      apiKey = ${?TYPESAFE_API_KEY}
    }
  }

  jev {
    # Binds environment variables only: the defaults (https://api.typesafe.ai, jev-latest, a 30 second
    # timeout per attempt, two retries) live in JevConfig and JevRetryPolicy. An apiKey set here wins over
    # llm4s.credentials.typesafe.apiKey.
    baseUrl = ${?TYPESAFE_BASE_URL}
    model   = ${?TYPESAFE_DEFAULT_MODEL}
  }
}
