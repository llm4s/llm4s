# llm4s-watsonx defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the watsonx provider is on the classpath (#1019).
llm4s {
  # IBM Cloud's shared API key, exchanged for an IAM bearer token. A chat section
  # that sets no apiKey of its own uses this one, so with WATSONX_API_KEY set a
  # section needs only `provider`, `model` and `projectId`.
  credentials {
    watsonx {
      apiKey = ${?WATSONX_API_KEY}
    }
  }

  providers {
    # A named watsonx provider. Chat config is keyed by the instance name you
    # choose, so this can only be an example.
    #
    # watsonx-main {
    #   provider = "watsonx"
    #   model = "ibm/granite-13b-instruct-v2"
    #   projectId = ${?WATSONX_PROJECT_ID}     # required, unless spaceId is set
    #   # spaceId = ${?WATSONX_SPACE_ID}       # a deployment space instead of a project
    #   baseUrl = ${?WATSONX_BASE_URL}         # default https://us-south.ml.cloud.ibm.com
    # }
  }
}
