# llm4s-openai defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the OpenAI providers are on the classpath (#1132).
llm4s {
  # Each vendor's shared API key, keyed by provider id. A client - a chat section,
  # the embeddings block - that sets no apiKey of its own uses this one, so with
  # OPENAI_API_KEY set a section needs only `provider` and `model`. Keys only:
  # baseUrl, endpoint, model and apiVersion stay in the client's own section.
  credentials {
    openai {
      apiKey = ${?OPENAI_API_KEY}
    }
    requesty {
      apiKey = ${?REQUESTY_API_KEY}
    }
    # The variable the openai SDK's AzureOpenAI client reads.
    azure {
      apiKey = ${?AZURE_OPENAI_API_KEY}
    }
  }

  providers {
    # Named OpenAI, Requesty and Azure OpenAI providers. Chat config is keyed by
    # the instance name you choose, so these can only be examples. With the
    # vendor's variable set, a section needs no apiKey:
    #
    # openai-main {
    #   provider = "openai"
    #   model = "gpt-4o-mini"
    # }
    #
    # A section for a second account sets its own key, which wins over the
    # shared one:
    #
    # openai-batch {
    #   provider = "openai"
    #   model = "gpt-4o-mini"
    #   apiKey = ${?OPENAI_BATCH_API_KEY}
    # }
    #
    # requesty-main {
    #   provider = "requesty"
    #   model = "openai/gpt-4o-mini"
    # }
    #
    # azure-main {
    #   provider = "azure"
    #   model = "gpt-4o"
    #   endpoint = ${?AZURE_API_BASE}
    #   apiVersion = ${?AZURE_API_VERSION}
    # }
  }

  embeddings {
    # OpenAI embeddings. Binds environment variables only: the defaults
    # (https://api.openai.com/v1) live in OpenAIEmbeddingProvider's
    # EmbeddingConfigSpec. The key is llm4s.credentials.openai.apiKey above
    # unless this block sets an apiKey of its own.
    openai {
      baseUrl = ${?OPENAI_EMBEDDING_BASE_URL}
      model   = ${?OPENAI_EMBEDDING_MODEL}
    }
  }
}
