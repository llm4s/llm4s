# llm4s-openai defaults. HOCON merges this with llm4s-core's reference.conf, so
# these keys exist exactly when the OpenAI providers are on the classpath (#1132).
llm4s {
  providers {
    # Named OpenAI, Requesty and Azure OpenAI providers. Chat config is keyed by
    # the instance name you choose, so these can only be examples - there is no
    # key to bind here.
    #
    # openai-main {
    #   provider = "openai"
    #   model = "gpt-4o-mini"
    #   apiKey = ${?OPENAI_MAIN_API_KEY}
    #   baseUrl = ${?OPENAI_MAIN_BASE_URL}
    #   organization = ${?OPENAI_MAIN_ORGANIZATION}
    # }
    #
    # requesty-main {
    #   provider = "requesty"
    #   model = "openai/gpt-4o-mini"
    #   apiKey = ${?REQUESTY_MAIN_API_KEY}
    #   baseUrl = ${?REQUESTY_MAIN_BASE_URL}
    # }
    #
    # azure-main {
    #   provider = "azure"
    #   model = "gpt-4o"
    #   apiKey = ${?AZURE_MAIN_API_KEY}
    #   endpoint = ${?AZURE_MAIN_ENDPOINT}
    #   apiVersion = ${?AZURE_MAIN_API_VERSION}
    # }
  }

  embeddings {
    # OpenAI embeddings. Binds environment variables only: the defaults
    # (https://api.openai.com/v1) live in OpenAIEmbeddingProvider's
    # EmbeddingConfigSpec.
    openai {
      baseUrl = ${?OPENAI_EMBEDDING_BASE_URL}
      model   = ${?OPENAI_EMBEDDING_MODEL}
      # apiKey is deliberately absent: OpenAI embeddings reuse llm4s.openai.apiKey.
    }
  }
}
