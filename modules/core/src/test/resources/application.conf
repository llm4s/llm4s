llm4s {
  providers {
    # The test-only fixture provider (org.llm4s.testutil.FixtureChatProvider) rather than a
    # real one, so this default does not change each time a provider leaves core (#1132).
    provider = "fixturechat-main"
    fixturechat-main {
      provider = "fixturechat"
      model = "fixture-model"
      apiKey = "test-key"
      # baseUrl intentionally omitted to rely on the descriptor's default
    }
  }
  tools {
    brave {
      apiKey = "test-key"
    }
  }
}
