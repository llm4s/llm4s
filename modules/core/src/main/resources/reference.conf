# Unified llm4s configuration namespace
llm4s {
  # Named providers.
  #
  # The provider catalog structure lives in HOCON, while secrets and
  # environment-specific values are usually injected via `${?VAR}`.
  # You choose the env var names; they do not need to follow a library-owned
  # naming convention.
  # This is the only LLM provider configuration model supported by llm4s.
  #
  providers {
    # Default named provider: the name of one of the sections below, or of one
    # a provider module documents. If omitted, the providers config still loads,
    # but asking for the default provider will fail clearly at runtime.
    # provider = "<section name>"

    # Providers in their own modules document their examples in that module's
    # reference.conf - llm4s-ollama's shows an `ollama-local` section,
    # llm4s-gemini's shows `gemini-main` and `vertexai-main`,
    # llm4s-anthropic's shows `anthropic-main`, llm4s-openai's shows
    # `openai-main`, `requesty-main` and `azure-main`, and
    # llm4s-openai-compatible's shows `deepseek-main`, `zai-main`,
    # `openrouter-main`, `mistral-main`, `cohere-main` and generic
    # `provider = "openai-compatible"` sections.
  }

  # Tracing
  tracing {
    # Tracing mode: console | noop, built by core, or the mode of any
    # org.llm4s.trace.spi.TracingBackend on the classpath (see Tracing.fromSettings):
    # langfuse (llm4s-observability), opentelemetry | otel (llm4s-observability-otel).
    mode = "console"
    mode = ${?TRACING_MODE}

    # Each backend's own block, llm4s.tracing.<mode>, ships in the reference.conf of
    # the module that reads it (#1133): `langfuse` (LANGFUSE_*) in llm4s-observability,
    # `opentelemetry` (OTEL_*) in llm4s-observability-otel. Core reads only `mode`,
    # and hands the selected mode's block to its backend as TracingSettings.extras.
  }

  # Raw provider exchange logging (optional).
  # When enabled, completed provider request/response exchanges are appended
  # to a new timestamped JSONL file inside the configured directory for local
  # inspection and debugging.
  exchangeLogging {
    enabled = false
    enabled = ${?LLM4S_EXCHANGE_LOGGING_ENABLED}

    # Example:
    # dir = "/tmp/llm4s/provider-exchanges"
    dir = ${?LLM4S_EXCHANGE_LOGGING_DIR}
  }

  # Embeddings configuration
  embeddings {
    # Unified format: provider/model (e.g., "openai/text-embedding-3-small")
    # Takes precedence over legacy provider + model settings
    model = ${?EMBEDDING_MODEL}

    # Legacy fallback (used if model is not set)
    provider   = ${?EMBEDDING_PROVIDER}
    inputPath  = ${?EMBEDDING_INPUT_PATH}
    inputPaths = ${?EMBEDDING_INPUT_PATHS}
    query      = ${?EMBEDDING_QUERY}

    # One block per embedding provider, keyed by provider id. Each binds that
    # provider's environment variables and nothing else: defaults live in the
    # provider's own EmbeddingConfigSpec, so they are stated once rather than
    # here and in Scala. A block travels with its provider when that provider
    # moves to its own module - HOCON merges these across jars.

    # Core ships no embedding provider, so it binds no block here:
    # llm4s.embeddings.ollama lives in llm4s-ollama's reference.conf,
    # llm4s.embeddings.openai in llm4s-openai's and llm4s.embeddings.voyage in
    # llm4s-voyage's.

    chunking {
      size    = ${?CHUNK_SIZE}
      overlap = ${?CHUNK_OVERLAP}
      enabled = ${?CHUNKING_ENABLED}
    }

    # Embeddings UI configuration (used by samples and tools).
    # These can also be controlled via env vars:
    #   MAX_ROWS_PER_FILE, TOP_DIMS_PER_ROW, GLOBAL_TOPK, SHOW_GLOBAL_TOP, COLOR, TABLE_WIDTH
    ui {
      maxRowsPerFile = 200
      maxRowsPerFile = ${?MAX_ROWS_PER_FILE}
      topDimsPerRow  = 6
      topDimsPerRow  = ${?TOP_DIMS_PER_ROW}
      globalTopK     = 10
      globalTopK     = ${?GLOBAL_TOPK}
      showGlobalTop  = false
      showGlobalTop  = ${?SHOW_GLOBAL_TOP}
      colorEnabled   = true
      colorEnabled   = ${?COLOR}
      tableWidth     = 120
      tableWidth     = ${?TABLE_WIDTH}
    }

    # Experimental stubs toggle for non-text embeddings (used by `FileEmbedder` in llm4s-rag).
    # Can also be controlled via ENABLE_EXPERIMENTAL_STUBS env var.
    experimentalStubs = ${?ENABLE_EXPERIMENTAL_STUBS}

    # Local/stub model names used for non-text modalities.
    # These are only used when experimental stubs are enabled.
    localModels {
      imageModel = "openclip-vit-b32"
      imageModel = ${?LLM4S_EMBEDDINGS_LOCAL_IMAGE_MODEL}
      audioModel = "wav2vec2-base"
      audioModel = ${?LLM4S_EMBEDDINGS_LOCAL_AUDIO_MODEL}
      videoModel = "timesformer-base"
      videoModel = ${?LLM4S_EMBEDDINGS_LOCAL_VIDEO_MODEL}
    }
  }

  # Runner-only convenience (apps may use):
  workspace {
    # Workspace directory for codegen tools (defaults to ~/code-workspace)
    dir = ${?WORKSPACE_DIR}

    # Workspace Docker image (defaults to WorkspaceSettings.DefaultImage)
    image = ${?WORKSPACE_IMAGE}

    # Workspace service port (defaults to WorkspaceSettings.DefaultPort)
    port = ${?WORKSPACE_PORT}

    # Trace log output path (defaults to <dir>/log/codegen-trace.md)
    traceLogPath = ${?WORKSPACE_TRACE_LOG}

    # Legacy override (ignored by PureConfig loader; keep comment for reference)
    # path = ${?WORKSPACE_PATH}
  }

  # Model registry metadata source.
  # Applications should load this at the boundary via
  # Llm4sConfig.modelRegistryConfig()/modelRegistryService().
  modelRegistry {
    resourcePath = ${?LLM4S_MODEL_REGISTRY_RESOURCE}
    filePath     = ${?LLM4S_MODEL_REGISTRY_FILE}
    url          = ${?LLM4S_MODEL_REGISTRY_URL}
  }
}
