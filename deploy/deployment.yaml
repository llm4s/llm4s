apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm4s-safe-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm4s-safe-deployment
  template:
    metadata:
      labels:
        app: llm4s-safe-deployment
    spec:
      containers:
        - name: service
          image: llm4s/safe-deployment:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
