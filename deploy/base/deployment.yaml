apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm4s-deploy-service
  labels:
    app.kubernetes.io/name: llm4s-deploy-service
    app.kubernetes.io/part-of: llm4s
spec:
  replicas: 1
  # Never drop below the desired capacity during a rollout: add a pod, wait for it to be ready, then retire one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm4s-deploy-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm4s-deploy-service
        app.kubernetes.io/part-of: llm4s
    spec:
      # On SIGTERM the service drains its worker (llm4s.agent.worker.drain: 30 s for running runs to finish, then 10 s
      # for cancelled ones to exit) before it stops; give it that long and a margin before the kubelet kills it.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          # The tag is deliberately absent. The pipeline (.github/workflows/deploy-staged.yml) sets the
          # registry, the name and an immutable tag (the commit SHA) when it deploys, so every environment
          # runs exactly the image that was built and tested, and a rollback names a tag that still exists.
          image: llm4s/deploy-service
          ports:
            - name: http
              containerPort: 8080
          env:
            # The pod's name labels its claims and its worker's leases, so the logs and the store say which pod holds
            # a thread or a queue entry.
            - name: LLM4S_RUNTIME_LABEL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LLM4S_WORKER_LABEL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The service listens on PORT (default 8080). /health is the process; /ready is the agent worker's health
          # (running, its loop alive, the store answering), so a pod whose store is unreachable, or that is draining,
          # takes no traffic. /llm-check is NOT a probe, so a missing provider key does not take the pods out of rotation.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            # The root filesystem is read-only; the JVM needs somewhere to write temporary files.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
