# The AI gateway: a LiteLLM proxy that holds the provider keys, so the app never sees one. The app reaches it at
# http://litellm:4000/v1 with its own gateway key (application.conf). Replace it with the gateway your organisation
# mandates (Envoy AI Gateway, Kong, Azure API Management, ...): the app's side changes only in baseUrl and the key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: llm4s
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: llm4s
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          # Pinned: a gateway upgrade is a change to review, not something a restart picks up.
          image: ghcr.io/berriai/litellm:main-v1.83.14-stable
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            # The provider key and the gateway's master key, synced from the secret store by externalsecret.yaml.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm4s-provider-keys
                  key: OPENAI_API_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: llm4s-provider-keys
                  key: LITELLM_MASTER_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: llm4s
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
