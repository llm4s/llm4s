# Keys come from your secret store through the External Secrets Operator, never from these manifests. Create a
# ClusterSecretStore named llm4s-secret-store for your store (AWS Secrets Manager, Vault, Azure Key Vault, GCP Secret
# Manager, ...) and put the three secrets at the keys named below.
#
# The gateway reads its keys as environment variables, so a rotated provider key reaches it on its next restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm4s-provider-keys
  labels:
    app.kubernetes.io/part-of: llm4s
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: llm4s-secret-store
    kind: ClusterSecretStore
  target:
    name: llm4s-provider-keys
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: prod/llm4s/openai-api-key
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: prod/llm4s/litellm-master-key
---
# The app's gateway key, mounted as a file (deployment-gateway.yaml) that its section's apiKeyFile names. The kubelet
# rewrites the file when the operator updates the Secret, and llm4s sends the new key from the next request: rotating
# it needs no restart. Mount it as a volume, never with subPath, which the kubelet does not update.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm4s-gateway-key
  labels:
    app.kubernetes.io/part-of: llm4s
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: llm4s-secret-store
    kind: ClusterSecretStore
  target:
    name: llm4s-gateway-key
  data:
    - secretKey: gateway-api-key
      remoteRef:
        key: prod/llm4s/gateway-api-key
